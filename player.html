        async function buildSourcePanel() {
            sourcePanel.innerHTML = `<div class="panel-label">Select Server</div>`;
            
            // Add Reset to Auto option
            const autoItem = document.createElement('div');
            autoItem.className = `src-item ${!FORCED_PROVIDER ? 'active' : ''}`;
            autoItem.dataset.auto = '1';
            autoItem.innerHTML = `<span class="src-dot"></span><b>Auto (Recommended)</b>`;
            autoItem.onclick = () => {
                if (FORCED_PROVIDER) {
                    FORCED_PROVIDER = '';
                    sourcePanel.classList.remove('open');
                    syncUrlState(); 
                    fetchSources(null);
                } else {
                    sourcePanel.classList.remove('open');
                }
            };
            sourcePanel.appendChild(autoItem);

            // If we have FlixHQ episode info, fetch available servers and add as selectable backups
            if (window._lastFlixhqEpisodeId && window._flixhqMovieBase) {
                try {
                    const serversUrl = `${window._flixhqMovieBase}/servers?episodeId=${encodeURIComponent(window._lastFlixhqEpisodeId)}`;
                    const { res } = await fetchJsonWithApiFallback(serversUrl, { signal: AbortSignal.timeout(10000) });
                    if (res && res.ok) {
                        const payload = await res.json();
                        const rows = Array.isArray(payload) ? payload : payload?.data || payload?.servers || [];
                        (rows || []).forEach((sv) => {
                            const name = String(sv?.serverName || sv?.name || sv?.serverName || sv?.server || '').trim() || String(sv?.serverUrl || sv?.link || sv?.serverId || '').trim();
                            if (!name) return;
                            const serverId = String(sv?.serverName || sv?.name || sv?.server || name).trim().toLowerCase();
                            const item = document.createElement('div');
                            item.className = `src-item ${activeFlixhqServerName === serverId ? 'active' : ''}`;
                            item.dataset.serverId = serverId;
                            item.innerHTML = `<span class="src-dot"></span>FlixHQ - ${name}`;
                            item.addEventListener('click', async (event) => {
                                event.preventDefault();
                                event.stopPropagation();
                                try {
                                    item.classList.add('loading');
                                    const watchUrl = `${window._flixhqMovieBase}/watch?episodeId=${encodeURIComponent(window._lastFlixhqEpisodeId)}&server=${encodeURIComponent(serverId)}&strictServer=true${DIRECT_ONLY ? '&directOnly=true' : ''}`;
                                    const { res: wres } = await fetchJsonWithApiFallback(watchUrl, { signal: AbortSignal.timeout(30000) });
                                    if (!wres || !wres.ok) throw new Error(`Server ${name} returned ${wres?.status || 'no response'}`);
                                    const wpayload = await wres.json();
                                    const rows = Array.isArray(wpayload?.sources) ? wpayload.sources : [];
                                    const mapped = (rows || [])
                                        .filter(r => r && r.url)
                                        .map((src) => {
                                        const low = String(src.url || '').toLowerCase();
                                        const isM3U8 = low.includes('.m3u8') || /m3u8-proxy/i.test(low) || Boolean(src.isM3U8);
                                        const isEmbed = src.isEmbed ?? (!isM3U8 && !low.includes('.mp4'));
                                        const qualityLabel = src.quality || (isM3U8 ? 'HLS' : 'Embed');
                                        return {
                                            label: `FlixHQ - ${name} ${qualityLabel}`,
                                            url: src.url,
                                            isM3U8,
                                            isEmbed,
                                            referer: src.referer || wpayload?.headers?.Referer || null,
                                            provider: 'flixhq',
                                            flixhqServer: serverId,
                                        };
                                    })
                                    .filter((src) => {
                                        const low = String(src.url || '').toLowerCase();
                                        return src.url && !src.isEmbed && (src.isM3U8 || low.includes('.mp4') || low.includes('.mpd'));
                                    });
                                    if (!mapped.length) throw new Error(`No direct playable sources from ${name}`);
                                    activeFlixhqServerName = serverId;
                                    // Replace the previous manual FlixHQ server choice, but keep other provider/source rows.
                                    allSources = mapped.concat((allSources || []).filter((src) => !src?.manualFlixhqServer));
                                    mapped.forEach((src) => { src.manualFlixhqServer = true; });
                                    window.allSources = allSources;
                                    // Rebuild panel and start playback on first server source
                                    buildSourcePanel();
                                    if (mapped.length > 0) selectSource(0);
                                    sourcePanel.classList.remove('open');
                                } catch (err) {
                                    console.warn('[flixhq server fetch] failed:', err?.message || err);
                                    item.classList.remove('loading');
                                    item.classList.add('failed');
                                    setTimeout(() => item.classList.remove('failed'), 1200);
                                }
                            });
                            sourcePanel.appendChild(item);
                        });
                    }
                } catch (err) {
                    console.warn('[buildSourcePanel] flixhq servers fetch failed:', err?.message || err);
                }
            }

            allSources.forEach((src, i) => {
                const item = document.createElement('div');
                // Use currentIdx to preserve active highlight when list rebuilds after new provider arrives
                item.className = `src-item`;
                item.dataset.srcIndex = String(i);
                if (i === (currentIdx ?? 0)) item.classList.add('active');
                item.innerHTML = `<span class="src-dot"></span>${src.label}`;
                item.onclick = () => { selectSource(i); sourcePanel.classList.remove('open'); };
                sourcePanel.appendChild(item);
            });
            // Ensure panel shows only one active item
            try { updateSourceUI(typeof currentIdx === 'number' ? currentIdx : null); } catch (_) { }
        }

        function updateSourceUI(idx) {
            // Ensure only one .src-item is active at any time.
            const items = sourcePanel.querySelectorAll('.src-item');
            items.forEach((el) => el.classList.remove('active'));

            if (typeof idx === 'number' && Number.isFinite(idx)) {
                const el = sourcePanel.querySelector(`.src-item[data-src-index=\"${idx}\"]`);
                if (el) el.classList.add('active');
                const src = allSources?.[idx];
                const serverName = String(src?.flixhqServer || '').toLowerCase();
                if (serverName) {
                    const serverEl = sourcePanel.querySelector(`.src-item[data-server-id=\"${serverName}\"]`);
                    if (serverEl) serverEl.classList.add('active');
                }
            } else {
                // No source selected -> mark Auto active
                const autoEl = sourcePanel.querySelector('.src-item[data-auto]');
                if (autoEl) autoEl.classList.add('active');
            }
        }

        function selectSource(idx, explicitStartTime = null) {
            const explicitTime = Number(explicitStartTime);
            const hasExplicitTime = Number.isFinite(explicitTime) && explicitTime >= 0;
            const savedTime = hasExplicitTime
                ? explicitTime
                : ((video && !video.ended) ? video.currentTime : 0);
            currentIdx = idx;

            const src = allSources[idx];
            if (!src) {
                // No source at this index: mark Auto active and exit
                updateSourceUI(null);
                return;
            }

            // Remember if user prefers Dubbed or Subbed
            const label = String(src.label || '').toLowerCase();
            if (label.includes('dubbed')) {
                preferredSourceLabelMatch = 'dubbed';
                preferredAudioToken = 'dubbed';
            } else if (label.includes('subbed')) {
                preferredSourceLabelMatch = 'subbed';
                preferredAudioToken = 'subbed';
            }

            // Also remember the provider preference
            if (src.provider) {
                FORCED_PROVIDER = src.provider;
                const scopedProvider = String(src.provider || '').trim().toLowerCase();
                if (providerSeasonCatalog.has(scopedProvider)) {
                    activeMenuProvider = scopedProvider;
                }
            }
            if (src.flixhqServer) {
                activeFlixhqServerName = String(src.flixhqServer || '').toLowerCase();
            }

            // Update UI after we set FORCED_PROVIDER so Auto highlight is correct
            updateSourceUI(idx);

            if (MEDIA_TYPE === 'tv') {
                buildEpPanel();
                updateEpUI(curSeason, curEpisode);
            }

            playSource(idx, savedTime);
            syncUrlState();
        }

        function resetPlayerSurface() {
            if (hlsInst) { try { hlsInst.stopLoad(); hlsInst.detachMedia(); hlsInst.destroy(); } catch (_) { } hlsInst = null; }
            clearVideoMediaSource();
            if (dashInst) { try { dashInst.reset(); } catch (_) { } dashInst = null; }
            if (plyr) { try { plyr.destroy(); } catch (_) { } plyr = null; }
            const wrap = document.querySelector('.player-wrap');
            if (wrap) {
                // Remove only the video element, keep the brightness overlay
                const oldVideo = wrap.querySelector('video');
                if (oldVideo) oldVideo.remove();
                
                // Also clean up any extra plyr wrappers that might have been left behind
                const extraWrappers = wrap.querySelectorAll('.plyr');
                extraWrappers.forEach(w => w.remove());

                const newVideo = document.createElement('video');
                newVideo.id = 'player-video';
                newVideo.className = 'plyr-video';
                // On iOS, autoplaying often leads to persistent loaders or audio track issues.
                // Disabling it ensures a clean user gesture when they tap play.
                newVideo.autoplay = !IS_IOS;
                newVideo.muted = IS_IOS ? true : false;
                // Force playsinline on all iOS devices to ensure track probing happens properly in the browser context.
                newVideo.playsInline = true;
                newVideo.setAttribute('playsinline', '');
                newVideo.setAttribute('webkit-playsinline', 'true');
                newVideo.crossOrigin = 'anonymous';
                newVideo.preload = 'auto';
                wrap.insertBefore(newVideo, wrap.firstChild);
            }
            video = document.getElementById('player-video');
        }

        // ----------------------------------------------------------------------------------------------------
        //  PLAY SOURCE
        // ----------------------------------------------------------------------------------------------------
        function playSource(idx, startTime = 0) {
            const src = allSources[idx];
            if (!src) return;

            if (src.provider === 'vegamovies' && satoruAudioSources.length > 0) {
                currentAudioSource = 'satoru';
                activeSatoruTrackIndex = 0;
            }

            const statusLabel = startTime > 0 ? 'Switching Server...' : 'Buffering...';
            setLoader(statusLabel, src.label);
            loadStream(src.url, src.isM3U8, src.isEmbed, src.referer, idx, startTime);
        }

        function proxiedStreamUrl(url, referer, provider = '') {
            const rawUrl = String(url || '').trim();
            const providerName = String(provider || '').toLowerCase();
            // Cinezo already returns proxy-wrapped HLS links; avoid double-proxying those.
            if (/\/(?:m3u8-proxy|utils\/proxy)(?:[/?]|$)/i.test(rawUrl)) {
                return rawUrl;
            }
            // StreamRuby HLS often rejects server-side proxy requests (403) even with referer,
            // but plays directly in browser context.
            if (/https?:\/\/[^/]*streamruby\.net\//i.test(rawUrl) && providerName !== 'justanime') {
                return rawUrl;
            }
            // VegaMovies tokenized URLs are unstable with reverse proxy overhead;
            // direct browser access often succeeds where proxy fails.
            if (providerName === 'vegamovies') {
                return rawUrl;
            }
            const apiBaseUrl = new URL(activeApiBase || API_BASE, location.href);
            let apiOrigin = `${apiBaseUrl.protocol}//${apiBaseUrl.host}`;
            const ref = referer ? `&referer=${encodeURIComponent(referer)}` : '';
            return `${apiOrigin}/utils/proxy?url=${encodeURIComponent(rawUrl)}${ref}`;
        }

        function warmupPreviewVideo(previewVideo) {
            if (!previewVideo) return;
            try {
                previewVideo.muted = true;
                previewVideo.preload = 'auto';
                previewVideo.playsInline = true;
                previewVideo.setAttribute('playsinline', 'true');
                previewVideo.setAttribute('webkit-playsinline', 'true');

                const onReady = () => {
                    try {
                        if (isFinite(previewVideo.duration) && previewVideo.duration > 2) {
                            previewVideo.currentTime = 1.0;
                        }
                        const maybe = previewVideo.play?.();
                        if (maybe && typeof maybe.then === 'function') {
                            maybe.then(() => {
                                try { previewVideo.pause(); } catch (_) { }
                            }).catch(() => { });
                        }
                    } catch (_) { }
                };

                previewVideo.addEventListener('loadedmetadata', onReady, { once: true });
                previewVideo.addEventListener('canplay', onReady, { once: true });
            } catch (_) {
                // ignore preview warmup failures
            }
        }

        function clearVideoMediaSource(videoEl = video) {
            if (!videoEl) return;
            try {
                videoEl.removeAttribute('src');
                videoEl.src = '';
                videoEl.load();
            } catch (_) { }
        }

        function loadStream(url, isM3U8, isEmbed, referer, srcIdx, startTime = 0) {
            console.log('loadStream:', { url, isM3U8, isEmbed, srcIdx, startTime });
            const sourceProvider = String(allSources?.[srcIdx]?.provider || '').toLowerCase();
            const proxyOnlyProvider = sourceProvider === 'justanime' || sourceProvider === 'animesalt';
            const resumeTargetTime = Math.max(0, Number(startTime || 0));
            const useWarmStartResume = sourceProvider === 'flixhq' && resumeTargetTime > 20;
            let nextSourceFallbackUsed = false;
            let sourceContextActive = true;
            let cancelHlsStartupWatchdog = () => { };
            const isStaleSourceContext = () => {
                if (!sourceContextActive) return true;
                if (currentIdx !== srcIdx) return true;
                const activeUrl = String(allSources?.[srcIdx]?.url || '');
                return !!activeUrl && activeUrl !== String(url || '');
            };
            const deactivateSourceContext = () => {
                sourceContextActive = false;
                try { cancelHlsStartupWatchdog(); } catch (_) { }
            };
            const getFailoverResumeTime = () => {
                const pendingTime = Number(pendingJumpTarget?.time);
                const requestedTime = Number(lastRequestedPlaybackTarget);
                const videoTime = Number(video?.currentTime || 0);
                const startTimeNum = Number(startTime || 0);
                const globalStartTime = Number(startT || 0);

                if (Number.isFinite(pendingTime) && pendingTime > 0.25) return Math.max(0, pendingTime);
                if (Number.isFinite(requestedTime) && requestedTime > 0.25) return Math.max(0, requestedTime);
                if (Number.isFinite(videoTime) && videoTime > 0.25) return Math.max(0, videoTime);
                if (Number.isFinite(startTimeNum) && startTimeNum > 0.25) return Math.max(0, startTimeNum);
                if (Number.isFinite(globalStartTime) && globalStartTime > 0.25) return Math.max(0, globalStartTime);
                return 0;
            };
            const failoverToNextSource = (reason = 'unknown') => {
                if (isStaleSourceContext()) return false;
                if (nextSourceFallbackUsed) return false;
                const reasonText = String(reason || '').toLowerCase();
                const shouldPreferNonHlsFallback =
                    sourceProvider === 'vegamovies' &&
                    (reasonText.includes('manifest') || reasonText.includes('direct_url_failed') || reasonText.includes('fatal'));
                let nextIdx = -1;
                if (Array.isArray(allSources) && shouldPreferNonHlsFallback) {
                    nextIdx = allSources.findIndex((s, i) => {
                        if (i === srcIdx) return false;
                        const srcUrl = String(s?.url || '').toLowerCase();
                        return !!(s?.isEmbed || !s?.isM3U8 || srcUrl.includes('.mp4'));
                    });
                }
                if (nextIdx < 0) {
                    nextIdx = Array.isArray(allSources)
                        ? allSources.findIndex((_, i) => i > srcIdx)
                        : -1;
                }
                if (nextIdx < 0) return false;
                nextSourceFallbackUsed = true;
                deactivateSourceContext();
                const resumeAt = getFailoverResumeTime();
                if (resumeAt > 0) {
                    pendingJumpTarget = { time: resumeAt, reason: 'server_failover' };
                    lastRequestedPlaybackTarget = resumeAt;
                    startT = resumeAt;
                }
                console.warn(`[stream-failover] Switching to next source idx=${nextIdx} reason=${reason}`);
                try {
                    selectSource(nextIdx, resumeAt);
                    return true;
                } catch (_) {
                    return false;
                }
            };
            const tryAlternateFlixhqServer = async (reason = 'unknown') => {
                if (flixhqAltServerAttempted) return false;
                if (String(sourceProvider || '').toLowerCase() !== 'flixhq') return false;
                const mediaType = String(MEDIA_TYPE || '').toLowerCase();
                if (mediaType !== 'movie' && mediaType !== 'tv') return false;
                const candidateServers = ['vidking', 'videasy', 'megacloud', 'vidcloud', 'upcloud', 'flixhq'];
                for (const serverName of candidateServers) {
                    try {
                        const watchParams = new URLSearchParams();
                        watchParams.set('id', String(TMDB_ID || ''));
                        watchParams.set('type', mediaType);
                        watchParams.set('provider', 'flixhq');
                        watchParams.set('directOnly', 'true');
                        watchParams.set('server', serverName);
                        if (mediaType === 'tv') {
                            const selectedSeason = tvSeasons?.[curSeason];
                            const selectedEpisode = selectedSeason?.episodes?.[curEpisode];
                            const selectedSeasonNoRaw = Number(selectedSeason?.seasonNo);
                            const selectedEpisodeNoRaw = Number(
                                selectedEpisode?.episode || selectedEpisode?.number || selectedEpisode?.episodeNum,
                            );
                            const selectedSeasonNo = Number.isFinite(selectedSeasonNoRaw) && selectedSeasonNoRaw > 0
                                ? selectedSeasonNoRaw
                                : (Number(curSeason) + 1);
                            const selectedEpisodeNo = Number.isFinite(selectedEpisodeNoRaw) && selectedEpisodeNoRaw > 0
                                ? selectedEpisodeNoRaw
                                : (Number(curEpisode) + 1);
                            watchParams.set('season', String(selectedSeasonNo));
                            watchParams.set('episode', String(selectedEpisodeNo));
                        }

                        const watchUrl = `${API_BASE}/watch?${watchParams.toString()}`;
                        const { res } = await fetchJsonWithApiFallback(watchUrl, {
                            signal: AbortSignal.timeout(30000),
                        });
                        if (!res.ok) continue;
                        const payload = await res.json();
                        const rows = Array.isArray(payload?.sources) ? payload.sources : [];
                        const mapped = rows
                            .filter((src) => {
                                const srcUrl = String(src?.url || '');
                                if (!srcUrl || isBrokenEmbedUrl(srcUrl) || isLikelyPlaceholderSource(srcUrl)) return false;
                                return srcUrl !== String(url || '');
                            })
                            .map((src, i) => {
                                const low = String(src.url || '').toLowerCase();
                                const isVegamoviesTokenizedPlaylist = provider === 'vegamovies' && low.includes('/playlist/') && low.includes('.txt');
                                const isM3U8 = !isVegamoviesTokenizedPlaylist && (src.isM3U8 || src.isM3u8 || low.includes('.m3u8') || low.includes('m3u8-proxy') || low.includes('getm3u8'));
                                const isEmbed = src.isEmbed ?? (!isM3U8 && !low.includes('.mp4'));
                                return {
                                    label: `FlixHQ - ${serverName} backup ${i + 1}`,
                                    url: src.url,
                                    isM3U8,
                                    isEmbed,
                                    referer: src.referer || payload?.headers?.Referer || null,
                                    provider: 'flixhq',
                                };
                            });
                        if (!mapped.length) continue;
                        const existingUrls = new Set((Array.isArray(allSources) ? allSources : []).map((s) => String(s?.url || '')));
                        const uniqueMapped = mapped.filter((s) => !existingUrls.has(String(s?.url || '')));
                        if (!uniqueMapped.length) continue;
                        allSources.push(...uniqueMapped);
                        buildSourcePanel();
                        sourceBtn.style.display = 'flex';
                        const resumeAt = getFailoverResumeTime();
                        if (resumeAt > 0) {
                            pendingJumpTarget = { time: resumeAt, reason: 'server_failover' };
                            lastRequestedPlaybackTarget = resumeAt;
                            startT = resumeAt;
                        }
                        flixhqAltServerAttempted = true;
                        console.warn(`[stream-failover] Injected FlixHQ ${serverName} backup source(s) due to ${reason}`);
                        selectSource(allSources.length - uniqueMapped.length, resumeAt);
                        return true;
                    } catch (_) {
                        // try next server candidate
                    }
                }
                flixhqAltServerAttempted = true;
                return false;
            };
            const effectiveStartTime = useWarmStartResume ? 0 : resumeTargetTime;
            skipInitialCanplaySeekOnce = useWarmStartResume;
            window.previewSeeking = false;
            isSourceSwitching = true;
            hlsFragErrorBurst = 0;
            hlsSessionIsFragile = false;
            initialSeekDone = false;
            lastRequestedPlaybackTarget = effectiveStartTime;
            jumpCooldownUntil = 0;
            jumpInFlightUntil = 0;
            pendingJumpTarget = null;
            if (jumpRecoveryTimer) {
                clearTimeout(jumpRecoveryTimer);
                jumpRecoveryTimer = null;
            }
            let sameSourceRecoveryLock = false;
            const recoveryKey = `${srcIdx}|${String(url || '')}`;
            if (sameSourceRecoverKey !== recoveryKey) {
                sameSourceRecoverKey = recoveryKey;
                sameSourceRecoverCount = 0;
            }
            
            // Reset state for new load
            activeSubtitleTrackIndex = -1;
            renderSubtitleOverlayFromTrack(null);
            
            const previewVideo = document.getElementById('previewVideo');
            if (previewVideo) previewVideo.muted = true;

            // Check if we can seek instead of reloading for the same source
            if (hlsInst && url === currentStreamUrl && isM3U8 && Hls.isSupported() && video && isFinite(video.duration) && effectiveStartTime > 0 && effectiveStartTime < video.duration) {
                console.log('Seamless seek: seeking to', effectiveStartTime, 'without reloading HLS');
                isSourceSwitching = false;
                video.currentTime = effectiveStartTime;
                hideLoader();
                return;
            }

            currentStreamUrl = String(url || '');
            currentStreamReferer = referer || null;
            currentStreamProvider = sourceProvider;

            if (MEDIA_TYPE === 'tv' && currentIsLikelyAnime && sourceProvider && providerSeasonCatalog.has(sourceProvider)) {
                activeMenuProvider = sourceProvider;
                buildEpPanel();
                updateEpUI(curSeason, curEpisode);
            }

            // Visual Bridge: capture current frame before we wipe anything.
            // Skip on the very first load — the #loader (with cover art) is already
            // covering everything, so there's no black gap to bridge.
            if (!isFirstLoad) {
                captureVideoFrameToOverlay();
            } else {
                showLoader();
            }

            // Capture volume/mute state before teardown so we can restore it
            const savedVolume = (video && isFinite(video.volume)) ? video.volume : 1;
            const savedMuted = video ? video.muted : false;

            // Tear down previous
            if (hlsInst) { try { hlsInst.stopLoad(); hlsInst.detachMedia(); hlsInst.destroy(); } catch (_) { } hlsInst = null; }
            clearVideoMediaSource();
            if (window.previewHlsInst) { try { window.previewHlsInst.stopLoad(); window.previewHlsInst.detachMedia(); window.previewHlsInst.destroy(); } catch (_) { } window.previewHlsInst = null; }
            if (dashInst) { try { dashInst.reset(); } catch (_) { } dashInst = null; }
            if (window.previewDashInst) { try { window.previewDashInst.reset(); } catch (_) { } window.previewDashInst = null; }
            if (plyr) { try { plyr.destroy(); } catch (_) { } plyr = null; }

            // Prepare video element with extra attributes for better mobile/chrome compatibility
            // Overlay is already 'active' from captureVideoFrameToOverlay() — keep it visible
            // so there's NO flash of a resized/blank video during teardown
            const overlay = document.getElementById('transition-overlay');
            if (!isFirstLoad && overlay && !overlay.classList.contains('active')) {
                overlay.style.backgroundColor = '#000';
                overlay.classList.add('active');
            }

            const wrap = document.querySelector('.player-wrap');
            if (wrap) {
                // Preserve the brightness overlay to keep gesture functionality working
                const oldVideo = wrap.querySelector('video');
                if (oldVideo) wrap.removeChild(oldVideo);
                const newVideo = document.createElement('video');
                newVideo.id = 'player-video';
                newVideo.className = 'plyr-video';
                newVideo.autoplay = !IS_IOS;
                newVideo.muted = IS_IOS ? true : false;
                // Force playsinline on all iOS devices to ensure track probing happens properly in the browser context.
                newVideo.playsInline = true;
                newVideo.setAttribute('playsinline', '');
                newVideo.setAttribute('webkit-playsinline', 'true');
                newVideo.crossOrigin = 'anonymous';
                newVideo.preload = 'auto';
                wrap.insertBefore(newVideo, wrap.firstChild);
            }
            video = document.getElementById('player-video');
            if (video) { video.volume = savedVolume; video.muted = savedMuted; } // Restore volume across switches

            // Some sources sound robotic when any prior non-1x rate or boosted
            // WebAudio gain remains active across source switches.
            if ((sourceProvider === 'vegamovies' || sourceProvider === 'flixhq') && video) {
                try {
                    video.playbackRate = 1;
                    if ('preservesPitch' in video) video.preservesPitch = true;
                    if ('webkitPreservesPitch' in video) video.webkitPreservesPitch = true;
                } catch (_) { }
                if (sourceProvider === 'vegamovies' && Number(volumeBoost || 100) > 100) {
                    volumeBoost = 100;
                }
            }

            let startT = effectiveStartTime;
            let overlayHidden = false;
            const hideOverlay = () => {
                if (overlayHidden) return;
                overlayHidden = true;
                hideTransitionOverlay();
            };
            const cleanup = () => {
                if (video && video.currentTime > startT + 0.5) {
                    hideOverlay();
                    video.removeEventListener('timeupdate', cleanup);
                }
            };
            video.addEventListener('timeupdate', cleanup);
            // Safety: hide overlay after 6s max so it never gets stuck
            setTimeout(hideOverlay, 6000);

            // Volume boost
            setVolumeBoost(volumeBoost);

            const initPlyr = () => {
                console.log('Initializing Plyr...');
                // Ensure subtitles are applied to the NEW video element. 
                // Sync version for native iOS probe early-takeover, async for others.
                applyExternalSubtitlesToVideoSync(video);
                applyExternalSubtitlesToVideo(video);
                // Extra sync for iOS just in case
                if (IS_IOS) setTimeout(() => applyExternalSubtitlesToVideoSync(video), 600);
                const qualities = hlsInst
                    ? [...new Set(hlsInst.levels.map(l => l.height).filter(Boolean))]
                    : [];
                const maxH = qualities.length ? Math.max(...qualities) : 720;

                plyr = new Plyr(video, {
                    blankVideo: 'data:video/mp4;base64,AAAAHGZ0eXBtcDQyAAAAAG1wNDJpc29tYXZjMQAAADpmcmVlAAAAAG1kYXQ=',
                    autoplay: !IS_IOS,
                    muted: video.muted,
                    clickToPlay: false,
                    keyboard: false,
                    controls: [
                        'play-large',
                        'play',
                        'rewind',
                        'fast-forward',
                        'progress',
                        'current-time',
                        'duration',
                        'mute',
                        'volume',
                        'settings',
                        'captions',
                        'pip',
                        'airplay',
                        'fullscreen'
                    ],
                    captions: { active: false, update: true, language: 'auto' },
                    quality: qualities.length
                        ? { default: maxH, options: [0, ...qualities], forced: true, onChange: changeQuality }
                        : {},
                    speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
                });
                bindVideoEvents();
                syncTimeUI();
                updateMuteIcon();
                updateCaptionsButtonVisibility();
                showControlSurface();

                // Load subtitles after player is ready
                plyr.on('ready', async () => {
                    // Hide loader on iOS or if not first load
                    if (!isFirstLoad || IS_IOS) hideLoader();
                });

                // Sync play icon in case video was already playing when Plyr initialized
                if (video && !video.paused) setPlayIcon(true);
                const hideIfReady = () => {
                    if (video && video.readyState >= 2) {
                        hideLoader();
                    }
                };
                plyr.on('canplay', hideIfReady);
                plyr.on('playing', () => {
                    isFirstLoad = false;
                    hideLoader();
                    try { hideTransitionOverlay(); } catch (_) { }
                });
                plyr.on('play', () => {
                    setPlayIcon(true);
                    showControlSurface();
                });
                plyr.on('pause', () => {
                    setPlayIcon(false);
                    controlSurface.classList.add('visible');
                });
            };

            const showProviderExhaustedError = (reason = 'unknown') => {
                const providerName = String(sourceProvider || currentStreamProvider || '').toLowerCase();
                if (providerName === 'vegamovies') {
                    showError(
                        'Vegamovies Unavailable',
                        'Vegamovies only returned invalid direct stream manifests for this title. Try another provider or the site embed if one becomes available.'
                    );
                    return;
                }
                showError(
                    'Stream Decode Error',
                    'Playback could not recover. Please choose another server manually.'
                );
            };

            const recoverSameSource = (reason = 'unknown') => {
                if (isStaleSourceContext()) return;
                if (sameSourceRecoveryLock) return;
                sameSourceRecoveryLock = true;
                const currentTime = (video && video.currentTime > 0) ? video.currentTime : startTime;
                sameSourceRecoverCount += 1;
                console.warn(`[hls] Recovering same source (attempt ${sameSourceRecoverCount}) reason=${reason}`);

                // Capture last visible frame immediately to prevent black screen flash during rebuild
                try { captureVideoFrameToOverlay(); } catch (_) { }

                const lowerReason = String(reason || '').toLowerCase();
                const isVegamoviesManifestFailure =
                    sourceProvider === 'vegamovies' &&
                    (lowerReason.includes('manifest') || lowerReason.includes('network') || lowerReason.includes('startup_timeout'));
                const maxAttempts = isVegamoviesManifestFailure ? 2 : (reason === 'fatal_network_error' ? 1 : 8);

                if (hlsInst && isM3U8 && sameSourceRecoverCount <= maxAttempts) {
                    try {
                        const jump = sameSourceRecoverCount > 12 ? 2.6 : (sameSourceRecoverCount > 5 ? 1.4 : 0.25);
                        const pendingTargetTime = pendingJumpTarget?.time;
                        const near = Math.max(0, Number.isFinite(pendingTargetTime) ? pendingTargetTime : Number(currentTime || 0) + jump);
                        const resumeAt = Math.max(0, Number.isFinite(pendingTargetTime) ? pendingTargetTime : Number(video?.currentTime || near));
                        showBufferingOverlay();

                        // Always do a clean in-place HLS rebuild.
                        // recoverMediaError() alone leaves a blank video when the pipeline is truly broken.
                        // svSwitchHlsSourceSilent destroys the old instance and rebuilds from scratch,
                        // ensuring video resumes at the correct time without a black frame.
                        pendingJumpTarget = { time: resumeAt, reason: pendingJumpTarget?.reason || 'recover' };
                        const isForced = reason === 'fatal_frag_parse_jump'
                            || reason === 'watchdog_stall'
                            || reason === 'buffer_full_unrecoverable';
                        setTemporaryRecoveryQuality(isForced ? 7000 : 5000);
                        svSwitchHlsSourceSilent(url, referer, () => {
                            hlsFragErrorBurst = 0;
                            hlsSessionIsFragile = false;
                            hideBufferingOverlaySoon(120);
                            if (video && video.paused) {
                                Promise.resolve(video.play()).catch(() => {
                                    video.muted = true;
                                    Promise.resolve(video.play()).catch(() => { });
                                });
                            }
                        }, null, true, srcIdx);
                    } catch (_) { }
                    setTimeout(() => { sameSourceRecoveryLock = false; }, 600);
                    return;
                }

                // Exhausted all recovery attempts
                sameSourceRecoveryLock = false;
                if (failoverToNextSource(`same_source_exhausted:${reason}`)) {
                    return;
                }
                tryAlternateFlixhqServer(`same_source_exhausted:${reason}`).then((switched) => {
                    if (switched) return;
                    showProviderExhaustedError(reason);
                });
            };

            const isMPD = String(url || '').toLowerCase().includes('.mpd');

            // 1. HLS with hls.js
            if (isM3U8 && Hls.isSupported()) {
                console.log('Branch: HLS.js');
                const streamUrl = proxiedStreamUrl(url, referer, sourceProvider);
                // Track whether we've already tried the raw (unproxied) URL.
                // Some CDNs (e.g. satoru.one) block reverse-proxy user agents with 502/403
                // but allow direct browser access, so we fall back to raw after proxy failure.
                let hlsDirectFallbackAttempted = false;

                const recoverWithDirectUrl = (resumeTime) => {
                    if (proxyOnlyProvider) return false;
                    if (hlsDirectFallbackAttempted) return false;
                    hlsDirectFallbackAttempted = true;
                    const directUrl = String(url || '').trim();
                    if (!directUrl || directUrl === streamUrl) return false; // same URL — nothing to try
                    console.warn('[hls] Proxy returned error; retrying with direct (unproxied) URL:', directUrl);
                    showBufferingOverlay();
                    try {
                        if (hlsInst) { hlsInst.stopLoad(); hlsInst.detachMedia(); hlsInst.destroy(); hlsInst = null; }
                        clearVideoMediaSource();
                        hlsInst = svCreateHlsInstance(resumeTime, false, currentStreamProvider);
                        svAttachHlsListeners(hlsInst, resumeTime, () => {
                            // If Plyr was never initialized (proxy failed before MANIFEST_PARSED),
                            // we must initialize it now so the player controls appear.
                            if (!plyr) initPlyr();
                            hideBufferingOverlaySoon(120);
                            isFirstLoad = false;
                            hideLoader();
                            if (video && video.paused) {
                                Promise.resolve(video.play()).catch(() => { video.muted = true; Promise.resolve(video.play()).catch(() => {}); });
                            }
                        }, (reason2) => {
                            console.warn('[hls] Direct URL also failed:', reason2);
                            sameSourceRecoveryLock = false;
                            if (failoverToNextSource(`direct_url_failed:${reason2}`)) {
                                return;
                            }
                            tryAlternateFlixhqServer(`direct_url_failed:${reason2}`).then((switched) => {
                                if (switched) return;
                                showProviderExhaustedError(reason2);
                            });
                        });
                        hlsInst.loadSource(directUrl);
                        hlsInst.attachMedia(video);
                    } catch (_) { return false; }
                    return true;
                };

                // Wrap recoverSameSource to inject direct-URL step before giving up
                const recoverSameSourceWithDirectFallback = (reason) => {
                    if (isStaleSourceContext()) return;
                    const lowerReason = String(reason || '').toLowerCase();
                    const isAnimeKaiStream = String(sourceProvider || '').toLowerCase() === 'animekai';
                    const isFlixHqStream = String(sourceProvider || '').toLowerCase() === 'flixhq';
                    const isUsingProxyStream = streamUrl !== String(url || '').trim();
                    const shouldPreferDirectRetry = isUsingProxyStream && (
                        reason === 'fatal_network_error'
                        || lowerReason.includes('manifest')
                        || lowerReason.includes('startup_timeout')
                        || lowerReason.includes('level_timeout')
                        || lowerReason.includes('network')
                    );
                    if (shouldPreferDirectRetry && !hlsDirectFallbackAttempted) {
                        const resumeTime = Number(video?.currentTime || startTime || 0);
                        const tried = recoverWithDirectUrl(resumeTime);
                        if (tried) {
                            setTimeout(() => { sameSourceRecoveryLock = false; }, 600);
                            return;
                        }
                    }

                    if (shouldPreferDirectRetry && hlsDirectFallbackAttempted) {
                        if (failoverToNextSource(`direct_retry_exhausted:${reason}`)) {
                            sameSourceRecoveryLock = false;
                            return;
                        }
                    }

                    if (isFlixHqStream && (lowerReason.includes('audio_corruption') || lowerReason.includes('frag_parse'))) {
                        tryAlternateFlixhqServer(`flixhq_audio_guard:${reason}`).then((switched) => {
                            if (switched) {
                                sameSourceRecoveryLock = false;
                                return;
                            }
                            recoverSameSource(reason);
                        });
                        return;
                    }

                    if (isAnimeKaiStream && sameSourceRecoverCount >= 1 && (lowerReason.includes('frag_parse') || lowerReason.includes('watchdog_stall'))) {
                        if (failoverToNextSource(`animekai_fast_failover:${reason}`)) {
                            sameSourceRecoveryLock = false;
                            return;
                        }
                    }

                    // Repeated timeout-like stalls should failover to the next available source quickly.
                    const timeoutLikeReason = String(reason || '').includes('watchdog') || String(reason || '').includes('timeout') || String(reason || '').includes('network');
                    if (timeoutLikeReason && sameSourceRecoverCount >= 2) {
                        if (failoverToNextSource(`timeout_like:${reason}`)) {
                            sameSourceRecoveryLock = false;
                            return;
                        }
                        tryAlternateFlixhqServer(`timeout_like:${reason}`).then((switched) => {
                            if (switched) return;
                            recoverSameSource(reason);
                        });
                        return;
                    }
                    recoverSameSource(reason);
                };

                // Startup watchdog: if this source remains stuck in waiting state, try next source.
                let hlsStartupHasProgress = false;
                const markHlsProgress = () => {
                    if (!video) return;
                    if ((video.currentTime || 0) > 0.2) {
                        hlsStartupHasProgress = true;
                        clearHlsStartupWatchdog();
                    }
                };
                video && video.addEventListener('timeupdate', markHlsProgress);
                video && video.addEventListener('playing', markHlsProgress);
                const hlsStartupWatchdog = setTimeout(() => {
                    if (hlsStartupHasProgress) return;
                    if (currentIdx !== srcIdx) return;
                    console.warn('[hls] startup timeout: source did not begin playback, attempting failover');
                    const switched = failoverToNextSource('hls_startup_timeout');
                    if (!switched) {
                        tryAlternateFlixhqServer('hls_startup_timeout').then((altSwitched) => {
                            if (!altSwitched) recoverSameSourceWithDirectFallback('hls_startup_timeout');
                        });
                    }
                }, 18000);
                const clearHlsStartupWatchdog = () => {
                    clearTimeout(hlsStartupWatchdog);
                    video && video.removeEventListener('timeupdate', markHlsProgress);
                    video && video.removeEventListener('playing', markHlsProgress);
                };
                cancelHlsStartupWatchdog = clearHlsStartupWatchdog;

                hlsInst = svCreateHlsInstance(effectiveStartTime, false, currentStreamProvider);
                svAttachHlsListeners(hlsInst, effectiveStartTime, () => {
                    initPlyr();
                    if (useWarmStartResume && resumeTargetTime > 0) {
                        setTimeout(() => {
                            if (!video || !isFinite(video.duration)) return;
                            if (resumeTargetTime >= video.duration) return;
                            if (Math.abs(Number(video.currentTime || 0) - resumeTargetTime) < 1) return;
                            console.log('[flixhq] warm-start resume seek ->', resumeTargetTime);
                            applyGuardedJump(resumeTargetTime, 'resume');
                        }, 1200);
                    }
                    // On first load, wait for real video frames before hiding the loader
                    // so the cover-art loader stays visible the whole time instead of
                    // showing a black gap between loader and first frame.
                    if (isFirstLoad) {
                        const onFirstFrame = () => {
                            isFirstLoad = false;
                            hideLoader();
                            video && video.removeEventListener('timeupdate', onFirstFrame);
                        };
                        video && video.addEventListener('timeupdate', onFirstFrame);
                        // Safety: hide after 10s no matter what
                        setTimeout(() => { if (isFirstLoad) { isFirstLoad = false; hideLoader(); } }, 10000);
                        setTimeout(clearHlsStartupWatchdog, 30000);
                    }
                if (!IS_IOS) {
                    video.play().catch(() => {
                        video.muted = true;
                        video.play()
                            .then(() => setPlayIcon(true))
                            .catch(() => hideLoader());
                    }).then(() => {
                        if (video && !video.paused) setPlayIcon(true);
                    });
                } else {
                    // On iOS, we just make sure we're ready for the user to tap play
                    setPlayIcon(false);
                }
                }, recoverSameSourceWithDirectFallback);

                hlsInst.loadSource(streamUrl);
                hlsInst.attachMedia(video);
                video.preload = 'auto';

                const previewVideo = document.getElementById('previewVideo');
                const currentSourceProvider = String(allSources?.[srcIdx]?.provider || '').toLowerCase();
                const usePreviewHls = shouldUsePreviewHls(url, currentSourceProvider);
                if (previewVideo) {
                    window.previewUseCanvasFallbackOnly = !usePreviewHls;

                    if (!usePreviewHls) {
                        try {
                            if (window.previewHlsInst) {
                                window.previewHlsInst.stopLoad();
                                window.previewHlsInst.detachMedia();
                                window.previewHlsInst.destroy();
                            }
                        } catch (_) { }
                        window.previewHlsInst = null;
                        window.previewHlsErrorCount = 0;
                        window.previewHlsIsUnhealthy = true;
                        console.log('[preview] Using canvas-only preview mode for stream stability.');
                        warmupPreviewVideo(previewVideo);
                    } else {
                    try {
                        previewVideo.removeAttribute('src');
                        previewVideo.load();
                    } catch (_) { }
                    window.previewHlsInst = svCreateHlsInstance(0, true);
                    window.previewHlsInst.on(Hls.Events.MANIFEST_LOADED, () => {
                        // ENHANCED: Use level 1 (if available) instead of always lowest for better quality
                        if (window.previewHlsInst.levels && window.previewHlsInst.levels.length > 1) {
                            const targetLevel = 1; // Medium quality
                            window.previewHlsInst.autoLevelCapping = targetLevel;
                            window.previewHlsInst.currentLevel = targetLevel;
                            window.previewHlsInst.nextLevel = targetLevel;
                            window.previewHlsInst.loadLevel = targetLevel;
                            console.log('[preview] Using quality level 1 for better thumbnails');
                        } else {
                            // Fallback to level 0 if only one level available
                            window.previewHlsInst.autoLevelCapping = 0;
                            window.previewHlsInst.currentLevel = 0;
                            window.previewHlsInst.nextLevel = 0;
                            window.previewHlsInst.loadLevel = 0;
                        }
                    });

                    window.previewHlsInst.on(Hls.Events.ERROR, (_, data) => {
                        window.previewHlsErrorCount = (window.previewHlsErrorCount || 0) + 1;

                        // Non-fatal errors - mark as unhealthy but limit retries to avoid resource exhaustion
                        if (!data.fatal) {
                            console.warn(`[preview] Non-fatal error (count: ${window.previewHlsErrorCount}): ${data.details}`);
                            // Retry occasional non-fatal errors without permanently disabling HLS previews.
                            if (window.previewHlsErrorCount === 2 || window.previewHlsErrorCount === 5) {
                                setTimeout(() => {
                                    if (window.previewHlsInst && !video?.seeking) {
                                        try {
                                            console.log('[preview] Retrying after non-fatal error (limited)...');
                                            window.previewHlsInst.recoverMediaError?.();
                                        } catch (_) { }
                                    }
                                }, 1500); // Increased delay to let main stream priority
                            }
                            if (window.previewHlsErrorCount >= 12) {
                                console.warn('[preview] Too many non-fatal errors, switching to fallback temporarily');
                                window.previewHlsIsUnhealthy = true;
                            }
                            return;
                        }

                        // Fatal errors - escalate recovery with more conservative timing
                        console.warn(`[preview] Fatal error (attempt ${window.previewHlsErrorCount}): ${data.details}`);
                        window.previewHlsIsUnhealthy = window.previewHlsErrorCount > 3;

                        // Only one recovery attempt per consecutive fatals
                        if (window.previewHlsErrorCount <= 2) {
                            try {
                                console.log('[preview] Fatal: attempting stopLoad for recovery');
                                window.previewHlsInst.stopLoad();
                            } catch (_) { }
                        } else {
                            // Multiple failures - signal that we should use main video canvas fallback
                            console.warn('[preview] Fatal errors persistent, fallback to main video capture enabled');
                            window.previewUseCanvasFallbackOnly = window.previewHlsErrorCount >= 8;
                        }
                    });

                    window.previewHlsInst.loadSource(streamUrl);
                    window.previewHlsInst.attachMedia(previewVideo);

                    // Track preview errors to know when to fallback
                    window.previewHlsErrorCount = 0;
                    window.previewHlsIsUnhealthy = false;

                    warmupPreviewVideo(previewVideo);
                    }
                }

            } else if (isM3U8 && (
                video?.canPlayType?.('application/vnd.apple.mpegurl') ||
                video?.canPlayType?.('application/x-mpegURL') ||
                IS_IOS ||
                IS_SAFARI
            )) {
                console.log('Branch: Native HLS (iOS Safari/WebKit)');
                // On iOS, crossOrigin='anonymous' triggers CORS preflight for every segment
                // request, which can cause failures when the CDN doesn't support CORS.
                // Remove it for native HLS — canvas thumbnail capture isn't used on iOS.
                // Exception: 'justanime' uses external subtitles resolving to a cross-origin /utils/vtt.
                // If we remove crossorigin, iOS WebKit instantly crashes the <video> when the <track> is added.
                video.setAttribute('crossorigin', 'anonymous');
                video.crossOrigin = 'anonymous';

                // CRITICAL SYNC INJECTION for iOS Safari/AVKit. 
                // Any 'await' here before source assignment would break the native probe.
                if (IS_IOS && (externalSubtitleTracks || []).length > 0) {
                     applyExternalSubtitlesToVideoSync(video);
                // Redundancy for native HLS playback on iOS
                setTimeout(() => { if (video) applyExternalSubtitlesToVideoSync(video); }, 800);
                setTimeout(() => { if (video) activateTracksForIOSNativePlayer(); }, 2000);
                }

                const proxiedUrl = proxiedStreamUrl(url, referer, sourceProvider);
                const directUrl = url;
                let fallbackStep = 0; // 0=proxy, 1=proxy-retry, 2=direct

                const tryNextHlsStep = (reason) => {
                    fallbackStep++;
                    console.warn(`Native HLS: step ${fallbackStep} fallback triggered (${reason})`);

                    if (fallbackStep === 1) {
                        // Retry the proxied URL with a cache-buster. The proxy re-fetches the
                        // signed AnimeSalt CDN URL from the server side (no cache), so a retry
                        // often recovers from transient 502s caused by the probe-filter.
                        console.warn('Native HLS: retrying proxied URL (cache-busted)');
                        setTimeout(() => {
                            video.src = proxiedUrl + '&_t=' + Date.now();
                            video.load();
                            video.play().catch(() => {});
                        }, 600);
                    } else if (fallbackStep === 2) {
                        if (proxyOnlyProvider) {
                            console.warn('Native HLS: direct fallback disabled for proxy-only provider');
                            showError('Playback Error', 'Proxy stream failed after retry. Please try another source.');
                            return;
                        }
                        // Try direct URL (without proxy) — works when CDN allows browser access
                        console.warn('Native HLS: trying direct URL (no proxy)');
                        video.src = directUrl;
                        video.load();
                        video.play().catch(err => {
                            console.warn('Native HLS: direct play() failed:', err.message);
                        });
                    } else {
                        // All fallbacks exhausted
                        console.error('Native HLS: All fallbacks exhausted.');
                        showError('Playback Error', 'This stream could not be played. Please try another server.');
                    }
                };

                if (startTime > 0) {
                    video.addEventListener('loadedmetadata', () => {
                        video.currentTime = startTime;
                    }, { once: true });
                }

                video.addEventListener('error', (e) => {
                    const err = video.error;
                    console.error('Native HLS Video Error:', err ? err.code : 'unknown', err ? err.message : '');
                    if (fallbackStep < 3) tryNextHlsStep('video_error');
                });

                // Detect stalling (give proxy 12s — it fetches the CDN manifest server-side)
                const hlsStallTimer = setTimeout(() => {
                    if (video && video.readyState < 2) {
                        console.warn('Native HLS: Stalling at start, attempting fallback');
                        tryNextHlsStep('stall');
                    }
                }, 7000);
                video.addEventListener('loadedmetadata', () => clearTimeout(hlsStallTimer), { once: true });
                video.addEventListener('canplay', () => clearTimeout(hlsStallTimer), { once: true });
                video.addEventListener('playing', () => clearTimeout(hlsStallTimer), { once: true });

                // Refresh audio track UI once metadata is parsed — iOS populates
                // video.audioTracks only AFTER loadedmetadata fires.
                video.addEventListener('loadedmetadata', () => {
                    svApplyPreferredAudioToHls(null);
                    setTimeout(() => updateAudioTracks(), 100);
                }, { once: true });

                video.src = proxiedUrl;
                video.load();

                const previewVideo = document.getElementById('previewVideo');
                if (previewVideo) {
                    window.previewUseCanvasFallbackOnly = false;
                    window.previewHlsErrorCount = 0;
                    window.previewHlsIsUnhealthy = false;
                    window.previewLastSecond = -1;
                    window.previewLastCapturedSecond = -1;
                    window.previewLastRequestAt = 0;
                    previewVideo.preload = 'auto';
                    previewVideo.src = proxiedUrl;
                    warmupPreviewVideo(previewVideo);
                }

                initPlyr();

                // iOS native HLS: Plyr's event wrappers are not reliable enough for hiding the loader.
                // Hook directly onto the native video element events to guarantee the loader clears.
                const _iosHideLoader = () => {
                    isFirstLoad = false;
                    hideLoader();
                    try { hideTransitionOverlay(); } catch (_) { }
                    // Also refresh audio tracks now that native AudioTrackList is populated
                    setTimeout(() => updateAudioTracks(), 300);
                };
                video.addEventListener('playing', _iosHideLoader, { once: true });
                video.addEventListener('canplay',  _iosHideLoader, { once: true });
                // Hard fallback: if neither fires within 14s, force-clear the loader
                setTimeout(() => { isFirstLoad = false; hideLoader(); updateAudioTracks(); }, 14000);

                if (isFirstLoad) {
                    const onFirstFrame = () => {
                        isFirstLoad = false;
                        hideLoader();
                        if (video) video.removeEventListener('timeupdate', onFirstFrame);
                    };
                    if (video) video.addEventListener('timeupdate', onFirstFrame);
                }

                // Initial play attempt
                if (!IS_IOS) {
                    video.play().catch(err => {
                        console.log('Initial Native HLS play() blocked, waiting for user or fallback:', err.message);
                    });
                }

            } else if (isMPD && window.dashjs?.MediaPlayer) {
                console.log('Branch: DASH.js');
                const mpdUrl = proxiedStreamUrl(url, referer, sourceProvider);
                dashInst = window.dashjs.MediaPlayer().create();
                dashInst.initialize(video, mpdUrl, true);
                let dashErrCount = 0;
                let dashTriedNext = false;
                const dashEvents = window.dashjs.MediaPlayer.events;
                dashInst.on(dashEvents.ERROR, (evt) => {
                    const code = Number(evt?.error?.code || evt?.event?.id || 0);
                    const msg = String(evt?.error?.message || evt?.event?.message || '').toLowerCase();
                    if (msg.includes('403') || msg.includes('forbidden') || code === 27) {
                        dashErrCount += 1;
                    }
                    if (!dashTriedNext && dashErrCount >= 2) {
                        dashTriedNext = true;
                        console.warn('DASH source appears blocked (403), recovering same source');
                        recoverSameSource('dash_403');
                    }
                });
                initPlyr();

                const previewVideo = document.getElementById('previewVideo');
                if (previewVideo) {
                    window.previewUseCanvasFallbackOnly = false;
                    window.previewHlsErrorCount = 0;
                    window.previewHlsIsUnhealthy = false;
                    window.previewLastSecond = -1;
                    window.previewLastCapturedSecond = -1;
                    window.previewLastRequestAt = 0;
                    previewVideo.preload = 'auto';
                    window.previewDashInst = window.dashjs.MediaPlayer().create();
                    window.previewDashInst.initialize(previewVideo, mpdUrl, false);
                    window.previewDashInst.updateSettings({
                        'streaming': {
                            'abr': { 'initialBitrate': 100, 'minBitrate': 1, 'maxBitrate': 180 },
                            'buffer': { 'stableBufferTime': 3, 'bufferTimeAtTopQuality': 3, 'fastSwitchEnabled': true }
                        }
                    });
                    warmupPreviewVideo(previewVideo);
                }

                if (isFirstLoad) {
                    const onFirstFrame = () => {
                        isFirstLoad = false;
                        hideLoader();
                        video && video.removeEventListener('timeupdate', onFirstFrame);
                    };
                    video && video.addEventListener('timeupdate', onFirstFrame);
                    setTimeout(() => { if (isFirstLoad) { isFirstLoad = false; hideLoader(); } }, 10000);
                }

                if (!IS_IOS) video.play().catch(() => hideLoader());

            } else if (isEmbed) {
                console.warn('Embed source skipped; native direct playback only.');
                if (!failoverToNextSource('embed_source_skipped')) {
                    showError('No Direct Stream', 'This server only returned an embed player. Please try another source.');
                    hideLoader();
                }

            } else if (!isM3U8) {
                console.log('Branch: Direct MP4');
                if (startTime > 0) {
                    video.addEventListener('loadedmetadata', () => {
                        video.currentTime = startTime;
                    }, { once: true });
                }
                const proxiedMp4Url = proxiedStreamUrl(url, referer, sourceProvider);
                const directMp4Url = url;
                let triedDirectFallback = false;

                const tryDirectMp4Fallback = () => {
                    if (proxyOnlyProvider) return false;
                    if (triedDirectFallback) return false;
                    triedDirectFallback = true;
                    console.warn('Proxied MP4 failed, retrying with direct MP4 URL');
                    try {
                        video.src = directMp4Url;
                        video.load();
                        video.play().catch(() => { });
                        return true;
                    } catch (_) {
                        return false;
                    }
                };

                video.addEventListener('error', () => {
                    const switched = tryDirectMp4Fallback();
                    if (!switched) {
                        console.warn('Direct MP4 failed, recovering same source');
                        recoverSameSource('mp4_error');
                    }
                });

                // If proxy starts but never gets metadata, fallback to direct URL.
                const metadataFallbackTimer = setTimeout(() => {
                    if (!video || !Number.isFinite(video.duration) || video.duration <= 0) {
                        tryDirectMp4Fallback();
                    }
                }, 4500);
                video.addEventListener('loadedmetadata', () => clearTimeout(metadataFallbackTimer), { once: true });

                video.src = proxiedMp4Url;

                const previewVideo = document.getElementById('previewVideo');
                if (previewVideo) {
                    window.previewUseCanvasFallbackOnly = false;
                    window.previewHlsErrorCount = 0;
                    window.previewHlsIsUnhealthy = false;
                    window.previewLastSecond = -1;
                    window.previewLastCapturedSecond = -1;
                    window.previewLastRequestAt = 0;
                    previewVideo.preload = 'auto';
                    previewVideo.src = proxiedMp4Url;
                    warmupPreviewVideo(previewVideo);
                }

                initPlyr();

                if (isFirstLoad) {
                    const onFirstFrame = () => {
                        isFirstLoad = false;
                        hideLoader();
                        video && video.removeEventListener('timeupdate', onFirstFrame);
                    };
                    video && video.addEventListener('timeupdate', onFirstFrame);
                    setTimeout(() => { if (isFirstLoad) { isFirstLoad = false; hideLoader(); } }, 10000);
                }

                if (!IS_IOS) video.play().catch(() => hideLoader());

            } else {
                showError('Unsupported Browser', 'Your browser does not support HLS streaming.');
            }
        }

        // Keyboard controls for PC/laptop/Mac users only
        if (!IS_MOBILE_CLIENT) {
            document.addEventListener('keydown', (e) => {
                // Skip if focused on input/textarea
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                const key = String(e.key || '').toLowerCase();
                
                switch (key) {
                    case ' ':
                        e.preventDefault();
                        // Toggle play/pause
                        if (video && video.paused) video.play();
                        else if (video) video.pause();
                        break;
                    case 'arrowleft':
                        e.preventDefault();
                        // Skip back 10 seconds
                        if (video) { 
                            holdControlsVisible(0);
                            registerSkipPulse('left', 10);
                            requestSeekToTime(Math.max(0, (video.currentTime || 0) - 10), true);
                        }
                        break;
                    case 'arrowright':
                        e.preventDefault();
                        // Skip forward 10 seconds
                        if (video) {
                            holdControlsVisible(0);
                            registerSkipPulse('right', 10);
                            if (isFinite(video.duration)) requestSeekToTime(Math.min(video.duration, (video.currentTime || 0) + 10), true);
                            else requestSeekToTime((video.currentTime || 0) + 10, true);
                        }
                        break;
                    case 'm':
                        e.preventDefault();
                        if (video) {
                            toggleMuteFromUser(true);
                        }
                        break;
                }
            });
        }

        function changeQuality(q) {
            if (!hlsInst) return;
            hlsInst.nextLevel = q === 0 ? -1 : hlsInst.levels.findIndex(l => l.height === q);
        }

        // -----------------------------------------------------------------------
        //  INIT
        // -----------------------------------------------------------------------
        initCustomControls();
        bindVideoEvents();
        document.addEventListener('fullscreenchange', showControlSurface);
        document.addEventListener('webkitfullscreenchange', showControlSurface);

        // Update fullscreen icon to match iOS pseudo-fullscreen state.
        // Since we no longer call webkitEnterFullscreen(), the icon must be
        // synced to our css class instead of webkitFullscreenElement.
        if (IS_IOS) {
            const _syncIosFsIcon = () => {
                const icon = fullscreenBtn?.querySelector('i');
                if (!icon) return;
                const isPs = document.documentElement.classList.contains('ios-pseudo-fs-active');
                icon.className = isPs ? 'fa-solid fa-compress' : 'fa-solid fa-expand';
            };
            // MutationObserver on <html> classList so the icon stays in sync
            // even if the class is toggled by any path (e.g. back-button, script)
            new MutationObserver(_syncIosFsIcon).observe(document.documentElement, {
                attributes: true, attributeFilter: ['class']
            });
        }
        init();
    </script>
</body>
