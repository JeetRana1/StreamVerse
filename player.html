                    document.getElementById('media-meta').textContent = 'Movie';
                    if (customEpisodeBtn) customEpisodeBtn.style.display = 'none';
                    if (nextEpisodeBtn) nextEpisodeBtn.style.display = 'none';
                    const epId = info?.episodeId || info?.id || null;
                    // Some provider-specific TMDB info responses omit episodeId/id.
                    // fetchSources() resolves provider episode IDs independently via search/info paths.
                    await fetchSources(null);
                }
            } catch (err) {
                clearTimeout(safetyTimer);
                console.error('Init error:', err);
                showError('Failed to Load', err.message);
            }
        }

        // ----------------------------------------------------------------------------------------------------
        //  TV SERIES
        // ----------------------------------------------------------------------------------------------------
        async function initTv(info) {
            setLoader('Loading series...', 'Building episode list');
            tvSeasons = buildTvSeasonsFromInfo(info);
            providerSeasonCatalog = new Map();
            activeMenuProvider = '';
            const preferredYear = getPreferredMediaYear();
            const animeSeriesTitle = normalizeAnimeSearchQuery(
                info?.title || info?.name || currentMediaInfo?.title || currentMediaInfo?.name || '',
            );
            if (currentIsLikelyAnime && animeSeriesTitle) {
                const makeSeasonKey = (seasonNo, partNo = 0) => `${Number(seasonNo || 0)}::${Number(partNo || 0)}`;
                const isGenericSeasonName = (value) => /^\s*(season|part)\s*\d+\s*$/i.test(String(value || '').trim());
                const toEpisodeNumber = (ep, fallbackIndex) => {
                    const idMatch = String(ep?.id || '').match(/(?:-|\b)(\d+)x(\d+)$/i);
                    if (idMatch?.[2]) return Number(idMatch[2]);
                    const raw = Number(ep?.number || ep?.episode || ep?.episodeNum || 0);
                    if (Number.isFinite(raw) && raw > 0) return raw;
                    return fallbackIndex + 1;
                };
                const toSeasonNumber = (ep, fallbackSeason) => {
                    const raw = Number(ep?.season || ep?.seasonNumber || ep?.season_number || ep?.seasonNo || 0);
                    if (Number.isFinite(raw) && raw > 0) return raw;
                    const idMatch = String(ep?.id || '').match(/(?:-|\b)(\d+)x(\d+)$/i);
                    if (idMatch?.[1]) return Number(idMatch[1]);
                    return fallbackSeason;
                };
                const buildSeasonListFromEpisodes = (provider, providerAnimeId, providerTitle, episodes, fallbackSeasonNo = 1) => {
                    const rawEpisodes = Array.isArray(episodes) ? episodes : [];
                    const buckets = new Map();

                    const seasonSkeleton = Array.isArray(tvSeasons)
                        ? tvSeasons.filter((season) => Number(season?.seasonNo || 0) > 0)
                        : [];

                    const buildSeasonBucket = (seasonNo, seasonPartNo, sourceOrder, name, episodeRows) => ({
                        seasonNo,
                        seasonPartNo,
                        sourceOrder,
                        dedupeKey: makeSeasonKey(seasonNo, seasonPartNo),
                        name,
                        providerAnimeId: providerAnimeId || null,
                        episodes: episodeRows.map((ep, epIndex) => {
                            const episodeNo = toEpisodeNumber(ep, epIndex);
                            return {
                                id: String(ep?.id || '').trim() || null,
                                episode: episodeNo,
                                number: episodeNo,
                                episodeNum: episodeNo,
                                title: String(ep?.title || `Episode ${episodeNo}`),
                            };
                        }),
                        provider,
                        providerTitle: String(providerTitle || '').trim(),
                    });

                    const seasonValues = rawEpisodes
                        .map((ep) => Number(ep?.season || ep?.seasonNumber || ep?.season_number || ep?.seasonNum || 0))
                        .filter((value) => Number.isFinite(value) && value > 0);
                    const distinctSeasonValues = Array.from(new Set(seasonValues));
                    const hasSxeEpisodeIds = rawEpisodes.some((ep) => /(?:-|\b)(\d+)x(\d+)$/i.test(String(ep?.id || '')));
                    const hasMeaningfulSeasonMetadata =
                        hasSxeEpisodeIds ||
                        distinctSeasonValues.length > 1 ||
                        (distinctSeasonValues.length === 1 && Number(distinctSeasonValues[0]) > 1);

                    rawEpisodes.forEach((ep, index) => {
                        if (!ep || typeof ep !== 'object') return;
                        const seasonNo = hasMeaningfulSeasonMetadata
                            ? toSeasonNumber(ep, Number(fallbackSeasonNo || 1))
                            : Number(fallbackSeasonNo || 1);
                        const seasonPartNo = Number(ep?.part || ep?.partNo || ep?.seasonPart || 0) || 0;
                        const key = makeSeasonKey(seasonNo, seasonPartNo);
                        const episodeNo = toEpisodeNumber(ep, index);
                        const episodeTitle = String(ep?.title || `Episode ${episodeNo}`);
                        if (!buckets.has(key)) {
                            buckets.set(key, {
                                seasonNo,
                                seasonPartNo,
                                sourceOrder: index,
                                dedupeKey: key,
                                name: seasonPartNo > 0 ? `Part ${seasonPartNo}` : `Season ${seasonNo}`,
                                providerAnimeId: providerAnimeId || null,
                                episodes: [],
                                provider,
                                providerTitle: String(providerTitle || '').trim(),
                            });
                        }
                        const bucket = buckets.get(key);
                        bucket.episodes.push({
                            id: String(ep?.id || '').trim() || null,
                            episode: episodeNo,
                            number: episodeNo,
                            episodeNum: episodeNo,
                            title: episodeTitle,
                        });
                        if (!bucket.providerAnimeId && providerAnimeId) bucket.providerAnimeId = providerAnimeId;
                    });

                    const explicitFallbackSeasonNo = Number(fallbackSeasonNo || 0);
                    const hasExplicitTargetSeason = Number.isFinite(explicitFallbackSeasonNo) && explicitFallbackSeasonNo > 1;

                    // If caller already resolved a concrete season (common for AnimeKai arc entries),
                    // keep episodes in that season instead of spreading through the TMDB skeleton.
                    if (currentIsLikelyAnime && rawEpisodes.length > 0 && !hasMeaningfulSeasonMetadata && hasExplicitTargetSeason) {
                        return [buildSeasonBucket(
                            explicitFallbackSeasonNo,
                            0,
                            0,
                            `Season ${explicitFallbackSeasonNo}`,
                            rawEpisodes,
                        )];
                    }
                    if (currentIsLikelyAnime && rawEpisodes.length > 0 && !hasMeaningfulSeasonMetadata && seasonSkeleton.length > 1) {
                        const totalSkeletonEpisodes = seasonSkeleton.reduce(
                            (sum, season) => sum + (Array.isArray(season?.episodes) ? season.episodes.length : 0),
                            0,
                        );
                        if (totalSkeletonEpisodes > 0) {
                            const rebuilt = [];
                            let cursor = 0;
                            seasonSkeleton.forEach((season, index) => {
                                const seasonNo = Number(season?.seasonNo || index + 1);
                                const seasonPartNo = Number(season?.seasonPartNo || season?.part || season?.partNo || 0) || 0;
                                const seasonCount = Math.max(0, Number(Array.isArray(season?.episodes) ? season.episodes.length : 0));
                                const remaining = rawEpisodes.length - cursor;
                                if (remaining <= 0) return;
                                const take = index === seasonSkeleton.length - 1 ? remaining : Math.min(seasonCount || remaining, remaining);
                                if (take <= 0) return;
                                const slice = rawEpisodes.slice(cursor, cursor + take);
                                cursor += take;
                                if (!slice.length) return;
                                rebuilt.push(buildSeasonBucket(
                                    seasonNo,
                                    seasonPartNo,
                                    index,
                                    String(season?.name || `Season ${seasonNo}`).trim(),
                                    slice,
                                ));
                            });
                            if (rebuilt.length > 0) {
                                return rebuilt.sort((a, b) => {
                                    const seasonDiff = Number(a.seasonNo || 0) - Number(b.seasonNo || 0);
                                    if (seasonDiff !== 0) return seasonDiff;
                                    const partDiff = Number(a.seasonPartNo || 0) - Number(b.seasonPartNo || 0);
                                    if (partDiff !== 0) return partDiff;
                                    return Number(a.sourceOrder || 0) - Number(b.sourceOrder || 0);
                                });
                            }
                        }
                    }

                    return Array.from(buckets.values())
                        .map((season) => ({
                            ...season,
                            episodes: season.episodes.sort((a, b) => Number(a.episode || 0) - Number(b.episode || 0)),
                        }))
                        .sort((a, b) => {
                            const seasonDiff = Number(a.seasonNo || 0) - Number(b.seasonNo || 0);
                            if (seasonDiff !== 0) return seasonDiff;
                            const partDiff = Number(a.seasonPartNo || 0) - Number(b.seasonPartNo || 0);
                            if (partDiff !== 0) return partDiff;
                            return Number(a.sourceOrder || 0) - Number(b.sourceOrder || 0);
                        });
                };
                const mergeSeasonLists = (baseList, extraList) => {
                    const merged = [...(Array.isArray(baseList) ? baseList : [])];
                    for (const season of (Array.isArray(extraList) ? extraList : [])) {
                        const key = makeSeasonKey(season?.seasonNo, season?.seasonPartNo);
                        const existing = merged.find((row) => makeSeasonKey(row?.seasonNo, row?.seasonPartNo) === key);
                        if (!existing) {
                            merged.push({ ...season, episodes: [...(season?.episodes || [])] });
                            continue;
                        }
                        if ((season?.episodes?.length || 0) > (existing?.episodes?.length || 0)) {
                            existing.episodes = [...season.episodes];
                        }
                        if (!existing.providerAnimeId && season.providerAnimeId) existing.providerAnimeId = season.providerAnimeId;
                        if (isGenericSeasonName(existing.name) && !isGenericSeasonName(season.name) && season.name) {
                            existing.name = season.name;
                        }
                    }
                    return merged.sort((a, b) => {
                        const seasonDiff = Number(a?.seasonNo || 0) - Number(b?.seasonNo || 0);
                        if (seasonDiff !== 0) return seasonDiff;
                        const partDiff = Number(a?.seasonPartNo || 0) - Number(b?.seasonPartNo || 0);
                        if (partDiff !== 0) return partDiff;
                        return Number(a?.sourceOrder || 0) - Number(b?.sourceOrder || 0);
                    });
                };
                const hydrateAnimeProviderSeasons = async (provider) => {
                    const providerName = String(provider || '').toLowerCase();
                    const seasonCacheVersion = 'v9';
                    const cacheKey = `anime_provider_seasons_${seasonCacheVersion}_${providerName}_${animeSeriesTitle}_${preferredYear}`;
                    const cached = localStorage.getItem(cacheKey);
                    if (cached) {
                        try {
                            const parsed = JSON.parse(cached);
                            if (parsed.ts && Date.now() - parsed.ts < 60 * 60 * 1000) { // 1 hour
                                const cachedData = Array.isArray(parsed.data) ? parsed.data : [];
                                const cachedEpisodeCount = countMenuSeasonEpisodes(cachedData);
                                const cachedRealSeasonCount = cachedData.filter((season) => Number(season?.seasonNo || 0) > 0).length;
                                const cachedLooksLikeExtras = cachedData.length > 0 && cachedData.every(isExtrasOnlyMenuSeason);
                                if (cachedEpisodeCount <= 1 || !cachedRealSeasonCount || cachedLooksLikeExtras) {
                                    localStorage.removeItem(cacheKey);
                                } else if (providerName === 'animekai') {
                                    // Ignore known stale AnimeKai cache shapes that collapse all episodes into one giant season.
                                    const firstLen = Number(cachedData?.[0]?.episodes?.length || 0);
                                    if (cachedData.length <= 1 && firstLen > 35) {
                                        localStorage.removeItem(cacheKey);
                                    } else {
                                        return cachedData;
                                    }
                                } else {
                                    return cachedData;
                                }
                            }
                        } catch {}
                    }

                    const timeoutMs = 5000;

                    if (providerName === 'satoru') {
                        const { res: seriesRes } = await fetchJsonWithApiFallback(
                            buildSatoruSeriesUrl(animeSeriesTitle, preferredYear),
                            { signal: AbortSignal.timeout(timeoutMs) },
                        );
                        if (!seriesRes.ok) return [];
                        const seriesData = await seriesRes.json();
                        const entries = Array.isArray(seriesData?.entries) ? seriesData.entries : [];
                        const result = entries.flatMap((entry, index) => {
                            const entryTitle = String(entry?.title || `Part ${index + 1}`).trim();
                            const entryId = String(entry?.id || '').trim();
                            const seasonNo = Number(
                                extractSeasonNumberFromTitle(entryTitle)
                                || extractSeasonNumberFromTitle(entryId)
                                || entry?.season
                                || entry?.seasonNo
                                || index + 1,
                            ) || (index + 1);
                            const seasonPartNo = Number(
                                extractPartNumberFromTitle(entryTitle)
                                || extractPartNumberFromTitle(entryId)
                                || 0,
                            ) || 0;
                            const episodes = Array.isArray(entry?.episodes) ? entry.episodes : [];
                            if (!episodes.length) return [];
                            return [{
                                seasonNo,
                                seasonPartNo,
                                sourceOrder: index,
                                dedupeKey: makeSeasonKey(seasonNo, seasonPartNo),
                                name: /^season\s+\d+$/i.test(entryTitle) ? entryTitle.replace(/season/i, 'Part') : entryTitle,
                                providerAnimeId: entryId || null,
                                episodes: episodes.map((ep, epIndex) => ({
                                    id: ep?.id || null,
                                    episode: ep?.number || epIndex + 1,
                                    number: ep?.number || epIndex + 1,
                                    episodeNum: ep?.number || epIndex + 1,
                                    title: String(ep?.title || `Episode ${epIndex + 1}`),
                                })),
                                provider: providerName,
                            }];
                        });
                        localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), data: result }));
                        return result;
                    }

                    const searchTerms = getAnimeSearchTerms(animeSeriesTitle, preferredYear, 1, '', false).slice(0, 5);
                    let bestResult = null;
                    const animekaiCandidateMap = new Map();

                    // Check cache for previous search result
                    const searchCacheVersion = 'v6';
                    const searchCacheKey = `anime_search_${searchCacheVersion}_${providerName}_${animeSeriesTitle}_${preferredYear}`;
                    const cachedSearch = localStorage.getItem(searchCacheKey);
                    if (cachedSearch) {
                        try {
                            const parsed = JSON.parse(cachedSearch);
                            if (parsed.ts && Date.now() - parsed.ts < 60 * 60 * 1000) { // 1 hour
                                const cachedResult = parsed.data;
                                if (isAllowedAmbiguousAnimeProviderMatch(cachedResult, animeSeriesTitle, preferredYear)) {
                                    bestResult = cachedResult;
                                } else {
                                    localStorage.removeItem(searchCacheKey);
                                }
                            }
                        } catch {}
                    }

                    // AnimeKai must still run live search so we can aggregate all season-specific candidates.
                    if (!bestResult || providerName === 'animekai') {
                        for (const term of searchTerms) {
                            const typeHint = providerName === 'animesalt' ? '?type=tv' : '';
                            const { res: searchRes } = await fetchJsonWithApiFallback(
                                `${API_BASE.replace('/meta/tmdb', '/anime/' + providerName)}/${encodeURIComponent(term)}${typeHint}`,
                                { signal: AbortSignal.timeout(timeoutMs) },
                            );
                            if (!searchRes.ok) continue;
                            const searchData = await searchRes.json();
                            const results = getAnimeSearchResults(searchData);
                            const filteredResults = results.filter((row) => {
                                const rowId = String(row?.id || '').toLowerCase();
                                const rowType = String(row?.type || row?.format || '').toLowerCase();
                                if (rowId.startsWith('movie:')) return false;
                                if (rowType.includes('movie') || rowType === 'film') return false;
                                return true;
                            });
                            const searchPool = filteredResults.length ? filteredResults : results;
                            const picked =
                                pickAnimeResultByAniListId(searchPool, String((currentAnimeCanonicalInfo || await getCanonicalAnimeInfo())?.id || currentMediaInfo?.anilistId || '').trim()) ||
                                findExactProviderSeasonMatch(providerName, searchPool, '') ||
                                pickAnimeResultByTitle(searchPool, animeSeriesTitle, preferredYear, 1, '', false);

                            if (!bestResult && picked?.id && isAllowedAmbiguousAnimeProviderMatch(picked, animeSeriesTitle, preferredYear)) {
                                bestResult = picked;
                                // Cache the result
                                localStorage.setItem(searchCacheKey, JSON.stringify({ ts: Date.now(), data: bestResult }));
                            }

                            if (providerName === 'animekai') {
                                searchPool
                                    .filter((row) => isAllowedAmbiguousAnimeProviderMatch(row, animeSeriesTitle, preferredYear))
                                    .slice(0, 8)
                                    .forEach((row) => {
                                        const rowId = String(row?.id || '').trim();
                                        if (!rowId) return;
                                        if (!animekaiCandidateMap.has(rowId)) {
                                            animekaiCandidateMap.set(rowId, row);
                                        }
                                    });
                            }

                            if (bestResult?.id && providerName !== 'animekai') {
                                break;
                            }
                        }
                    }
                    if (!bestResult?.id) return [];

                    if (providerName === 'animekai') {
                        if (!animekaiCandidateMap.size && bestResult?.id) {
                            animekaiCandidateMap.set(String(bestResult.id), bestResult);
                        }

                        const animekaiCandidates = Array.from(animekaiCandidateMap.values()).slice(0, 10);
                        let merged = [];

                        const infoJobs = animekaiCandidates.map(async (candidate, index) => {
                            const candidateId = String(candidate?.id || '').trim();
                            if (!candidateId) return [];

                            const { res: infoRes } = await fetchJsonWithApiFallback(
                                buildAnimeInfoUrl(providerName, candidateId),
                                { signal: AbortSignal.timeout(timeoutMs) },
                            );
                            if (!infoRes.ok) return [];

                            let providerInfo = await infoRes.json();
                            if (providerInfo?.data) providerInfo = providerInfo.data;
                            const episodes = Array.isArray(providerInfo?.episodes) ? providerInfo.episodes : [];
                            if (!episodes.length) return [];
                            // Drop recap/special entries so they do not shift season inference
                            // (e.g., one-off entries can incorrectly create tiny fake seasons like "Season 3: 2 eps").
                            if (episodes.length < 8) return [];

                            const explicitSeasonNo = Number(
                                extractSeasonNumberFromTitle(candidate?.title || candidate?.name || '')
                                || extractSeasonNumberFromTitle(providerInfo?.title || ''),
                            ) || 0;

                            let inferredSeasonNo = explicitSeasonNo;
                            if (inferredSeasonNo <= 0 && Array.isArray(tvSeasons) && tvSeasons.length > 1) {
                                const matchByEpisodeCount = tvSeasons.find((season) => {
                                    const seasonNo = Number(season?.seasonNo || 0);
                                    const seasonEpCount = Number(Array.isArray(season?.episodes) ? season.episodes.length : 0);
                                    return seasonNo > 0 && seasonEpCount > 0 && seasonEpCount === episodes.length;
                                });
                                if (matchByEpisodeCount) {
                                    inferredSeasonNo = Number(matchByEpisodeCount.seasonNo || 0);
                                }
                            }
                            if (inferredSeasonNo <= 0) inferredSeasonNo = index + 1;

                            return buildSeasonListFromEpisodes(
                                providerName,
                                candidateId,
                                providerInfo?.title || candidate?.title || animeSeriesTitle,
                                episodes,
                                inferredSeasonNo,
                            );
                        });

                        const infoResults = await Promise.allSettled(infoJobs);
                        infoResults.forEach((job) => {
                            if (job.status === 'fulfilled' && Array.isArray(job.value) && job.value.length) {
                                merged = mergeSeasonLists(merged, job.value);
                            }
                        });

                        if (merged.length) {
                            localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), data: merged }));
                            return merged;
                        }
                    }

                    const { res: infoRes } = await fetchJsonWithApiFallback(
                        buildAnimeInfoUrl(providerName, bestResult.id),
                        { signal: AbortSignal.timeout(timeoutMs) },
                    );
                    if (!infoRes.ok) return [];
                    let providerInfo = await infoRes.json();
                    if (providerInfo?.data) providerInfo = providerInfo.data;
                    const episodes = Array.isArray(providerInfo?.episodes) ? providerInfo.episodes : [];
                    if (!episodes.length) return [];
                    const result = buildSeasonListFromEpisodes(providerName, String(bestResult.id), providerInfo?.title || animeSeriesTitle, episodes);
                    localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), data: result }));
                    return result;
                };

                const hydrateProviders = Array.from(new Set([
                    ...(FORCED_PROVIDER ? [FORCED_PROVIDER] : []),
                    ...ANIME_PROVIDERS,
                ]))
                    .map((p) => String(p || '').toLowerCase())
                    .filter((p) => ANIME_PROVIDERS.includes(p));

                // Run provider hydration in parallel
                const hydrationPromises = hydrateProviders.map(async (provider) => {
                    try {
                        const hydrated = await hydrateAnimeProviderSeasons(provider);
                        if (hydrated.length) {
                            const normalizedHydrated = dedupeTvSeasonEntries(hydrated, true);
                            providerSeasonCatalog.set(provider, normalizedHydrated);
                            return normalizedHydrated;
                        }
                    } catch (err) {
                        console.warn('[initTv] Anime provider hydration failed for', provider, err);
                    }
                    return [];
                });

                const hydrationResults = await Promise.allSettled(hydrationPromises);
                for (const result of hydrationResults) {
                    if (result.status === 'fulfilled' && result.value.length) {
                        tvSeasons = mergeSeasonLists(tvSeasons, result.value);
                    }
                }

                const preferredMenuProvider = String(FORCED_PROVIDER || '').trim().toLowerCase();
                if (preferredMenuProvider && providerSeasonCatalog.has(preferredMenuProvider)) {
                    activeMenuProvider = preferredMenuProvider;
                } else {
                    activeMenuProvider = Array.from(providerSeasonCatalog.keys())[0] || '';
                }
            }

            episodeFillerStatus = new Map();
            fillerLookupState = 'loading';
            if (!tvSeasons.length) {
                // API can return partial TV info during transient backend failures.
                // Build a minimal placeholder so playback can continue via provider search.
                const safeSeasonNo = (Number.isFinite(URL_SEASON) && URL_SEASON > 0) ? URL_SEASON : 1;
                const safeEpisodeNo = (Number.isFinite(URL_EPISODE) && URL_EPISODE > 0) ? URL_EPISODE : 1;
                const fallbackTitle = String(
                    info?.title ||
                    info?.name ||
                    currentMediaInfo?.title ||
                    currentMediaInfo?.name ||
                    `Episode ${safeEpisodeNo}`
                ).trim();
                tvSeasons = [{
                    seasonNo: safeSeasonNo,
                    name: `Season ${safeSeasonNo}`,
                    episodes: [{
                        episode: safeEpisodeNo,
                        number: safeEpisodeNo,
                        episodeNum: safeEpisodeNo,
                        title: fallbackTitle,
                        id: null,
                    }],
                }];
                console.warn('[initTv] No episodes in info payload. Using URL-based fallback season/episode map.');
            }

            tvSeasons = dedupeTvSeasonEntries(tvSeasons, currentIsLikelyAnime);

            // If the URL requests a season/episode that isn't in our metadata (common for Vegamovies extra seasons),
            // synthesize it so the player doesn't clamp back to Season 1.
            const urlParamsForInjection = new URLSearchParams(location.search);
            const injectionS = Number(urlParamsForInjection.get('season') || 0);
            const injectionE = Number(urlParamsForInjection.get('episode') || urlParamsForInjection.get('ep') || 0);
            if (injectionS > 0 && !tvSeasons.some(s => Number(s.seasonNo) === injectionS)) {
                console.warn(`[initTv] URL requested Season ${injectionS} but it's not in metadata. Injecting virtual season.`);
                const injectedEpisodes = [];
                for (let i = 1; i <= Math.max(24, injectionE); i++) {
                    injectedEpisodes.push({
                        episode: i,
                        number: i,
                        episodeNum: i,
                        title: `Episode ${i}`,
                        id: null
                    });
                }
                tvSeasons.push({
                    seasonNo: injectionS,
                    name: `Season ${injectionS}`,
                    episodes: injectedEpisodes
                });
                tvSeasons.sort((a,b) => (a.seasonNo || 0) - (b.seasonNo || 0));
            } else if (injectionS > 0) {
                // Season exists, check if episode exists
                const targetS = tvSeasons.find(s => Number(s.seasonNo) === injectionS);
                if (targetS && injectionE > 0 && !targetS.episodes.some(ep => Number(ep.episode || ep.number) === injectionE)) {
                    console.warn(`[initTv] URL requested Episode ${injectionE} but it's not in Season ${injectionS} metadata. Injecting virtual episode.`);
                    targetS.episodes.push({
                        episode: injectionE,
                        number: injectionE,
                        episodeNum: injectionE,
                        title: `Episode ${injectionE}`,
                        id: null
                    });
                    targetS.episodes.sort((a,b) => (a.episode || a.number || 0) - (b.episode || b.number || 0));
                }
            }

            buildEpPanel();
            epBtn.style.display = 'flex';
            if (customEpisodeBtn) customEpisodeBtn.style.display = 'inline-flex';
            // Mark episode button for showing in Plyr control bar
            showPlyrEpBtn = true;
            const fillerTitle = info?.title || info?.name || currentMediaInfo?.title || currentMediaInfo?.name || '';
            if (currentIsLikelyAnime) {
                fetchAnimeFillerStatusMap(fillerTitle)
                    .then((map) => {
                        episodeFillerStatus = map;
                        fillerLookupState = map.size > 0
                            ? 'ready'
                            : (fillerLookupState === 'fetch_failed' ? 'fetch_failed' : 'not_found');
                        buildEpPanel();
                        updateEpUI(curSeason, curEpisode);
                    })
                    .catch(() => {
                        fillerLookupState = 'fetch_failed';
                        buildEpPanel();
                        updateEpUI(curSeason, curEpisode);
                    });
            } else {
                fillerLookupState = 'not_found';
            }
            const initialPos = getInitialTvPositionFromUrl(tvSeasons);
            await playTvEp(initialPos.seasonIndex, initialPos.episodeIndex, null);
        }

        function getActiveEpisodeMenuProvider() {
            if (!currentIsLikelyAnime) return '';
            const pinnedProvider = String(activeMenuProvider || '').trim().toLowerCase();
            if (pinnedProvider && providerSeasonCatalog.has(pinnedProvider)) return pinnedProvider;

            const playingProvider = String(currentStreamProvider || '').trim().toLowerCase();
            if (playingProvider && providerSeasonCatalog.has(playingProvider)) return playingProvider;

            const activeSourceProvider = String(allSources?.[currentIdx]?.provider || '').trim().toLowerCase();
            const forcedProvider = String(FORCED_PROVIDER || '').trim().toLowerCase();
            const provider = activeSourceProvider || forcedProvider;
            if (provider && providerSeasonCatalog.has(provider)) return provider;

            return '';
        }

        function countMenuSeasonEpisodes(seasons) {
            return (Array.isArray(seasons) ? seasons : []).reduce((total, season) => {
                const episodes = Array.isArray(season?.episodes) ? season.episodes : [];
                return total + episodes.length;
            }, 0);
        }

        function isExtrasOnlyMenuSeason(season) {
            const seasonNo = Number(season?.seasonNo || 0);
            const name = String(season?.name || '').trim();
            return seasonNo <= 0 || /^(specials?|ovas?|extras?|recaps?)$/i.test(name);
        }

        function getBestProviderCatalogMenuSeasons() {
            let best = [];
            let bestCount = 0;
            providerSeasonCatalog.forEach((seasons, provider) => {
                if (!Array.isArray(seasons) || !seasons.length) return;
                const normalizedProvider = String(provider || '').trim().toLowerCase();
                const normalized = normalizedProvider === 'animesalt'
                    ? mergeMenuSeasonsBySeasonNo(seasons)
                    : seasons;
                const realSeasons = normalized.filter((season) => Number(season?.seasonNo || 0) > 0);
                const candidate = realSeasons.length ? realSeasons : normalized;
                if (!candidate.length || candidate.every(isExtrasOnlyMenuSeason)) return;
                const count = countMenuSeasonEpisodes(candidate);
                if (count > bestCount) {
                    best = candidate;
                    bestCount = count;
                }
            });
            return best;
        }

        function chooseExpandedEpisodeMenuSeasons(preferredSeasons) {
            const preferred = Array.isArray(preferredSeasons) ? preferredSeasons : [];
            if (!currentIsLikelyAnime || countMenuSeasonEpisodes(preferred) > 1) return preferred;

            const providerFallback = getBestProviderCatalogMenuSeasons();
            return countMenuSeasonEpisodes(providerFallback) > countMenuSeasonEpisodes(preferred)
                ? providerFallback
                : preferred;
        }

        function getEpisodeMenuSeasons() {
            const scopedProvider = getActiveEpisodeMenuProvider();
            if (scopedProvider) {
                const scoped = providerSeasonCatalog.get(scopedProvider);
                if (Array.isArray(scoped) && scoped.length) {
                    const providerScoped = scopedProvider === 'animesalt'
                        ? mergeMenuSeasonsBySeasonNo(scoped)
                        : scoped;
                    return cloneAndSortMenuSeasons(providerScoped);
                }
            }
            return cloneAndSortMenuSeasons(chooseExpandedEpisodeMenuSeasons(tvSeasons));
        }

        function mergeMenuSeasonsBySeasonNo(seasons) {
            const list = Array.isArray(seasons) ? seasons : [];
            const grouped = new Map();
            list.forEach((season, idx) => {
                const seasonNoRaw = Number(season?.seasonNo);
                const seasonNo = Number.isFinite(seasonNoRaw) && seasonNoRaw > 0 ? seasonNoRaw : (idx + 1);
                if (!grouped.has(seasonNo)) {
                    const initialName = String(season?.name || '').trim();
                    grouped.set(seasonNo, {
                        ...season,
                        seasonNo,
                        seasonPartNo: 0,
                        name: initialName || `Season ${seasonNo}`,
                        episodes: [],
                    });
                }
                const bucket = grouped.get(seasonNo);
                const add = Array.isArray(season?.episodes) ? season.episodes : [];
                bucket.episodes.push(...add);
                const candidateName = String(season?.name || '').trim();
                const bucketName = String(bucket?.name || '').trim();
                const bucketGeneric = /^(season|part)\s+\d+$/i.test(bucketName);
                const candidateGeneric = /^(season|part)\s+\d+$/i.test(candidateName);
                if ((!bucketName || bucketGeneric) && candidateName && !candidateGeneric) {
                    bucket.name = candidateName;
                }
            });
            return Array.from(grouped.values());
        }

        function getEpisodeOrdinalForMenu(ep, fallback = 0) {
            const idMatch = String(ep?.id || '').match(/-(\d+)x(\d+)$/i);
            if (currentIsLikelyAnime && idMatch?.[2]) {
                const fromId = Number(idMatch[2]);
                if (Number.isFinite(fromId) && fromId > 0) return fromId;
            }

            const numeric = Number(ep?.episode || ep?.number || ep?.episodeNum || 0);
            if (Number.isFinite(numeric) && numeric > 0) return numeric;

            if (idMatch?.[2]) {
                const fromId = Number(idMatch[2]);
                if (Number.isFinite(fromId) && fromId > 0) return fromId;
            }

            const title = String(ep?.title || '');
            const taggedMatch = title.match(/(?:episode|ep)\s*\.?\s*(\d+)/i);
            if (taggedMatch?.[1]) {
                const fromTaggedTitle = Number(taggedMatch[1]);
                if (Number.isFinite(fromTaggedTitle) && fromTaggedTitle > 0) return fromTaggedTitle;
            }
            const leadingMatch = title.match(/^\s*(\d+)\b/);
            if (leadingMatch?.[1]) {
                const fromLeadingTitle = Number(leadingMatch[1]);
                if (Number.isFinite(fromLeadingTitle) && fromLeadingTitle > 0) return fromLeadingTitle;
            }

            return fallback;
        }

        function normalizeAndSortMenuEpisodes(episodes) {
            const rows = Array.isArray(episodes) ? episodes : [];
            const ordered = rows
                .map((ep, idx) => {
                    const episodeNo = getEpisodeOrdinalForMenu(ep, idx + 1);
                    const normalizedTitle = normalizeTitleForMatch(String(ep?.title || ''));
                    return {
                        ...ep,
                        _menuEpisodeNo: episodeNo,
                        _menuOrder: idx,
                        _menuNormalizedTitle: normalizedTitle,
                    };
                })
                .sort((a, b) => {
                    if (a._menuEpisodeNo !== b._menuEpisodeNo) return a._menuEpisodeNo - b._menuEpisodeNo;
                    const titleCmp = String(a._menuNormalizedTitle || '').localeCompare(String(b._menuNormalizedTitle || ''));
                    if (titleCmp !== 0) return titleCmp;
                    return Number(a._menuOrder || 0) - Number(b._menuOrder || 0);
                });

            const deduped = [];
            const seen = new Set();
            ordered.forEach((ep) => {
                const epId = String(ep?.id || '').trim().toLowerCase();
                const key = epId || `${Number(ep?._menuEpisodeNo || 0)}::${String(ep?._menuNormalizedTitle || '')}`;
                if (seen.has(key)) return;
                seen.add(key);
                deduped.push({
                    ...ep,
                    episode: ep._menuEpisodeNo,
                    number: ep._menuEpisodeNo,
                    episodeNum: ep._menuEpisodeNo,
                });
            });
            return deduped;
        }

        function cloneAndSortMenuSeasons(seasons) {
            const list = Array.isArray(seasons) ? seasons : [];
            return list
                .map((season, seasonIndex) => {
                    const episodes = Array.isArray(season?.episodes) ? season.episodes : [];
                    return {
                        ...season,
                        _menuSeasonIndex: seasonIndex,
                        episodes: normalizeAndSortMenuEpisodes(episodes),
                    };
                })
                .sort((a, b) => {
                    const aSeason = Number(a?.seasonNo || 0);
                    const bSeason = Number(b?.seasonNo || 0);
                    if (aSeason !== bSeason) return aSeason - bSeason;
                    const aPart = Number(a?.seasonPartNo || a?.part || a?.partNo || 0);
                    const bPart = Number(b?.seasonPartNo || b?.part || b?.partNo || 0);
                    if (aPart !== bPart) return aPart - bPart;
                    return Number(a?._menuSeasonIndex || 0) - Number(b?._menuSeasonIndex || 0);
                });
        }

        function resolveGlobalEpisodeIndices(menuSeason, menuEpisode, fallbackSeasonIndex, fallbackEpisodeIndex, allowProviderEpisodeInjection = false) {
            const getSeasonPart = (row) => {
                const raw = Number(row?.seasonPartNo || row?.part || row?.partNo || 0);
                return Number.isFinite(raw) && raw > 0 ? raw : 0;
            };

            const episodeId = String(menuEpisode?.id || '').trim().toLowerCase();
            const seasonNoRaw = Number(menuSeason?.seasonNo);
            const seasonNo = Number.isFinite(seasonNoRaw) && seasonNoRaw > 0 ? seasonNoRaw : (fallbackSeasonIndex + 1);
            const seasonPart = getSeasonPart(menuSeason);
            const menuSeasonProviderId = String(menuSeason?.providerAnimeId || '').trim().toLowerCase();
            const episodeNoRaw = Number(menuEpisode?.episode || menuEpisode?.number || menuEpisode?.episodeNum);
            const episodeNo = Number.isFinite(episodeNoRaw) && episodeNoRaw > 0 ? episodeNoRaw : (fallbackEpisodeIndex + 1);
            const menuTitle = normalizeTitleForMatch(String(menuEpisode?.title || ''));
            const isScopedAnimeMenu = currentIsLikelyAnime && !!getActiveEpisodeMenuProvider();

            const rankedSeasonCandidates = [];
            for (let si = 0; si < tvSeasons.length; si += 1) {
                const season = tvSeasons[si] || {};
                const tvSeasonNo = Number(season?.seasonNo || 0);
                const tvSeasonPart = getSeasonPart(season);
                const tvProviderId = String(season?.providerAnimeId || '').trim().toLowerCase();
                let score = 0;
                
                // For anime with multi-season providers: exact season + provider match is highest priority
                if (menuSeasonProviderId && tvProviderId && menuSeasonProviderId === tvProviderId) {
                    score += 16;  // Doubled from 8 for scoped anime
                    if (tvSeasonNo > 0 && seasonNo > 0 && tvSeasonNo === seasonNo) {
                        score += 8;  // Strong bonus for season number match within same provider
                    }
                } else {
                    // Only use season number if provider IDs don't match
                    if (tvSeasonNo > 0 && seasonNo > 0 && tvSeasonNo === seasonNo) score += 4;
                }
                
                if (seasonPart > 0 && tvSeasonPart > 0 && seasonPart === tvSeasonPart) score += 2;
                if (score > 0) rankedSeasonCandidates.push({ seasonIndex: si, score });
            }

            rankedSeasonCandidates.sort((a, b) => b.score - a.score || a.seasonIndex - b.seasonIndex);
            const candidateSeasonIndices = rankedSeasonCandidates.map((row) => row.seasonIndex);
            if (!candidateSeasonIndices.length) {
                const byNo = tvSeasons.findIndex((s) => Number(s?.seasonNo || 0) === seasonNo);
                if (byNo >= 0) candidateSeasonIndices.push(byNo);
            }

            const safeSeasonIndex = Math.max(0, Math.min(tvSeasons.length - 1, Number(fallbackSeasonIndex || 0)));
            if (!candidateSeasonIndices.includes(safeSeasonIndex)) candidateSeasonIndices.push(safeSeasonIndex);

            // STRICT episode ID resolution for anime with provider-scoped episodes
            if (episodeId) {
                // First pass: exact provider + season match (strongest constraint for multi-provider anime)
                if (menuSeasonProviderId) {
                    for (const si of candidateSeasonIndices) {
                        const season = tvSeasons[si] || {};
                        const tvProviderId = String(season?.providerAnimeId || '').trim().toLowerCase();
                        if (tvProviderId !== menuSeasonProviderId) continue;  // Skip if provider doesn't match
                        const eps = Array.isArray(season.episodes) ? season.episodes : [];
                        const ei = eps.findIndex((ep) => String(ep?.id || '').trim().toLowerCase() === episodeId);
                        if (ei >= 0) return { seasonIndex: si, episodeIndex: ei };
                    }
                }
                // Second pass: candidate season list (scoped to ranked matches)
                for (const si of candidateSeasonIndices) {
                    const eps = Array.isArray(tvSeasons[si]?.episodes) ? tvSeasons[si].episodes : [];
                    const ei = eps.findIndex((ep) => String(ep?.id || '').trim().toLowerCase() === episodeId);
                    if (ei >= 0) return { seasonIndex: si, episodeIndex: ei };
                }
                // Third pass: only for non-scoped anime, search all seasons
                if (!isScopedAnimeMenu) {
                    for (let si = 0; si < tvSeasons.length; si += 1) {
                        const eps = Array.isArray(tvSeasons[si]?.episodes) ? tvSeasons[si].episodes : [];
                        const ei = eps.findIndex((ep) => String(ep?.id || '').trim().toLowerCase() === episodeId);
                        if (ei >= 0) return { seasonIndex: si, episodeIndex: ei };
                    }
                }
            }

            for (const si of candidateSeasonIndices) {
                const eps = Array.isArray(tvSeasons[si]?.episodes) ? tvSeasons[si].episodes : [];
                const byNumberAndTitle = eps.findIndex((ep) => {
                    const n = Number(ep?.episode || ep?.number || ep?.episodeNum || 0);
                    if (n !== episodeNo) return false;
                    if (!menuTitle) return true;
                    return normalizeTitleForMatch(String(ep?.title || '')) === menuTitle;
                });
                if (byNumberAndTitle >= 0) return { seasonIndex: si, episodeIndex: byNumberAndTitle };

                const byNumber = eps.findIndex((ep) => Number(ep?.episode || ep?.number || ep?.episodeNum || 0) === episodeNo);
                if (byNumber >= 0) return { seasonIndex: si, episodeIndex: byNumber };

                const byTitle = menuTitle ? eps.findIndex((ep) => normalizeTitleForMatch(String(ep?.title || '')) === menuTitle) : -1;
                if (byTitle >= 0) return { seasonIndex: si, episodeIndex: byTitle };
            }

            if (!isScopedAnimeMenu) {
                for (let si = 0; si < tvSeasons.length; si += 1) {
                    const eps = Array.isArray(tvSeasons[si]?.episodes) ? tvSeasons[si].episodes : [];
                    const byNumber = eps.findIndex((ep) => Number(ep?.episode || ep?.number || ep?.episodeNum || 0) === episodeNo);
                    if (byNumber >= 0) return { seasonIndex: si, episodeIndex: byNumber };
                }
            }

            if (allowProviderEpisodeInjection && currentIsLikelyAnime && isScopedAnimeMenu) {
                let targetSeasonIndex = tvSeasons.findIndex((season) => Number(season?.seasonNo || 0) === seasonNo);
                if (targetSeasonIndex < 0) {
                    tvSeasons.push({
                        seasonNo,
                        seasonPartNo: seasonPart,
                        name: `Season ${seasonNo}`,
                        providerAnimeId: menuSeasonProviderId || null,
                        episodes: [],
                    });
                    tvSeasons.sort((a, b) => {
                        const seasonDiff = Number(a?.seasonNo || 0) - Number(b?.seasonNo || 0);
                        if (seasonDiff !== 0) return seasonDiff;
                        return Number(a?.seasonPartNo || 0) - Number(b?.seasonPartNo || 0);
                    });
                    targetSeasonIndex = tvSeasons.findIndex((season) => Number(season?.seasonNo || 0) === seasonNo);
                }

                const targetSeason = tvSeasons[targetSeasonIndex];
                if (targetSeason) {
                    if (!Array.isArray(targetSeason.episodes)) targetSeason.episodes = [];
                    let targetEpisodeIndex = targetSeason.episodes.findIndex((ep) => {
                        const epId = String(ep?.id || '').trim().toLowerCase();
                        const epNo = Number(ep?.episode || ep?.number || ep?.episodeNum || 0);
                        return (episodeId && epId === episodeId) || epNo === episodeNo;
                    });
                    if (targetEpisodeIndex < 0) {
                        targetSeason.episodes.push({
                            id: episodeId || null,
                            episode: episodeNo,
                            number: episodeNo,
                            episodeNum: episodeNo,
                            title: String(menuEpisode?.title || `Episode ${episodeNo}`),
                        });
                        targetSeason.episodes.sort((a, b) => Number(a?.episode || a?.number || 0) - Number(b?.episode || b?.number || 0));
                        targetEpisodeIndex = targetSeason.episodes.findIndex((ep) => {
                            const epId = String(ep?.id || '').trim().toLowerCase();
                            const epNo = Number(ep?.episode || ep?.number || ep?.episodeNum || 0);
                            return (episodeId && epId === episodeId) || epNo === episodeNo;
                        });
                    }
                    if (targetEpisodeIndex >= 0) {
                        return { seasonIndex: targetSeasonIndex, episodeIndex: targetEpisodeIndex };
                    }
                }
            }

            const fallbackSeason = candidateSeasonIndices[0] ?? safeSeasonIndex;
            const safeEpisodes = Array.isArray(tvSeasons[fallbackSeason]?.episodes) ? tvSeasons[fallbackSeason].episodes : [];
            const safeEpisodeIndex = Math.max(0, Math.min(Math.max(0, safeEpisodes.length - 1), Number(fallbackEpisodeIndex || 0)));
            return { seasonIndex: fallbackSeason, episodeIndex: safeEpisodeIndex };
        }

        function buildEpPanel() {
            epPanel.innerHTML = '';
            const legend = document.createElement('div');
            legend.className = 'ep-legend';
            legend.innerHTML = `
                <span class="ep-legend-badge manga">Manga Canon</span>
                <span class="ep-legend-badge mixed">Mixed</span>
                <span class="ep-legend-badge filler">Filler</span>
                <span class="ep-legend-note">${fillerLookupState === 'loading' ? 'checking...' : (fillerLookupState === 'ready' ? 'from animefillerlist' : (fillerLookupState === 'fetch_failed' ? 'fetch blocked' : 'not found'))}</span>
            `;
            epPanel.appendChild(legend);

            const menuSeasons = getEpisodeMenuSeasons();
            if (!menuSeasons.length) {
                const empty = document.createElement('div');
                empty.className = 'audio-item';
                empty.textContent = 'Episode list not available for active server yet.';
                epPanel.appendChild(empty);
                return;
            }
            menuSeasons.forEach((s, si) => {
                const lbl = document.createElement('div');
                lbl.className = 'ep-season';
                lbl.textContent = buildSeasonDisplayNameForMenu(s, si, currentIsLikelyAnime);
                epPanel.appendChild(lbl);

                const renderedEpisodeKeys = new Set();

                (s.episodes || []).forEach((ep, ei) => {
                    const mapped = resolveGlobalEpisodeIndices(s, ep, si, ei, false);
                    const scopedProvider = String(getActiveEpisodeMenuProvider() || '').trim().toLowerCase();
                    const providerEpisodeId = String(ep?.id || '').trim().toLowerCase();
                    const menuEpisodeNo = Number(ep?.episode || ep?.number || ep?.episodeNum || (ei + 1));
                    const mappedKey = currentIsLikelyAnime && scopedProvider
                        ? `${scopedProvider}:${String(s?.providerAnimeId || s?.seasonNo || si).trim().toLowerCase()}:${providerEpisodeId || menuEpisodeNo}:${normalizeTitleForMatch(String(ep?.title || ''))}`
                        : `${mapped.seasonIndex}:${mapped.episodeIndex}`;
                    if (renderedEpisodeKeys.has(mappedKey)) return;
                    renderedEpisodeKeys.add(mappedKey);

                    const item = document.createElement('div');
                    item.className = 'ep-item';
                    const epNo = menuEpisodeNo;
                    const epTitle = ep.title || `Episode ${epNo}`;

                    const displayEpNo = epNo;

                    const fillerStatus = episodeFillerStatus.get(epNo);
                    let fillerBadge = '';
                    if (fillerStatus === 'manga') {
                        item.classList.add('manga-canon');
                        fillerBadge = '<span class="filler-badge canon">Canon</span>';
                    } else if (fillerStatus === 'mixed') {
                        item.classList.add('filler-mixed');
                        fillerBadge = '<span class="filler-badge mixed">Mixed</span>';
                    } else if (fillerStatus === 'filler') {
                        item.classList.add('filler-full');
                        fillerBadge = '<span class="filler-badge filler">Filler</span>';
                    }

                    item.innerHTML = `
                        <div class="ep-item-info">
                            <span class="ep-item-num">${displayEpNo}</span>
                            <span class="ep-item-title">${epTitle}</span>
                        </div>
                        ${fillerBadge}
                    `;

                    item.dataset.si = mapped.seasonIndex;
                    item.dataset.ei = mapped.episodeIndex;
                    item.onclick = () => {
                        const menuProvider = String(getActiveEpisodeMenuProvider() || activeMenuProvider || '').trim().toLowerCase();
                        const target = resolveGlobalEpisodeIndices(s, ep, si, ei, true);
                        const hintEpisodeNoRaw = Number(ep?.episode || ep?.number || ep?.episodeNum || displayEpNo);
                        const hintSeasonNoRaw = Number(s?.seasonNo || 0);
                        const hintSeasonPartRaw = Number(s?.seasonPartNo || s?.part || s?.partNo || 0);
                        pendingEpisodeSelectionHint = {
                            provider: menuProvider || null,
                            episodeId: String(ep?.id || '').trim() || null,
                            seasonNo: Number.isFinite(hintSeasonNoRaw) && hintSeasonNoRaw > 0 ? hintSeasonNoRaw : null,
                            seasonPartNo: Number.isFinite(hintSeasonPartRaw) && hintSeasonPartRaw > 0 ? hintSeasonPartRaw : 0,
                            episodeNo: Number.isFinite(hintEpisodeNoRaw) && hintEpisodeNoRaw > 0 ? hintEpisodeNoRaw : null,
                            providerAnimeId: String(s?.providerAnimeId || '').trim() || null,
                        };
                        epPanel.classList.remove('open');
                        playTvEp(target.seasonIndex, target.episodeIndex, 0);
                    };
                    epPanel.appendChild(item);
                });
            });
        }

        function updateEpUI(si, ei) {
            const matches = [];
            epPanel.querySelectorAll('.ep-item').forEach(el => {
                const isMatch = +el.dataset.si === si && +el.dataset.ei === ei;
                el.classList.toggle('active', isMatch);
                if (isMatch) matches.push(el);
            });

            // If duplicate mapped rows exist for any reason, keep only one selected.
            if (matches.length > 1) {
                for (let i = 1; i < matches.length; i += 1) {
                    matches[i].classList.remove('active');
                }
            }

            const sel = matches[0] || epPanel.querySelector('.ep-item.active');
            if (sel) sel.scrollIntoView({ block: 'center' });
        }

        function getNextEpisodeRef() {
            if (MEDIA_TYPE !== 'tv' || !Array.isArray(tvSeasons) || tvSeasons.length === 0) return null;
            const season = tvSeasons[curSeason];
            const episodes = season?.episodes || [];
            if (curEpisode + 1 < episodes.length) {
                return { seasonIndex: curSeason, episodeIndex: curEpisode + 1 };
            }
            for (let si = curSeason + 1; si < tvSeasons.length; si += 1) {
                const eps = tvSeasons[si]?.episodes || [];
                if (eps.length > 0) return { seasonIndex: si, episodeIndex: 0 };
            }
            return null;
        }

        let _nextEpCountdownTimer = null;
        const NEXT_EP_DURATION_MS = 8000;
        let _nextEpElapsed = 0; // total non-paused ms elapsed
        let _nextEpLastTick = 0; // Date.now() at last tick

        function _clearNextEpCountdown() {
            if (_nextEpCountdownTimer) {
                clearTimeout(_nextEpCountdownTimer);
                _nextEpCountdownTimer = null;
            }
            _nextEpElapsed = 0;
            _nextEpLastTick = 0;
            if (nextEpisodeBtn) {
                nextEpisodeBtn.classList.remove('counting', 'countdown-paused');
                void nextEpisodeBtn.offsetWidth; // reset CSS animation
            }
        }

        function _tickNextEpCountdown() {
            // Stop if button hidden or countdown was cancelled
            if (!nextEpisodeBtn || nextEpisodeBtn.style.display === 'none') return;
            if (!nextEpisodeBtn.classList.contains('counting')) return;

            const now = Date.now();
            const paused = !video || (video.paused && !video.ended);

            // Accumulate time only while playing
            if (!paused) {
                _nextEpElapsed += now - _nextEpLastTick;
            }
            _nextEpLastTick = now;

            // Keep CSS animation in sync with playback state
            if (paused) {
                nextEpisodeBtn.classList.add('countdown-paused');
            } else {
                nextEpisodeBtn.classList.remove('countdown-paused');
            }

            if (_nextEpElapsed >= NEXT_EP_DURATION_MS) {
                _clearNextEpCountdown();
                // FINAL GATE: Never switch automatically if the user preference is disabled.
                if (autoEpisodeEnabled === true) {
                    console.log('[AutoEp] Preferred: ON. Advancing to next episode.');
                    goToNextEpisode();
                } else {
                    console.log('[AutoEp] Preferred: OFF. Staying on current page.');
                }
                return;
            }

            _nextEpCountdownTimer = setTimeout(_tickNextEpCountdown, 100);
        }

        function _startNextEpCountdown() {
            // Respect user preference globally: if disabled, don't even start the countdown sweep.
            if (!autoEpisodeEnabled) return;

            _clearNextEpCountdown();
            void nextEpisodeBtn.offsetWidth; // restart CSS animation
            nextEpisodeBtn.classList.add('counting');
            _nextEpElapsed = 0;
            _nextEpLastTick = Date.now();
            _tickNextEpCountdown();
        }

        // --- Skip Countdown logic ---
        let _skipCountdownTimer = null; // now using requestAnimationFrame
        const SKIP_COUNTDOWN_DURATION_MS = 5000;
        let _skipElapsed = 0;
        let _skipLastTick = 0;
        let _skipBtnWasVisible = false;
        let _skipActiveType = null; // intro or outro
        let _skipActiveSegment = null;
        let _lastSkipUiTime = 0;

        function _clearSkipCountdown() {
            if (_skipCountdownTimer) {
                clearTimeout(_skipCountdownTimer);
                _skipCountdownTimer = null;
            }
            _skipElapsed = 0;
            _skipLastTick = 0;
            _skipActiveType = null;
            _skipActiveSegment = null;
            if (skipSegmentBtn) {
                skipSegmentBtn.classList.remove('counting', 'countdown-paused');
            }
        }

        function rearmSkippedSegmentsForTime(nowSec) {
            if (!Number.isFinite(nowSec)) return;

            const segments = {
                intro: animeSkipSegments.intro,
                outro: animeSkipSegments.outro
            };

            for (const [type, seg] of Object.entries(segments)) {
                if (!seg || !skippedSegments[type]) continue;
                if (nowSec < seg.start + 0.25) {
                    skippedSegments[type] = false;
                }
            }

            if (!skippedSegments.intro && !skippedSegments.outro) {
                _skipBtnWasVisible = false;
            }
        }

        function forceVideoSeek(target, attempt = 0) {
            if (!video || !Number.isFinite(target)) return;

            const clampedTarget = Math.max(0, target);
            const seekDistance = Math.abs(clampedTarget - Number(video.currentTime || 0));
            const inRapidSeekMode = Date.now() < rapidSeekModeUntil || seekBurstCount >= 6;
            const lockedHlsAudioTrack = (hlsInst && Number.isInteger(hlsInst.audioTrack) && hlsInst.audioTrack >= 0)
                ? hlsInst.audioTrack
                : -1;

            // During heavy seeking, avoid stopLoad/startLoad churn since it triggers emptied/waiting loops.
            if (hlsInst && attempt === 0) {
                try {
                    if (!inRapidSeekMode && seekDistance > 12) {
                        kickHlsLoadNearCurrentTime(clampedTarget, seekDistance > 24);
                    }
                } catch (_) { }
            }

            const seekDelay = 0;

            setTimeout(() => {
                if (!video) return;
                video.currentTime = clampedTarget;

                // Keep the selected HLS audio track stable across seek jumps.
                if (hlsInst && lockedHlsAudioTrack >= 0 && hlsInst.audioTrack !== lockedHlsAudioTrack) {
                    try { hlsInst.audioTrack = lockedHlsAudioTrack; } catch (_) { }
                }

                const pct = video.duration > 0 ? (clampedTarget / video.duration) * 100 : 0;
                if (seekBar) {
                    seekBar.value = pct;
                    seekBar.style.setProperty('--seek-percent', pct + '%');
                }

                const reachedTarget = Math.abs((video.currentTime || 0) - clampedTarget) <= 0.75;
                if (reachedTarget || attempt >= 2 || isSourceSwitching) return;

                setTimeout(() => {
                    if (!video) return;
                    const stillOffTarget = Math.abs((video.currentTime || 0) - clampedTarget) > 0.75;
                    if (stillOffTarget) {
                        forceVideoSeek(clampedTarget, attempt + 1);
                    }
                }, 120 + (attempt * 80));
            }, seekDelay);
        }

        function performSkipJump(type, manual = false) {
            if (!video || !type || !isFinite(video.duration)) return;

            const preservedSegment = _skipActiveSegment && _skipActiveType === type ? { ..._skipActiveSegment } : null;
            _clearSkipCountdown();
            const active = getActiveSkipSegment(video.currentTime);
            const segment = preservedSegment || active || (type === 'intro' ? animeSkipSegments.intro : animeSkipSegments.outro);

            if (!segment) {
                console.log(`[Skip] Cannot skip ${type}: segment metadata missing.`);
                return;
            }

            console.log(`[Skip] Executing ${type} skip to ${segment.end} (Manual: ${manual})`);

            if (type === 'intro') skippedSegments.intro = true;
            if (type === 'outro') skippedSegments.outro = true;

            const target = Math.max(0, segment.end + 0.3);

            // ENHANCED: Pre-buffer strategy for smooth skips
            // Pause preview operations during skip to avoid interfering with main stream
            const previewVideo = document.getElementById('previewVideo');
            if (previewVideo) {
                try {
                    previewVideo.pause();
                } catch (_) { }
            }

            // Pre-buffer the target area before executing the skip
            const jumpDistance = Math.abs(target - (video.currentTime || 0));
            const prebufferTime = Math.max(0, target - (jumpDistance > 30 ? 5 : 1.5));

            // Use gentler quality tuning for the skip operation
            tuneHlsForJump(target, jumpDistance, 'skip');

            if (hlsInst && hlsSessionIsFragile) {
                console.log(`[Skip] HLS session is fragile, hot-reloading stream for ${type} skip.`);
                performHotReloadJump(target, 'skip');
                _skipBtnWasVisible = false;
                if (skipSegmentBtn) skipSegmentBtn.style.display = 'none';
                syncTimeUI();
                window.isAutoSkipping = false;
                return;
            }

            // Wait briefly for pre-buffering before seeking (gives HLS time to prepare chunks)
            setTimeout(() => {
                // Force the media element to settle on the skip target even if the stream briefly resists seeks.
                applyGuardedJump(target, 'skip');

                if (!video.paused) {
                    video.play().catch(() => { });
                }

                _skipBtnWasVisible = false;
                if (skipSegmentBtn) skipSegmentBtn.style.display = 'none';

                // Ensure UI updates to reflect the new position
                syncTimeUI();
                window.isAutoSkipping = false;

                // Resume preview after skip completes
                setTimeout(() => {
                    if (previewVideo && !manual) {
                        try {
                            const warmupOnReady = () => {
                                try {
                                    if (isFinite(previewVideo.duration) && previewVideo.duration > 2) {
                                        previewVideo.currentTime = 1.0;
                                    }
                                    previewVideo.pause();
                                } catch (_) { }
                            };
                            previewVideo.addEventListener('canplay', warmupOnReady, { once: true });
                        } catch (_) { }
                    }
                }, 300);
            }, 500); // Short pre-buffer delay before actual skip (avoids jarring transitions)
        }

        function _tickSkipCountdown() {
            if (!_skipActiveType || !_skipActiveSegment || !skipSegmentBtn) return;
            if (!skipSegmentBtn.classList.contains('counting')) return;

            const now = Date.now();
            const videoPaused = !video || (video.paused && !video.ended);

            // Accumulate time only while playing
            if (!videoPaused) {
                _skipElapsed += now - _skipLastTick;
            }
            _skipLastTick = now;

            // Handle visual pause state
            if (videoPaused) {
                skipSegmentBtn.classList.add('countdown-paused');
            } else {
                skipSegmentBtn.classList.remove('countdown-paused');
            }

            if (_skipElapsed >= SKIP_COUNTDOWN_DURATION_MS) {
                const finalType = _skipActiveType;
                const finalSegment = _skipActiveSegment ? { ..._skipActiveSegment } : null;
                console.log(`[AutoSkip] COMPLETED countdown for: ${finalType}`);

                _clearSkipCountdown();

                if (finalType && finalSegment) {
                    const shouldAuto = (finalType === 'intro' && autoSkipIntroEnabled) || (finalType === 'outro' && autoSkipOutroEnabled);
                    if (shouldAuto) {
                        _skipActiveType = finalType;
                        _skipActiveSegment = finalSegment;
                        performSkipJump(finalType, false);
                    }
                }
                return;
            }
            _skipCountdownTimer = setTimeout(_tickSkipCountdown, 100);
        }

        function _startSkipCountdown() {
            const active = getActiveSkipSegment(video.currentTime);
            if (!active) return;
            const shouldAuto = (active.type === 'intro' && autoSkipIntroEnabled) ||
                (active.type === 'outro' && autoSkipOutroEnabled);

            if (!shouldAuto) return;

            _clearSkipCountdown();
            window.isAutoSkipping = true;
            _skipActiveType = active.type;
            _skipActiveSegment = { ...active };
            void skipSegmentBtn.offsetWidth;
            skipSegmentBtn.classList.add('counting');
            _skipElapsed = 0;
            _skipLastTick = Date.now();
            _tickSkipCountdown();
        }

        let _nextEpBtnWasVisible = false; // tracks previous visibility state

        function updateNextEpisodeButton(forceShow = false) {
            if (!nextEpisodeBtn) return;
            const next = getNextEpisodeRef();
            if (!next || !video) {
                nextEpisodeBtn.style.display = 'none';
                _clearNextEpCountdown();
                _nextEpBtnWasVisible = false;
                return;
            }
            if (forceShow) {
                nextEpisodeBtn.style.display = 'inline-flex';
                if (!_nextEpBtnWasVisible) {
                    _nextEpBtnWasVisible = true;
                    _startNextEpCountdown();
                }
                return;
            }
            if (!isFinite(video.duration) || video.duration <= 0) {
                nextEpisodeBtn.style.display = 'none';
                _clearNextEpCountdown();
                _nextEpBtnWasVisible = false;
                return;
            }
            const remaining = video.duration - (video.currentTime || 0);
            const shouldShow = remaining <= 30;

            nextEpisodeBtn.style.display = shouldShow ? 'inline-flex' : 'none';

            if (shouldShow && !_nextEpBtnWasVisible) {
                // Just entered the last-30s window — start the countdown
                _nextEpBtnWasVisible = true;
                _startNextEpCountdown();
            } else if (!shouldShow && _nextEpBtnWasVisible) {
                // Seeked back out — cancel the countdown
                _nextEpBtnWasVisible = false;
                _clearNextEpCountdown();
            }
        }



        async function goToNextEpisode() {
            const next = getNextEpisodeRef();
            if (!next) return;
            setLoader('Loading next episode...', 'Please wait');
            await playTvEp(next.seasonIndex, next.episodeIndex, 0);
        }

        async function playTvEp(si, ei, startTime = null) {
            curSeason = si; curEpisode = ei;
            pendingEpisodeStartTime = Number.isFinite(startTime) ? Number(startTime) : null;
            
            // Clear 'satoru' lock when switching episodes to allow fresh provider resolution
            // Satoru is often a virtual provider used for multi-language tracks; locking it
            // across episodes can break playback if the next episode lacks those sources.
            if (String(FORCED_PROVIDER || '').toLowerCase() === 'satoru') {
                FORCED_PROVIDER = '';
            }

            updateEpisodeUrlState(false);
            const season = tvSeasons[si];
            const ep = (season?.episodes || [])[ei];
            if (!ep) return;
            resetAnimeSkipState();
            updateNextEpisodeButton(false);

            updateEpUI(si, ei);
            const epNo = Number(ep.episode || ep.number || ep.episodeNum || (ei + 1));
            const epTitle = String(ep.title || '').trim();
            let seasonTitle = String(season?.name || `Season ${si + 1}`).trim();
            if (currentIsLikelyAnime) {
                seasonTitle = seasonTitle.replace(/^Season /i, 'Part ');
            }
            const metaText = epTitle
                ? `${seasonTitle} - Episode ${epNo}: ${epTitle}`
                : `${seasonTitle} - Episode ${epNo}`;
            document.getElementById('media-meta').textContent = metaText;

            // Store current season/episode indices for the per-provider fetch
            await fetchSources(null);
        }

        // -----------------------------------------------------------------------
        //  FETCH SOURCES - per-provider: get that provider's own episodeId, then watch
        // -----------------------------------------------------------------------
        async function fetchSources(forcedProviderOverride = null) {
            if (forcedProviderOverride !== null) FORCED_PROVIDER = forcedProviderOverride;
            
            // Use the anime detection status that was already determined in init()
            // This preserves the intelligent anime detection across provider changes
            console.log('fetchSources: Using detected anime status:', currentIsLikelyAnime);

            allSources.length = 0;
            activeFlixhqServerName = '';
            satoruAudioSources = [];
            currentAudioSource = 'animesalt';
            activeSatoruTrackIndex = -1;
            setExternalSubtitleTracks([]);
            currentIdx = 0;
            hideError();
            setLoader('Searching providers...', 'Trying available sources');
            resetPlayerSurface();
            const selectedSeason = tvSeasons?.[curSeason];
            const selectedEpisode = selectedSeason?.episodes?.[curEpisode];
            const selectedSeasonNoRaw = Number(selectedSeason?.seasonNo);
            let selectedSeasonNo = Number.isFinite(selectedSeasonNoRaw) && selectedSeasonNoRaw > 0
                ? selectedSeasonNoRaw
                : (curSeason + 1);
            const selectionHint = pendingEpisodeSelectionHint;
            pendingEpisodeSelectionHint = null;
            const selectedEpisodeNoRaw = Number(
                selectedEpisode?.episode || selectedEpisode?.number || selectedEpisode?.episodeNum,
            );
            let selectedEpisodeNo = Number.isFinite(selectedEpisodeNoRaw) && selectedEpisodeNoRaw > 0
                ? selectedEpisodeNoRaw
                : (curEpisode + 1);

            const hintedProvider = String(selectionHint?.provider || '').trim().toLowerCase();
            const forcedProviderRaw = String(FORCED_PROVIDER || '').trim().toLowerCase();
            const effectiveForcedProvider = (() => {
                if (!currentIsLikelyAnime) return forcedProviderRaw;
                // Only honor explicit provider locks (URL/source selection),
                // not inferred menu/stream provider context.
                if (forcedProviderRaw) return forcedProviderRaw;
                return forcedProviderRaw;
            })();
            if (effectiveForcedProvider && effectiveForcedProvider !== forcedProviderRaw) {
                FORCED_PROVIDER = effectiveForcedProvider;
            }
            if (currentIsLikelyAnime && selectionHint) {
                const hintSeasonNo = Number(selectionHint?.seasonNo || 0);
                const hintEpisodeNo = Number(selectionHint?.episodeNo || 0);
                if (Number.isFinite(hintSeasonNo) && hintSeasonNo > 0) selectedSeasonNo = hintSeasonNo;
                if (Number.isFinite(hintEpisodeNo) && hintEpisodeNo > 0) selectedEpisodeNo = hintEpisodeNo;
            }

            // Define which providers to search
            let providersToTry = activeProviders;
            let wasForced = !!FORCED_PROVIDER;

            // If the selected episode already carries a provider-style SxE id,
            // trust that mapping over derived season/episode counters.
            const selectedEpisodeId = String(selectionHint?.episodeId || selectedEpisode?.id || '').trim();
            const selectedEpisodeIdMatch = selectedEpisodeId.match(/-(\d+)x(\d+)$/i);
            const shouldTrustSxEId = hintedProvider === 'animesalt' || /(^|\b)animesalt\b/i.test(activeMenuProvider || '');
            if (currentIsLikelyAnime && shouldTrustSxEId && selectedEpisodeIdMatch) {
                const idSeasonNo = Number(selectedEpisodeIdMatch[1]);
                const idEpisodeNo = Number(selectedEpisodeIdMatch[2]);
                if (Number.isFinite(idSeasonNo) && idSeasonNo > 0) selectedSeasonNo = idSeasonNo;
                if (Number.isFinite(idEpisodeNo) && idEpisodeNo > 0) selectedEpisodeNo = idEpisodeNo;
            }
            const selectedAbsoluteEpisodeNo = Number(
                tvSeasons
