<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Watching | StreamVerse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Sora:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" href="logo.png">
    <!-- PWA manifest — gives iOS the signal to run without browser chrome in standalone mode -->
    <link rel="manifest" href="manifest.json">
    <!-- Standard PWA meta (non-Apple) -->
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Apple-specific PWA tags. These are required for iOS standalone mode. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StreamVerse">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        :root {
            --primary: #e50914;
            --primary-glow: rgba(229, 9, 20, 0.4);
            --bg: #000;
            --glass: rgba(15, 15, 15, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --muted: #a6a6a6;
            --transition: all .25s cubic-bezier(.4, 0, .2, 1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            font-family: 'Sora', sans-serif;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }

        /* LOADER */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0s;
            background-size: cover;
            background-position: center;
        }

        #loader::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0, 0, 0, .6), rgba(0, 0, 0, 0.95));
        }

        .loader-inner {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 0 1rem;
        }

        .loader-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            letter-spacing: -1.5px;
        }



        .loader-logo span {
            color: var(--primary);
            text-shadow: 0 0 25px var(--primary-glow);
        }

        #loader-title {
            font-weight: 700;
            font-size: 1.15rem;
            margin-bottom: .4rem;
        }

        #loader-sub {
            font-size: .85rem;
            color: var(--muted);
            margin-bottom: 2.5rem;
            letter-spacing: 0.3px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            margin: 0 auto;
            border: 3px solid rgba(255, 255, 255, .05);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite, pulse-glow 2s infinite ease-in-out;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 10px var(--primary-glow);
            }

            50% {
                box-shadow: 0 0 25px var(--primary-glow);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* PROVIDER PROGRESS */
        #provider-progress {
            margin-top: 1.8rem;
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .prov-chip {
            padding: .3rem .9rem;
            border-radius: 50px;
            font-size: .75rem;
            font-weight: 600;
            border: 1px solid var(--glass-border);
            color: var(--muted);
            transition: var(--transition);
        }

        .prov-chip.trying {
            border-color: rgba(255, 180, 0, .5);
            color: #ffb400;
        }

        .prov-chip.success {
            border-color: rgba(50, 200, 100, .5);
            color: #32c864;
        }

        .prov-chip.failed {
            border-color: rgba(229, 9, 20, .3);
            color: #e50914;
            opacity: .6;
        }

        /* HEADER */
        .player-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: calc(1.4rem + var(--safe-top)) calc(1.8rem + var(--safe-right)) 1.4rem calc(1.8rem + var(--safe-left));
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.85), transparent);
            display: flex;
            align-items: center;
            gap: 1.2rem;
            z-index: 270;
            pointer-events: none;
            transition: var(--transition);
        }

        .player-header.hidden {
            transform: translateY(-100%);
            opacity: 0;
        }

        .back-btn {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: scale(1.08);
        }

        .header-info h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .header-info p {
            font-size: .85rem;
            color: var(--muted);
            margin-top: .1rem;
        }

        /* PLAYER */
        .player-wrap {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 1;
        }

        /* ── iOS Pseudo-Fullscreen ───────────────────────────────────────────
           iOS Safari cannot grant true document fullscreen. When the user taps
           the fullscreen button on iPhone/iPad we instead apply this mode:
           the player-wrap and control-surface are promoted to a very high
           z-index so they sit above all other page chrome, and the body is
           scroll-locked so swipe-to-dismiss can't escape the player.

           We use 100dvh (dynamic viewport height) so the player auto-adjusts
           as the address bar slides in/out during interaction.
        ──────────────────────────────────────────────────────────────────── */
        html.ios-pseudo-fs-active,
        html.ios-pseudo-fs-active body {
            overflow: hidden !important;
            /* Prevent iOS rubber-band scroll from revealing page beneath */
            overscroll-behavior: none;
            position: fixed;
            width: 100%;
            /* Black background so any sliver outside the player is invisible */
            background: #000 !important;
        }

        html.ios-pseudo-fs-active .player-wrap {
            position: fixed !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100dvh !important; /* dynamic viewport — handles address-bar collapse */
            z-index: 99999 !important;
            background: #000 !important;
            overscroll-behavior: none !important; /* Prevent swipe-to-refresh/history navigation */
        }

        html.ios-pseudo-fs-active .control-surface {
            position: fixed !important;
            inset: 0 !important;
            z-index: 100100 !important; /* always above player-wrap */
            pointer-events: auto !important; /* iOS: ensure taps reach buttons */
        }

        /* Force all interactive elements inside the control surface to be tappable */
        html.ios-pseudo-fs-active .control-surface button,
        html.ios-pseudo-fs-active .control-surface input,
        html.ios-pseudo-fs-active .control-surface [role="button"] {
            pointer-events: auto !important;
        }

        /* Plyr wrapper must also fill the promoted container */
        html.ios-pseudo-fs-active .plyr,
        html.ios-pseudo-fs-active .plyr__video-wrapper {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
        }

        /* Ensure any panels (server picker, episode list, etc.) remain visible */
        html.ios-pseudo-fs-active [class*="-panel"],
        html.ios-pseudo-fs-active [class*="-drawer"],
        html.ios-pseudo-fs-active .skip-btn-wrap,
        html.ios-pseudo-fs-active #skipIntroBtn,
        html.ios-pseudo-fs-active #skipOutroBtn {
            z-index: 100200 !important;
        }

        /* Orientation hint pill shown briefly when entering landscape pseudo-fs */
        #ios-rotate-hint {
            position: fixed;
            bottom: 14%;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: rgba(0,0,0,.72);
            color: #fff;
            font-size: 13px;
            padding: 7px 18px;
            border-radius: 999px;
            pointer-events: none;
            z-index: 100300;
            opacity: 0;
            transition: opacity .25s ease, transform .25s ease;
            white-space: nowrap;
        }
        #ios-rotate-hint.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── iOS Add to Home Screen banner ────────────────────────────────── */
        #ios-a2hs-banner {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            width: min(94vw, 420px);
            z-index: 200000;
            transition: transform .35s cubic-bezier(.4,0,.2,1);
            filter: drop-shadow(0 -4px 24px rgba(0,0,0,.55));
        }
        #ios-a2hs-banner.visible {
            transform: translateX(-50%) translateY(0);
        }
        .a2hs-inner {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(18,18,22,.96);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 20px 20px 0 0;
            padding: 14px 16px 20px;
            backdrop-filter: blur(16px);
        }
        .a2hs-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            flex-shrink: 0;
            object-fit: cover;
        }
        .a2hs-text {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .a2hs-text strong {
            font-size: 14px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
        }
        .a2hs-text span {
            font-size: 12px;
            color: rgba(255,255,255,.65);
            line-height: 1.4;
        }
        .a2hs-share-icon {
            display: inline-block;
            background: #007AFF;
            color: #fff;
            font-size: 11px;
            padding: 1px 5px;
            border-radius: 5px;
            font-weight: 700;
            vertical-align: middle;
        }
        .a2hs-text em { color: #fff; font-style: normal; font-weight: 600; }
        .a2hs-close {
            background: rgba(255,255,255,.1);
            border: none;
            color: rgba(255,255,255,.6);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .a2hs-arrow {
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 10px solid rgba(18,18,22,.96);
            margin: 0 auto;
        }

        #video-brightness-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.1s linear;
        }

        #player-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: var(--video-fit, contain);
            object-position: center;
        }

        .plyr {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            --plyr-color-main: var(--primary);
        }

        .plyr__video-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .plyr video {
            object-fit: contain;
        }

        /* Custom control surface (from requested player UI) */
        .plyr__controls,
        .plyr__control--overlaid {
            display: none !important;
        }

        :root {
            --video-fit: contain;
        }

        #player-video,
        .plyr video {
            object-fit: var(--video-fit, contain);
            object-position: center;
        }

        .control-surface {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0 4vw 2vh;
            pointer-events: auto;
            z-index: 260;
            opacity: 0;
            transition: opacity .22s ease;
            background: rgba(0, 0, 0, 0.001);
            /* Transparent but makes it a reliable touch target on mobile */
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        .control-surface.visible {
            opacity: 1;
        }

        .player-cursor-hidden,
        .player-cursor-hidden .player-wrap,
        .player-cursor-hidden #player-video,
        .player-cursor-hidden .control-surface {
            cursor: none !important;
        }

        .control-surface:not(.visible) {
            pointer-events: none !important;
        }

        /* Allow lock button and skip buttons to always be clickable */
        .control-surface:not(.visible) #uiLockBtn,
        .control-surface:not(.visible) .ui-lock-btn,
        .control-surface:not(.visible) #skipBackBtn,
        .control-surface:not(.visible) #skipFwdBtn,
        .control-surface:not(.visible) #skipSegmentBtn {
            pointer-events: auto !important;
        }

        .control-surface:not(.visible) button,
        .control-surface:not(.visible) input[type="range"],
        .control-surface:not(.visible) .control-menu,
        .control-surface:not(.visible) .panel,
        .control-surface:not(.visible) [role="button"],
        .control-surface:not(.visible) [role="slider"] {
            pointer-events: none !important;
        }

        .control-center {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: min(80vw, 560px);
            margin: 0 auto;
            flex: 1;
            transform: translateY(4vh);
            position: relative;
            z-index: 6;
            pointer-events: none;
            isolation: isolate;
        }

        .control-center .ctrl-btn,
        .control-center .play-btn {
            position: relative;
            z-index: 7;
            pointer-events: auto;
        }

        .ctrl-btn {
            pointer-events: auto;
            border: 1px solid rgba(255, 255, 255, .2);
            background: rgba(20, 22, 30, .6);
            color: #fff;
            border-radius: 999px;
            width: 64px;
            height: 64px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .ctrl-btn span {
            font-size: 14px;
            font-weight: 600;
        }

        .ctrl-btn svg {
            width: 44px;
            height: 44px;
        }

        .ctrl-btn:hover {
            background: rgba(20, 22, 30, .6);
            border-color: var(--primary);
        }

        .play-btn {
            width: 84px;
            height: 84px;
            font-size: 26px;
        }

        .control-bottom {
            display: grid;
            grid-template-columns: minmax(88px, auto) 1fr;
            grid-template-areas:
                "seek seek"
                "time actions";
            align-items: center;
            column-gap: 1rem;
            row-gap: .85rem;
            pointer-events: auto;
            padding: 0 .5rem;
            position: relative;
            z-index: 12;
        }

        .time-readout {
            grid-area: time;
            display: flex;
            align-items: baseline;
            gap: .35rem;
            font-size: .9rem;
            color: rgba(255, 255, 255, .8);
            min-width: 90px;
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(20, 22, 30, 0.52);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .time-divider {
            color: rgba(255, 255, 255, .55);
        }

        .seek-wrapper {
            grid-area: seek;
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 30px;
            cursor: pointer;
            pointer-events: auto;
            z-index: 5;
        }

        .seek-track-base {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 5px;
            background: rgba(255, 255, 255, .15);
            border-radius: 999px;
            pointer-events: none;
            transform: translateY(-50%);
        }

        #skipMarkerContainer {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 5px;
            pointer-events: none;
            z-index: 1;
            transform: translateY(-50%);
        }

        .skip-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            background: rgba(168, 85, 247, 0.22);
            transition: background 0.2s ease, box-shadow 0.2s ease;
            z-index: 3;
        }

        /* Left edge tick */
        .skip-marker::before {
            content: '';
            position: absolute;
            left: 0;
            top: -2px;
            bottom: -2px;
            width: 2px;
            background: rgba(200, 150, 255, 0.9);
            border-radius: 2px;
        }

        /* Right edge tick */
        .skip-marker::after {
            content: '';
            position: absolute;
            right: 0;
            top: -2px;
            bottom: -2px;
            width: 2px;
            background: rgba(200, 150, 255, 0.9);
            border-radius: 2px;
        }

        .skip-marker.active {
            background: rgba(138, 48, 228, 0.82);
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.55);
        }

        .skip-marker.active::before,
        .skip-marker.active::after {
            background: rgba(235, 198, 255, 1);
        }

        .seek-bar {
            position: relative;
            width: 100%;
            appearance: none;
            height: 30px;
            border-radius: 999px;
            background: linear-gradient(to right, rgba(229, 9, 20, 0.58) 0%, rgba(229, 9, 20, 0.58) var(--seek-percent, 0%), transparent var(--seek-percent, 0%), transparent 100%) center / 100% 5px no-repeat;
            outline: none;
            cursor: pointer;
            z-index: 2;
            margin: 0;
            pointer-events: auto;
        }

        .seek-bar::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
        }

        .seek-bar::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
        }

        .seek-preview {
            position: absolute;
            bottom: auto;
            left: 0;
            display: flex;
            visibility: hidden;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.12s ease-out, transform 0.12s ease-out, visibility 0.12s;
            /* ENHANCED: Faster transitions */
            transform: translateX(-50%) translateY(3px);
            opacity: 0;
            filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.65));
            /* ENHANCED: Better shadow */
        }

        .seek-preview.visible {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(-1px);
        }

        .seek-preview-thumb {
            width: 240px;
            /* ENHANCED: Larger preview */
            aspect-ratio: 16/9;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
            /* ENHANCED: Better shadow */
            border: 2px solid rgba(229, 9, 20, 0.3);
            /* ENHANCED: Accent border */
            backdrop-filter: blur(2px);
        }

        .seek-preview-thumb::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 55%, rgba(0, 0, 0, 0.28));
            pointer-events: none;
            z-index: 2;
        }

        .seek-preview-thumb video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            display: block;
        }

        .seek-preview-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            display: none;
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .seek-preview-time {
            width: auto;
            min-width: 70px;
            background: rgba(15, 15, 15, 0.75);
            /* ENHANCED: Better overlay background */
            border: 1.5px solid rgba(229, 9, 20, 0.5);
            /* ENHANCED: Red accent */
            backdrop-filter: blur(12px);
            color: #fff;
            text-align: center;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            position: relative;
            margin-top: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .seek-preview-time::after {
            content: "";
            position: absolute;
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 7px solid rgba(15, 15, 15, 0.75);
        }

            .pause-media-card {
                position: absolute;
                left: 28px;
                bottom: calc(116px + var(--safe-bottom));
                max-width: min(720px, calc(100vw - 56px));
                display: flex;
                align-items: center;
                gap: 18px;
                padding: 20px 22px;
                border-radius: 22px;
                background: linear-gradient(135deg, rgba(12, 12, 14, 0.82), rgba(18, 18, 20, 0.56));
                border: 1px solid rgba(255, 255, 255, 0.10);
                box-shadow: 0 22px 60px rgba(0, 0, 0, 0.48);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                opacity: 0;
                transform: translateY(12px) scale(0.98);
                pointer-events: none;
                transition: opacity .22s ease, transform .22s ease;
                z-index: 0;
            }

            .pause-media-poster {
                width: 108px;
                height: 150px;
                border-radius: 14px;
                object-fit: cover;
                flex: 0 0 auto;
                background: rgba(255, 255, 255, 0.06);
                box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
            }

            .pause-media-card.show {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            .pause-media-meta {
                min-width: 0;
                display: flex;
                flex-direction: column;

           - Our custom overlay (#subtitleOverlay) renders subtitles in the

             rendering (::cue) so there is no double display.

             our JS sets track.mode = 'showing' and iOS renders the captions
             natively inside that container. On webkitendfullscreen we restore

        ──────────────────────────────────────────────────────────────────── */

        /* RIPPLE EFFECTS */
        .ripple-container {
            position: absolute;

        .seek-ripple {
            position: absolute;
            top: 50%;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);

            flex-direction: column;
            align-items: center;

            left: 80%;

            animation: ripple-anim 0.7s cubic-bezier(0.2, 0, 0.2, 1);

        @keyframes ripple-anim {

                transform: translate(-50%, -50%) scale(0.5);

                    z-index: 41;

            #audio-panel,

                left: 0 !important;

            .control-menu.active {
                transform: translateY(0);

                visibility: visible;
            }

            .sheet-dragging {
                transition: none !important;
                animation: none !important;
                will-change: transform, opacity;
                filter: brightness(1.05);
                box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5) !important;
            }

            .sheet-animating {
                transition: transform 0.35s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.3s ease !important;
            }

            @keyframes slideUpDrawer {
                from {
                    transform: translateY(100%);
                }

                to {
                    transform: translateY(0);
                }
            }

            .panel-label {
                text-align: center;
                margin-bottom: 1.5rem;
                font-size: 1.1rem;
            }

            .panel-label::after {
                content: '';
                position: absolute;
                top: 10px;
                left: 50%;
                transform: translateX(-50%);

            #source-panel::before,
            #ep-panel::before,

            .control-menu::before {

                left: 50%;
                transform: translateX(-50%);

                height: 5px;
                border-radius: 999px;

        }

        @media (pointer: coarse) {
            .control-center {

                z-index: 41;

        /* Enhanced Filler Episode Display */
        .ep-item {

        }

        .ep-legend-note {
            font-size: 0.65rem;
            opacity: 0.4;

            margin-left: auto;
        }

        .transition-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            pointer-events: none;
            opacity: 0;
            background-color: #000;
            transition: opacity 0.3s ease;
            display: none;
        }

        .transition-overlay.active {
            display: flex;
            opacity: 1;
            align-items: center;
            justify-content: center;
        }

        .transition-overlay canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* Seek buffering mode: keep video visible, show spinner only */
        .transition-overlay.buffering-lite {
            background-color: transparent !important;
        }

        .transition-overlay.buffering-lite canvas {
            display: none !important;
        }

        /* Spinner shown on top of frozen frame during source switch */
        .transition-spinner {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .transition-spinner-ring {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 4px solid rgba(168, 85, 247, 0.15);
            border-top-color: #a855f7;
            animation: tspin 1s linear infinite;

        @keyframes tspin {
            to {
                transform: rotate(360deg);
            }
        }

        const RUNTIME_CONFIG = window.__STREAMVERSE_CONFIG__ || {};

            requestedApiSource === 'local' || requestedApiSource === 'prod'

        const IS_MOBILE_CLIENT =
            /Android|iPhone|iPad|iPod|Mobile|Opera Mini|IEMobile/i.test(navigator.userAgent || '') ||

        // Prefer selected source first, but always keep a remote/local fallback.

            const deduped = [];

            for (const base of preferred) {
                const normalized = String(base || '').trim().replace(/\/$/, '');
                if (!normalized || !/^https?:\/\//i.test(normalized) || seen.has(normalized)) continue;
                seen.add(normalized);
                deduped.push(normalized);
            }
            return deduped;
        })();

        const IS_LOCAL_API = /localhost|127\.0\.0\.1/i.test(API_BASE);
        let activeApiBase = API_BASE;
        function getProxiedUrl(url, referer = '') {
            if (!url) return '';
            try {
                const u = new URL(url);
                if (u.hostname === 'localhost' || u.hostname === '127.0.0.1' || url.includes('/utils/proxy')) return url;
                const apiOrigin = activeApiBase.split('/meta/tmdb')[0];
                const ref = referer ? `&referer=${encodeURIComponent(referer)}` : '';
                return `${apiOrigin}/utils/proxy?url=${encodeURIComponent(url)}${ref}`;
            } catch (_) { return url; }
        }

        function pickPlayableUrlFromPayload(payload) {
            const candidates = [
                payload?.url,
                payload?.link,
                payload?.stream,
                payload?.data?.url,
                payload?.data?.link,
                payload?.data?.stream,
                payload?.data?.file,
                payload?.result?.url,
                payload?.result?.link,
                payload?.result?.stream,
            ];
            for (const candidate of candidates) {
                const value = String(candidate || '').trim();
                if (/^https?:\/\//i.test(value)) return value;
            }
            return '';
        }

        function extractFileAndKeyFromSource(source) {
            const src = source || {};
            const directFile = String(src.file || src.streamFile || src.sourceFile || '').trim();
            const directKey = String(src.key || src.streamKey || src.sourceKey || '').trim();
            if (directFile && directKey) return { file: directFile, key: directKey };

            const rawUrl = String(src.url || '').trim();
            if (!rawUrl) return { file: '', key: '' };
            try {
                const parsed = new URL(rawUrl);
                const file = String(parsed.searchParams.get('file') || '').trim();
                const key = String(parsed.searchParams.get('key') || '').trim();
                return { file, key };
            } catch (_) {
                return { file: '', key: '' };
            }
        }

        function extractFirstPlayableUrlFromText(rawText) {
            const text = String(rawText || '');
            if (!text) return '';
            const explicitMedia = text.match(/https?:\/\/[^\s"'<>]+(?:\.m3u8|\.mp4)(?:\?[^\s"'<>]*)?/i);
            if (explicitMedia?.[0]) return explicitMedia[0];
            const general = text.match(/https?:\/\/[^\s"'<>]+/ig) || [];
            for (const candidate of general) {
                const low = String(candidate || '').toLowerCase();
                if (low.includes('ads') || low.includes('banner')) continue;
                if (low.includes('.m3u8') || low.includes('.mp4') || low.includes('/file/stream/')) return candidate;
            }
            return '';
        }

        function decodeNumericCharcodeString(rawText) {
            const text = String(rawText || '').trim();
            if (!text) return '';
            const tokens = text.split(/\s+/).filter((token) => /^\d{1,3}$/.test(token));
            if (tokens.length < 8) return '';
            try {
                return tokens.map((token) => String.fromCharCode(Number(token))).join('');
            } catch (_) {
                return '';
            }
        }

        function extractPlayableFromRedirectPayload(rawText) {
            const decoded = decodeNumericCharcodeString(rawText);
            if (!decoded) return '';
            const playable = extractFirstPlayableUrlFromText(decoded);
            if (playable) return playable;
            try {
                const apiOrigin = activeApiBase.split('/meta/tmdb')[0];
                const match = decoded.match(/\/utils\/proxy\?url=([^\s"']+)/i);
                if (!match?.[1]) return '';
                return `${apiOrigin}/utils/proxy?url=${match[1]}`;
            } catch (_) {
                return '';
            }
        }

        async function normalizeProviderSources(provider, rows, fallbackReferer = '') {
            if (!Array.isArray(rows) || !rows.length) return [];
            return rows;
        }
        let preferredSourceLabelMatch = PARAMS_BOOT.get('audio') || null; // Persistence for Sub/Dub preference
        if (preferredSourceLabelMatch && !['subbed', 'dubbed'].includes(preferredSourceLabelMatch.toLowerCase())) {
            // If we have a custom token but not sub/dub, it's probably an HLS track pref
            // We'll keep it as is.
        }
        console.log('API source:', effectiveApiSource, 'API_BASE set to:', API_BASE);

        function withApiBase(url, base = activeApiBase) {
            return String(url || '').replace(API_BASE, base);
        }

        async function fetchJsonWithApiFallback(url, options = {}) {
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const hasCallerSignal = !!options?.signal;
            const perFetchTimeout = options?.timeoutMs;
            const retryBaseDelayMs = (hasCallerSignal || perFetchTimeout) ? 0 : 250;
            const isWatchRequest = /\/(?:meta\/tmdb\/watch|movies\/[a-z0-9_-]+\/watch)(?:\?|$)/i.test(String(url || ''));
            const allowCrossBaseFallback = /\/meta\/tmdb(?:\/|$)/i.test(String(url || '')) && !isWatchRequest;
            const preferredBase = String(API_BASE_CANDIDATES?.[0] || activeApiBase || API_BASE || '').trim();
            const requestBases = allowCrossBaseFallback
                ? API_BASE_CANDIDATES
                : (preferredBase ? [preferredBase] : [activeApiBase]).filter(Boolean);
            const shouldRetryStatus = (status) =>
                status === 429 ||
                status >= 500 ||
                (allowCrossBaseFallback && status === 404);
            const isRetriableError = (err) => {
                const msg = String(err?.message || err || '').toLowerCase();
                return (
                    msg.includes('failed to fetch') ||
                    msg.includes('networkerror') ||
                    msg.includes('load failed') ||
                    msg.includes('timed out') ||
                    msg.includes('timeout') ||
                    msg.includes('aborted')
                );
            };
            const attemptFetch = async (base, attempts = 2) => {
                let lastErr = null;
                const maxAttempts = (hasCallerSignal || perFetchTimeout) ? 1 : attempts;
                for (let i = 0; i < maxAttempts; i += 1) {
                    const reqUrl = withApiBase(url, base);
                    
                    const fetchOpts = { ...options };
                    let abortController = null;
                    let abortTimer = null;
                    if (perFetchTimeout && !hasCallerSignal) {
                        try {
                            if (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) {
                                fetchOpts.signal = AbortSignal.timeout(perFetchTimeout);
                            } else if (typeof AbortController !== 'undefined') {
                                abortController = new AbortController();
                                fetchOpts.signal = abortController.signal;
                                abortTimer = setTimeout(() => abortController.abort(), perFetchTimeout);
                            }
                        } catch (e) {}
                        delete fetchOpts.timeoutMs;
                    }

                    try {
                        const res = await fetch(reqUrl, fetchOpts);
                        if (abortTimer) clearTimeout(abortTimer);
                        if (shouldRetryStatus(res.status) && i < maxAttempts - 1) {
                            await sleep(retryBaseDelayMs + i * 350);
                            continue;
                        }
                        if (res.ok) {
                            activeApiBase = base; // Persist successful base
                        }
                        return { res, usedBase: base };
                    } catch (err) {
                        if (abortTimer) clearTimeout(abortTimer);
                        lastErr = err;
                        if (isRetriableError(err) && i < maxAttempts - 1) {
                            await sleep(retryBaseDelayMs + i * 350);
                            continue;
                        }
                        throw err;
                    }
                }
                throw lastErr || new Error('Request failed');
            };

            let lastErr = null;
            for (const candidate of requestBases) {
                try {
                    const result = await attemptFetch(candidate, 2);
                    if (!allowCrossBaseFallback && !result.res.ok) {
                        return result;
                    }
                    // If result is 500/404/etc, and it's NOT the last candidate, keep trying others
                    if (!result.res.ok && candidate !== requestBases[requestBases.length - 1]) {
                        console.warn(`API ${candidate} returned ${result.res.status}, trying next fallback...`);
                        continue;
                    }
                    return result;
                } catch (e) {
                    lastErr = e;
                    if (!allowCrossBaseFallback) throw e;
                    console.warn(`API ${candidate} failed completely, trying next fallback...`, e);
                }
            }
            throw lastErr || new Error('All API candidates failed');
        }

        function withApiBase(url, base = activeApiBase) {
            return String(url || '').replace(API_BASE, base);
        }

        // Provider pools - automatically selected based on anime detection
        // ANIME_PROVIDERS: Specialized anime providers (used exclusively for anime content)
        const ANIME_PROVIDERS = ['animesalt', 'satoru'];
        const ANIME_SUBTITLE_FALLBACK_PROVIDERS = ['animesalt'];
        
        // NOTE: MOVIE_PROVIDERS is legacy - replaced with intelligent anime detection
        // For non-anime content: FlixHQ first, then AnimeSalt fallback
        // For anime content: ANIME_PROVIDERS only (most reliable)
        const MOVIE_PROVIDERS = ['flixhq', 'animesalt'];

        const params = new URLSearchParams(location.search);
        const TMDB_ID = params.get('id');
        const rawType = (params.get('type') || 'movie').toLowerCase();
        const MEDIA_TYPE = (rawType === 'undefined' || !rawType) ? 'movie' : rawType;
        let FORCED_PROVIDER = params.get('provider') || '';
        const DIRECT_ONLY = (params.get('directOnly') || 'true').toLowerCase() !== 'false';
        const URL_SEASON = Number(params.get('season') || 0);
        const URL_SEASON_TITLE = String(params.get('seasonTitle') || '').trim();
        const URL_SEASON_KEY = String(params.get('seasonKey') || '').trim().toLowerCase();
        const URL_EPISODE = Number(params.get('episode') || params.get('ep') || 0);
        const URL_TIME = Number(params.get('t') || 0);
        const URL_DISABLE_RESUME = String(params.get('resume') || '').trim() === '0';
        const URL_AUDIO = String(params.get('audio') || '').trim().toLowerCase();

        function readContinueWatchingEntry(id, type) {
            try {
                const raw = localStorage.getItem('sv_continue_watching');
                if (!raw) return null;
                const items = JSON.parse(raw);
                if (!Array.isArray(items)) return null;
                const found = items.find((row) =>
                    String(row?.id || '') === String(id || '') &&
                    String(row?.type || '').toLowerCase() === String(type || '').toLowerCase()
                );
                return found || null;
            } catch (_) {

        const CONTINUE_ENTRY = readContinueWatchingEntry(TMDB_ID, MEDIA_TYPE);
        const RESUME_TIME_FALLBACK = Number(CONTINUE_ENTRY?.currentTime || 0);

        function estimateNetworkQuality() {

        function svCreateHlsInstance(startTime, isThumbnail = false, provider = '') {
            const mobileMain = IS_MOBILE_CLIENT && !isThumbnail;
            const prefersFastStart = mobileMain || IS_IOS;
            const isConstrained = !isThumbnail && estimateNetworkQuality();
            const isFlixHq = String(provider || '').toLowerCase().includes('flixhq');
            const isAnimeKai = String(provider || '').toLowerCase().includes('animekai');
            const isVega = String(provider || '').toLowerCase().includes('vegamovies');

            // Dynamic buffer sizing — keep buffers modest to avoid bufferFullError cascades
            // (oversized buffers fill up, HLS.js panics → stall loop)
            // Keep FlixHQ buffers modest. Large audio buffers can preserve decoder drift
            // after seeks/track refreshes, which sounds like robotic/distorted audio.
            const backBufferLength = isThumbnail ? 4 : (isVega ? 30 : (isFlixHq ? 8 : (isAnimeKai ? (mobileMain ? 6 : 10) : (mobileMain ? 8 : 12))));
            const maxBufferLength = isThumbnail ? 12 : (isVega ? 60 : (isFlixHq ? 18 : (isAnimeKai ? (mobileMain ? 10 : 16) : (mobileMain ? 14 : 20))));
            const maxMaxBufferLength = isThumbnail ? 24 : (isVega ? 120 : (isFlixHq ? 30 : (isAnimeKai ? (mobileMain ? 20 : 28) : (mobileMain ? 28 : 40))));
            const maxBufferSize = isThumbnail
                ? 6 * 1024 * 1024
                : (isVega ? 150 * 1000 * 1000 : (isFlixHq ? 36 * 1000 * 1000 : (isAnimeKai ? (mobileMain ? 14 * 1000 * 1000 : 22 * 1000 * 1000) : (mobileMain ? 16 * 1000 * 1000 : 28 * 1000 * 1000))));

            return new Hls({
                startPosition: startTime,
                enableWorker: !isThumbnail,
                lowLatencyMode: false,
                backBufferLength: backBufferLength,
                maxBufferLength: maxBufferLength,
                maxMaxBufferLength: maxMaxBufferLength,
                maxBufferSize: maxBufferSize,
                audioCodec: undefined,
                maxAudioFramesDrift: isThumbnail ? 2 : (isVega ? 4 : (isFlixHq ? 1 : 1)),
                maxBufferHole: isThumbnail ? 0.1 : (isVega ? 0.08 : (isAnimeKai ? 0.6 : 0.3)),

            lastRequestedPlaybackTarget = clampedTarget;

            // ENHANCED: Do not arbitrarily trigger full hot-reloads on normal skips,
            // as this can lead to unwarranted full pipeline rebuilds that stall the player.

            // ENHANCED: Faster burst seeking - reduced cooldown
            if (now < jumpCooldownUntil && seekBurstCount >= 8) {
                schedulePendingJump(clampedTarget, reason);
                return;
            }

            // FlixHQ can produce distorted audio if we spam seek nudges too quickly.
            // During dense seek bursts, do a clean same-source rebuild at the target.
            if (isFlixHq && !isSourceSwitching && now >= jumpInFlightUntil && seekBurstCount >= 10 && (now - lastSeekBurstRebuildAt) > 3200) {
                lastSeekBurstRebuildAt = now;
                performHotReloadJump(clampedTarget, 'seek_burst');
                return;
            }

            jumpCooldownUntil = now + 80; // ENHANCED: Much faster repeat seeking
            jumpInFlightUntil = now + 600; // ENHANCED: Faster flight window
            if (jumpRecoveryTimer) {
                clearTimeout(jumpRecoveryTimer);
                jumpRecoveryTimer = null;
            }

            // ENHANCED: More aggressive HLS tuning for better responsiveness
            if (reason === 'skip' || jumpDistance > 20) {
                tuneHlsForJump(clampedTarget, jumpDistance, reason);
            } else if (jumpDistance > 5) {
                tuneHlsForJump(clampedTarget, jumpDistance, reason);
            }
            forceVideoSeek(clampedTarget);
            pendingJumpTarget = null;
        }

        function performHotReloadJump(targetTime, reason = 'seek') {
            if (!video || !currentStreamUrl || !hlsInst) return false;

            const clampedTarget = Math.max(0, Number(targetTime || 0));
            pendingJumpTarget = { time: clampedTarget, reason };
            lastRequestedPlaybackTarget = clampedTarget;
            jumpCooldownUntil = Date.now() + 1200;
            jumpInFlightUntil = Date.now() + 2200;
            if (reason !== 'skip') showBufferingOverlay();
            setTemporaryRecoveryQuality(reason === 'skip' ? 6500 : 5000);

            svSwitchHlsSourceSilent(currentStreamUrl, currentStreamReferer, () => {
                hlsFragErrorBurst = 0;
                hlsSessionIsFragile = false;
                setTemporaryRecoveryQuality(reason === 'skip' ? 6500 : 5000);
                if (pendingJumpTarget && video) {
                    const next = pendingJumpTarget;
                    pendingJumpTarget = null;
                    forceVideoSeek(next.time);
                    if (!video.paused) {
                        Promise.resolve(video.play()).catch(() => { });
                    }
                }
            }, clampedTarget, true);
            return true;
        }

        function performResponsiveSeek(percent) {
            if (!video || !isFinite(video.duration)) return;
            const clamped = Math.max(0, Math.min(100, Number(percent || 0)));
            const targetTime = (clamped / 100) * video.duration;
            lastUserSeekAt = Date.now();

            maybeShowSeekBufferingOverlay(260);
            applyGuardedJump(targetTime, 'seek');
        }

        function requestSeekToTime(targetTime, keepPlaying = true) {
            if (!video || !isFinite(video.duration)) return;
            const clampedTime = Math.max(0, Math.min(video.duration, Number(targetTime || 0)));
            queuedSeekTime = clampedTime;
            lastRequestedPlaybackTarget = clampedTime;

            if (seekApplyTimer) clearTimeout(seekApplyTimer);
            const now = Date.now();
            if (now - seekBurstWindowStart > 2000) {
                seekBurstWindowStart = now;
                seekBurstCount = 0;
            }
            seekBurstCount += 1;
            if (seekBurstCount >= 6) rapidSeekModeUntil = now + 9000;
            const elapsed = now - lastAppliedSeekAt;
            const isFlixHq = isCurrentFlixHqStream();
            const minGap = isFlixHq
                ? (seekBurstCount >= 8 ? 170 : 90)
                : (seekBurstCount >= 8 ? 100 : 40);
            const delay = elapsed >= minGap ? 0 : (minGap - elapsed);

            seekApplyTimer = setTimeout(() => {
                if (!video || !isFinite(video.duration) || queuedSeekTime == null) return;
                const wasPaused = video.paused;
                const pct = (queuedSeekTime / Math.max(0.001, video.duration)) * 100;
                performResponsiveSeek(pct);
                lastAppliedSeekAt = Date.now();
                queuedSeekTime = null;
                if (keepPlaying && !wasPaused) {
                    Promise.resolve(video.play()).catch(() => { });
                }
            }, delay);
        }

        // Keep audio track changes lightweight. Aggressive SourceBuffer removals can corrupt decoding.
        function flushAudioBufferForTrackSwitch(hls) {
            if (!hls || !video) return;
            try {
                const currentTime = video.currentTime;
                setTimeout(() => {
                    if (hls) {
                        try {
                            hls.stopLoad();
                            hls.startLoad(Math.max(0, currentTime - 0.35));
                        } catch (_) { }
                    }
                }, 120);
            } catch (_) { }
        }

        function svApplyPreferredAudioToHls(hls) {
            let tracks = [];
            let isNative = false;

            if (hls && Array.isArray(hls.audioTracks) && hls.audioTracks.length > 0) {
                tracks = hls.audioTracks;
            } else if (!hls && video && video.audioTracks && video.audioTracks.length > 0) {
                tracks = Array.from(video.audioTracks);
                isNative = true;
            }

            if (tracks.length === 0) return;

            // Vegamovies sources already ship with the intended audio; forcing a
            // generic preference here can lock the player onto the wrong track.
            if (isVegamoviesPlaybackProvider()) return;

            const activeSourceProvider = String(allSources?.[currentIdx]?.provider || '').toLowerCase();
            const isFlixHqAudio = activeSourceProvider === 'flixhq';
            const hasExplicitAudioPreference = Boolean(String(URL_AUDIO || preferredAudioToken || preferredSourceLabelMatch || '').trim());
            if (isFlixHqAudio && !hasExplicitAudioPreference) {
                return;
            }
            const shouldForceOriginalTrack =
                currentAudioSource !== 'satoru' &&
                activeSourceProvider === 'justanime';

            // Normalize our current preference
            let searchToken = (preferredAudioToken || '').toLowerCase();
            // Strip common suffixes that might pollute the token
            searchToken = searchToken.replace(/\s*\(.*?\)\s*/g, '').trim();
            const normPref = normalizeAudioToken(searchToken);

            let targetIdx = -1;

            if (normPref && !shouldForceOriginalTrack) {
                // 1. Try exact normalized match
                targetIdx = tracks.findIndex(t => {
                    return getTrackAudioTokens(t).some(tok => normalizeAudioToken(tok) === normPref);
                });

                // 2. Try substring match (e.g. "hindi" in "Hindi - Multi")
                if (targetIdx === -1) {
                    targetIdx = tracks.findIndex(t => {
                        return getTrackAudioTokens(t).some(tok => {
                            const nt = normalizeAudioToken(tok);
                            return nt.includes(normPref) || normPref.includes(nt);
                        });
                    });
                }
            }

            // 3. Fallback: Japanese (common for anime)
            if (targetIdx === -1) {
                targetIdx = tracks.findIndex(t => {
                    const l = String(t?.lang || t?.language || '').toLowerCase();
                    const n = String(t?.name || t?.label || '').toLowerCase();
                    return l === 'ja' || l === 'jpn' || n.includes('japanese') || n.includes('nihongo') || n.includes('jp');
                });
            }

            // 4. Fallback: Default or first track
            if (targetIdx === -1) {
                const def = tracks.findIndex(t => isNative ? t.enabled : t.default);
                targetIdx = def !== -1 ? def : 0;
            }

            if (targetIdx !== -1) {
                try {
                    if (isNative) {
                        if (!tracks[targetIdx].enabled) {
                            tracks.forEach((t, i) => { t.enabled = (i === targetIdx); });
                            
                            // Safari iOS hack: force native audio track to apply
                            if (typeof IS_IOS !== 'undefined' && IS_IOS && typeof video !== 'undefined' && video && video.readyState >= 1) {
                                video.currentTime = video.currentTime + 0.0001;
                            }
                            
                            const sel = tracks[targetIdx];
                            console.log(`[native-audio] Successfully auto-switched to index ${targetIdx} (${sel.label || sel.language})`);
                        }
                    } else if (hls.audioTrack !== targetIdx) {
                        // ENHANCED: Smooth buffer flushing before track switch
                        flushAudioBufferForTrackSwitch(hls);
                        hls.audioTrack = targetIdx;
                        const sel = tracks[targetIdx];
                        console.log(`[hls-audio] Successfully auto-switched to index ${targetIdx} (${sel.name || sel.lang})`);
                    }
                } catch (e) {
                    console.warn('[audio-switch] Failed to switch track:', e);
                }
            }
        }

        function svAttachHlsListeners(hls, startTime, onParsedAction, onErrorFallback) {
            let fatalRecoveryTimer = null;
            let fragParseBurstCount = 0;
            let fragParseBurstStartAt = 0;
            let lastFragBypassAt = 0;
            const clearFatalRecoveryTimer = () => {
                if (fatalRecoveryTimer) {
                    clearTimeout(fatalRecoveryTimer);
                    fatalRecoveryTimer = null;
                }
            };
            const armFatalRecoveryTimer = () => {
                clearFatalRecoveryTimer();
                const t0 = Number(video?.currentTime || 0);
                fatalRecoveryTimer = setTimeout(() => {
                    if (!video) return;
                    // If playback time is not progressing after recovery attempts, force fallback.
                    const t1 = Number(video.currentTime || 0);
                    const progressed = Math.abs(t1 - t0) > 0.25;
                    if (!progressed && video.readyState < 3) {
                        console.warn('[hls] Recovery timed out after fatal media error, forcing same-source recovery.');
                        if (typeof onErrorFallback === 'function') onErrorFallback('fatal_media_timeout');
                    }
                }, 6500);
            };

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                console.log('MANIFEST_PARSED - audio tracks:', hls.audioTracks?.length || 0);
                hlsFragErrorBurst = 0;
                hlsSessionIsFragile = false;
                nonFatalLevelErrorCount = 0;
                if (startTime > 0 && video) video.currentTime = startTime;
                svApplyPreferredAudioToHls(hls);
                if (onParsedAction) onParsedAction();
                updateAudioTracks();
                hideBufferingOverlaySoon(40); // ENHANCED: Faster hiding
                clearFatalRecoveryTimer();
            });

            hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, () => {
                console.log('AUDIO_TRACKS_UPDATED');
                svApplyPreferredAudioToHls(hls);
                updateAudioTracks();
            });

            hls.on(Hls.Events.AUDIO_TRACK_SWITCHED, () => {
                const tracks = hls.audioTracks || [];
                const sel = tracks[hls.audioTrack];
                if (sel) rememberAudioPreference(sel);
                updateAudioTracks();
            });

            hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, () => {
                try {
                    const tracks = hls.subtitleTracks || [];
                    if (tracks.length && hls.subtitleTrack === -1) {
                        const preferred = tracks.find((t) => /en|eng|english/i.test(String(t?.lang || '') + ' ' + String(t?.name || '')));
                        hls.subtitleTrack = (preferred || tracks[0]).id;
                    }
                    setTimeout(() => {
                        updateCaptionsButtonVisibility();
                        buildCaptionsMenu();
                    }, 100);
                } catch (_) { }
            });

            // ENHANCED: Track bandwidth for adaptive quality
            hls.on(Hls.Events.fpsDropLevelCapping, () => {
                if (hls && hls.levels && hls.firstLevel !== -1) {
                    console.log('[hls] Quality reduced due to FPS drop');
                }
            });

            // Track media error state for better recovery
            let mediaErrorCount = 0;
            let nonFatalLevelErrorCount = 0;
            let lastStallNudgeAt = 0;
            let repeatedStallErrorCount = 0;
            let consecutiveBufferErrors = 0;
            let consecutiveFragErrors = 0;
            let lastAudioPipelineResetAt = 0;
            let lastBufferFlushAt = 0;
            let flixhqGlitchCount = 0;
            let flixhqGlitchWindowStartAt = 0;
            const markFlixhqAudioGlitch = (weight = 1) => {
                const now = Date.now();
                if (now - flixhqGlitchWindowStartAt > 10000) {
                    flixhqGlitchWindowStartAt = now;
                    flixhqGlitchCount = 0;
                }
                flixhqGlitchCount += weight;
                return flixhqGlitchCount >= 2;
            };
            const getBufferedAheadSeconds = () => {
                if (!video || !video.buffered || video.buffered.length === 0) return 0;
                const t = Number(video.currentTime || 0);
                for (let i = 0; i < video.buffered.length; i++) {
                    const s = Number(video.buffered.start(i));
                    const e = Number(video.buffered.end(i));
                    if (t >= s && t <= e) return Math.max(0, e - t);
                }
                return 0;
            };
            const applyAdaptiveLevelCap = () => {
                if (!hls || !Array.isArray(hls.levels) || hls.levels.length < 2) return;
                const levelsCount = hls.levels.length;
                const lowestSafeCap = Math.max(0, levelsCount - 2);
                if (isBandwidthConstrained) {
                    if (hls.autoLevelCapping !== lowestSafeCap) {
                        hls.autoLevelCapping = lowestSafeCap;
                    }
                } else if (hls.autoLevelCapping !== -1) {
                    hls.autoLevelCapping = -1;
                }
            };

            hls.on(Hls.Events.FRAG_LOADED, (_, data) => {
                const bw = Number(data?.stats?.bwEstimate || 0);
                if (!Number.isFinite(bw) || bw <= 0) return;
                bandwidthSampleCount += 1;
                if (lastEstimatedBandwidth <= 0) {
                    lastEstimatedBandwidth = bw;
                } else {
                    // Smooth estimate to avoid rapid up/down capping churn.
                    lastEstimatedBandwidth = (lastEstimatedBandwidth * 0.75) + (bw * 0.25);
                }
                const constrainedThreshold = IS_MOBILE_CLIENT ? 2000000 : 3200000;
                const releaseThreshold = IS_MOBILE_CLIENT ? 3300000 : 5000000;
                if (lastEstimatedBandwidth > 0 && lastEstimatedBandwidth < constrainedThreshold) {
                    isBandwidthConstrained = true;
                } else if (lastEstimatedBandwidth > releaseThreshold) {
                    isBandwidthConstrained = false;
                }
                applyAdaptiveLevelCap();

                // Decay glitch score when fresh fragments arrive cleanly.
                if (isCurrentFlixHqStream() && flixhqGlitchCount > 0) {
                    flixhqGlitchCount = Math.max(0, flixhqGlitchCount - 1);
                }
            });

            hls.on(Hls.Events.ERROR, function (_, d) {
                console.log('HLS Error:', d.type, d.details, 'fatal:', d.fatal);
                const detailText = String(d?.details || '').toLowerCase();
                const isFragParsing = detailText.includes('fragparsingerror') || d?.details === Hls.ErrorDetails.FRAG_PARSING_ERROR;
                const isBufferAppend =
                    detailText.includes('bufferappend') ||
                    d?.details === Hls.ErrorDetails.BUFFER_APPEND_ERROR ||
                    d?.details === Hls.ErrorDetails.BUFFER_APPENDING_ERROR;
                const isBufferFull = d?.details === Hls.ErrorDetails.BUFFER_FULL_ERROR;
                const isFragLoad = detailText.includes('fragloaderror') || d?.details === Hls.ErrorDetails.FRAG_LOAD_ERROR;
                const isLevelLoad = detailText.includes('levelloadtimeout') || detailText.includes('levelloadererror') || d?.details === Hls.ErrorDetails.LEVEL_LOAD_ERROR || d?.details === Hls.ErrorDetails.LEVEL_LOAD_TIMEOUT;
                const isManifestParsing = detailText.includes('manifestparsingerror') || d?.details === Hls.ErrorDetails.MANIFEST_PARSING_ERROR;
                const isFlixHqStream = isCurrentFlixHqStream();
                const isAudioPipelineIssue =
                    detailText.includes('audio') ||
                    d?.details === Hls.ErrorDetails.AUDIO_TRACK_LOAD_ERROR ||
                    d?.details === Hls.ErrorDetails.AUDIO_TRACK_LOAD_TIMEOUT ||
                    d?.details === Hls.ErrorDetails.AUDIO_TRACK_PARSING_ERROR ||
                    d?.details === Hls.ErrorDetails.BUFFER_INCOMPATIBLE_CODECS_ERROR;
                const inRapidSeekMode = Date.now() < rapidSeekModeUntil || (Date.now() - lastUserSeekAt) < 8000;

                if (isAudioPipelineIssue) {
                    if (isFlixHqStream && !inRapidSeekMode) {
                        const shouldEscalate = markFlixhqAudioGlitch(2);
                        if (shouldEscalate && typeof onErrorFallback === 'function') {
                            console.warn('[hls] FlixHQ audio glitch guard triggered, escalating failover.');
                            onErrorFallback('audio_corruption_guard');
                            return;
                        }
                    }

                    const now = Date.now();
                    if (now - lastAudioPipelineResetAt > 5000) {
                        lastAudioPipelineResetAt = now;
                        console.warn('[hls] Audio pipeline issue detected, resetting media pipeline near current position...');
                        showBufferingOverlay();
                        try {
                            const t = Math.max(0, Number(video?.currentTime || 0) - 0.35);
                            hls.stopLoad();
                            hls.startLoad(t);
                            hls.recoverMediaError();
                            armFatalRecoveryTimer();
                        } catch (_) { }
                        return;
                    }
                }

                // ── bufferFullError: flush stale back-buffer instead of spiralling ──
                if (isBufferFull && !d.fatal) {
                    consecutiveBufferErrors++;
                    const now = Date.now();
                    if (now - lastBufferFlushAt > 1500) {
                        lastBufferFlushAt = now;
                        console.warn('[hls] bufferFullError – flushing back-buffer and reducing quality');
                        try {
                            // Drop to lowest quality so new fragments are tiny
                            if (hls.levels && hls.levels.length > 1) {
                                hls.autoLevelCapping = 0;
                                hls.nextLevel = 0;
                                hls.loadLevel = 0;
                                setTimeout(() => {
                                    try { hls.autoLevelCapping = -1; hls.nextLevel = -1; } catch (_) { }
                                }, 3000);
                            }
                            hls.stopLoad();
                            hls.startLoad(video ? Math.max(0, video.currentTime - 0.5) : 0);
                        } catch (_) { }
                    }
                    if (consecutiveBufferErrors >= 5 && typeof onErrorFallback === 'function') {
                        consecutiveBufferErrors = 0;
                        onErrorFallback('buffer_full_unrecoverable');
                    }
                    return;
                } else if (!isBufferFull) {
                    consecutiveBufferErrors = 0;
                }

                // Auto-resume playback on non-fatal errors
                if (!d.fatal && video && video.paused && !isSourceSwitching) {
                    setTimeout(() => {
                        if (video && video.paused && !isSourceSwitching) {
                            video.play().catch(() => {
                                video.muted = true;
                                video.play().catch(() => { });
                            });
                        }
                    }, 80);
                }

                if (isFragParsing && !d.fatal) {
                    if (isFlixHqStream && !inRapidSeekMode && (Date.now() - lastUserSeekAt) > 2500) {
                        const shouldEscalate = markFlixhqAudioGlitch(1);
                        if (shouldEscalate && typeof onErrorFallback === 'function') {
                            console.warn('[hls] FlixHQ frag parse burst indicates probable audio corruption, escalating failover.');
                            onErrorFallback('audio_corruption_guard');
                            return;
                        }
                    }

                    hlsFragErrorBurst += 1;
                    fragParseBurstCount += 1;
                    const now = Date.now();
                    if (now - fragParseBurstStartAt > 4000) {
                        fragParseBurstStartAt = now;
                        fragParseBurstCount = 1;
                    }
                    
                    if (hlsFragErrorBurst >= 3) hlsSessionIsFragile = true;

                    // ENHANCED: Only escalate to full rebuild for excessive rapid bursts, allowing normal scrubbing.
                    if (fragParseBurstCount > 8) {
                        console.warn('[hls] Excessive frag parsing errors, triggering full rebuild.');
                        if (typeof onErrorFallback === 'function') {
                            onErrorFallback('watchdog_stall');
                            return;
                        }
                    }

                    if (video && hls) {
                        // Very subtle jump to bypass corrupted TS frames.
                        // We do not want to jump 5 seconds, as that ruins user experience.
                        const jumpDistance = Math.min(1.5, Math.max(0.3, hlsFragErrorBurst * 0.25));
                        
                        // BUT if the user just manually seeked within the last 1.5 seconds,
                        // this error is likely a transient fetch truncation, not a real TS corruption.
                        // We shouldn't jump them forward arbitrarily.
                        if (now - lastUserSeekAt < 1500) {
                            return; // Let HLS.js naturally discard the truncated skip-driven chunk
                        }

                        const targetTime = Math.max(0, Math.min((video.duration || Infinity) - 0.1,
                            (video.currentTime || 0) + jumpDistance));
                        
                        if (isFinite(targetTime) && targetTime > 0 && (now - lastFragBypassAt > 800)) {
                            lastFragBypassAt = now;
                            console.log(`[hls] fragParsingError bypass: jumping ${jumpDistance.toFixed(2)}s to ${targetTime.toFixed(2)}`);
                            try { 
                                hls.stopLoad(); 
                                video.currentTime = targetTime;
                                hls.startLoad(Math.max(0, targetTime - 0.1)); 
                            } catch (_) { }
                        }
                    }
                    return; // Handled
                }

                // Auto-resume playback on non-fatal errors
                if (!d.fatal && video && video.paused && !isSourceSwitching) {
                    setTimeout(() => {
                        if (video && video.paused && !isSourceSwitching) {
                            video.play().catch(() => {
                                video.muted = true;
                                video.play().catch(() => { });
                            });
                        }
                    }, 80);
                }

                if (!d.fatal) {
                    if (inRapidSeekMode && (isFragParsing || isBufferAppend)) {
                        // handled above for fragParsing
                        if (!isFragParsing) {
                            showBufferingOverlay();
                            try {
                                const jump = 0.6;
                                const near = Math.max(0, Math.min((video.duration || Infinity) - 0.2, (video.currentTime || 0) + jump));
                                if (isFinite(near) && near > 0) video.currentTime = near;
                                setTemporaryRecoveryQuality(5000);
                                tuneHlsForJump(near, jump, 'seek');
                                if (isFlixHqStream) {
                                    hls.stopLoad();
                                    hls.startLoad(Math.max(0, near - 0.2));
                                } else {
                                    hls.recoverMediaError();
                                }
                            } catch (_) { }
                        }
                        return;
                    }

                    if (
                        d.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR ||
                        d.details === Hls.ErrorDetails.BUFFER_NUDGE_ON_STALL
                    ) {
                            repeatedStallErrorCount++;
                            const now = Date.now();
                            if (now - lastStallNudgeAt < 800) return;
                            lastStallNudgeAt = now;
                            if (video && !video.paused && video.readyState >= 2) {
                                try {
                                    showBufferingOverlay();
                                    video.currentTime = Math.min(
                                        (video.duration || Infinity) - 0.05,
                                        (video.currentTime || 0) + (IS_MOBILE_CLIENT ? 0.1 : 0.2),
                                    );
                                    kickHlsLoadNearCurrentTime(video.currentTime, true);
                                    Promise.resolve(video.play()).catch(() => { });
                                } catch (_) { }
                            }
                            if (repeatedStallErrorCount >= 4 && typeof onErrorFallback === 'function') {
                                console.warn('[hls] Repeated buffer stall errors, escalating to source recovery');
                                repeatedStallErrorCount = 0;
                                onErrorFallback('buffer_stall_repeated');
                                return;
                            }
                        }
                        if (isBufferAppend) {
                            consecutiveBufferErrors++;
                            if (consecutiveBufferErrors > 2) {
                                console.warn('[hls] Multiple buffer append errors, triggering recovery');
                                setTemporaryRecoveryQuality(4500);
                            }
                        } else if (!isBufferFull) {
                            consecutiveBufferErrors = 0;
                        }
                        if (!isFragLoad && !isLevelLoad && !isBufferAppend && !isBufferFull && !detailText.includes('stalled')) {
                            repeatedStallErrorCount = 0;
                        }
                        if (!isFragParsing && !isBufferAppend) hlsFragErrorBurst = 0;
                    }

                // ── Fatal fragLoadError / levelLoadError: rebuild HLS in-place ──
                // (This is the main cause of black-screen — proxy refused = fatal frag load)
                if (d.fatal && (isFragLoad || isLevelLoad)) {
                    consecutiveFragErrors++;
                    console.warn(`[hls] Fatal ${d.details} (attempt ${consecutiveFragErrors}), rebuilding HLS in-place...`);
                    showBufferingOverlay();
                    if (consecutiveFragErrors <= 3 && typeof onErrorFallback === 'function') {
                        const recoveryTarget = pendingJumpTarget?.time ?? Number(video?.currentTime || 0);
                        pendingJumpTarget = { time: recoveryTarget, reason: 'seek' };
                        onErrorFallback('watchdog_stall'); // triggers recoverSameSource with in-place rebuild
                    } else if (consecutiveFragErrors > 3 && typeof onErrorFallback === 'function') {
                        onErrorFallback('fatal_network_error');
                    } else {
                        // last-ditch: just restart loading
                        setTimeout(() => { try { if (hls) hls.startLoad(); } catch (_) { } }, 500);
                    }
                    return;
                }
                if (!d.fatal && (isFragLoad || isLevelLoad)) {
                    nonFatalLevelErrorCount += 1;
                    if (nonFatalLevelErrorCount >= 4 && typeof onErrorFallback === 'function') {
                        console.warn('[hls] repeated non-fatal level/frag load timeouts, escalating fallback');
                        nonFatalLevelErrorCount = 0;
                        onErrorFallback('level_timeout_repeated');
                        return;
                    }
                    // Non-fatal: let HLS.js retry itself, just kick loading
                    setTimeout(() => { try { if (hls) hls.startLoad(); } catch (_) { } }, 200);
                    return;
                }
                if (d.fatal && !isFragLoad && !isLevelLoad && !isFragParsing) {
                    consecutiveFragErrors = 0;
                }

                // ── Fatal media / other errors ──
                if (d.fatal) {
                    if (isManifestParsing && typeof onErrorFallback === 'function') {
                        console.warn('[hls] Fatal manifest parsing error, requesting source fallback.');
                        onErrorFallback('fatal_manifest_parse');
                        return;
                    }
                    if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        const code = d.response ? d.response.code : 0;
                        if (code === 404 || code === 403 || code >= 500) {

                    } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {

                        const recentlySeeked = (Date.now() - lastUserSeekAt) < 6000;
                        const preferredRecoveryTarget = pendingJumpTarget?.time ?? Number(video?.currentTime || 0);

                            }
                            if (isFlixHqStream && typeof onErrorFallback === 'function') {

                                if (isFragParsing && typeof onErrorFallback === 'function') {

                                clearFatalRecoveryTimer();
                                onErrorFallback('fatal_frag_parse_jump');

            // Stall watchdog — checks every 2.5s, escalates after 3 consecutive stalls (~7.5s total)
