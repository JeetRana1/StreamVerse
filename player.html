        function svSwitchHlsSourceSilent(url, referer, onReady, explicitTargetTime = null, forceRebuild = false, sourceIdx = currentIdx) {
            if (!video) return;
            const savedTime = video.currentTime;
            const targetTime = Math.max(0, Number(
                explicitTargetTime ?? pendingJumpTarget?.time ?? lastRequestedPlaybackTarget ?? savedTime ?? 0
            ));
            const wasPlaying = !video.paused;
            let escalatedToHardReload = false;

            const forceRecoveredPlay = () => {
                if (!video) return;
                isSourceSwitching = false;
                setPlayIcon(true);
                Promise.resolve(video.play()).catch(() => { });
            };

            captureVideoFrameToOverlay();

            // ENHANCED: Check if we're switching to the same provider for audio track switching
            // Do not reuse if we are forcing a full rebuild (e.g., recovering from fatal pipeline crash)
            const isAudioTrackSwitch = !forceRebuild && url === currentStreamUrl && referer === currentStreamReferer;

            if (hlsInst && !isAudioTrackSwitch) {
                try {
                    hlsInst.stopLoad();
                    hlsInst.detachMedia();
                    hlsInst.destroy();
                } catch (_) { }
                hlsInst = null;
                clearVideoMediaSource();
            }

            // ENHANCED: For audio track switching, reuse HLS instance if possible
            if (isAudioTrackSwitch && hlsInst) {
                console.log('Seamless audio track switch detected, reusing HLS instance');
                hlsInst.loadSource(proxiedStreamUrl(url, referer));
                try {
                    hlsInst.startLoad(Math.max(0, targetTime - 0.8));
                } catch (_) { }
            } else {
                hlsInst = svCreateHlsInstance(targetTime, false, currentStreamProvider);
                svAttachHlsListeners(hlsInst, targetTime, onReady);
                hlsInst.loadSource(proxiedStreamUrl(url, referer));
                hlsInst.attachMedia(video);
                try {
                    hlsInst.startLoad(Math.max(0, targetTime - 0.8));
                } catch (_) { }
            }

            let lastTime = -1;
            const cleanup = () => {
                if (video && video.currentTime !== lastTime && video.currentTime > 0) {
                    isSourceSwitching = false;
                    hideTransitionOverlay();
                    video.removeEventListener('timeupdate', cleanup);
                    video.removeEventListener('playing', cleanup);
                }
                if (video) lastTime = video.currentTime;
            };
            const resumeRecoveredPlayback = () => {
                if (!video) return;
                isSourceSwitching = false;
                forceVideoSeek(targetTime);
                hideBufferingOverlaySoon(60);
                if (wasPlaying || video.paused) {
                    forceRecoveredPlay();
                }
                video.removeEventListener('canplay', resumeRecoveredPlayback);
                video.removeEventListener('playing', resumeRecoveredPlayback);
            };
            video.addEventListener('canplay', resumeRecoveredPlayback);
            video.addEventListener('playing', resumeRecoveredPlayback);
            video.addEventListener('playing', cleanup);
            video.addEventListener('timeupdate', cleanup);
            setTimeout(() => {
                if (!video) return;
                if (Math.abs((video.currentTime || 0) - targetTime) > 1.0 || video.readyState < 2) {
                    resumeRecoveredPlayback();
                    try {
                        hlsInst && hlsInst.startLoad(Math.max(0, targetTime - 0.8));
                    } catch (_) { }
                }
            }, 900);
            setTimeout(() => {
                if (!video) return;
                if (video.paused || video.readyState < 3) {
                    forceVideoSeek(targetTime);
                    forceRecoveredPlay();
                    hideBufferingOverlaySoon(40);
                }
            }, 1400);
            setTimeout(() => {
                if (!video || escalatedToHardReload) return;
                if (currentIdx !== sourceIdx) return;
                if (Date.now() < audioSwitchInFlightUntil) return;
                const stillBroken = !isFinite(video.duration) || video.duration <= 0 || (video.readyState < 2 && Math.abs(video.currentTime || 0) < 0.5);
                if (stillBroken) {
                    escalatedToHardReload = true;
                    console.warn('[hls] Silent recovery still unhealthy, escalating to hard reload at target time.');
                    pendingJumpTarget = { time: targetTime, reason: pendingJumpTarget?.reason || 'seek' };
                    loadStream(url, true, false, referer, sourceIdx, targetTime);
                }
            }, 2200);
            setTimeout(hideTransitionOverlay, 8000);

            if (wasPlaying) {
                forceRecoveredPlay();
            }
        }

        function getInitialTvPositionFromUrl(seasons) {
            const safeSeasons = Array.isArray(seasons) ? seasons : [];
            const currentParams = new URLSearchParams(location.search);
            const currentSeason = Number(currentParams.get('season') || 0);
            const currentEpisode = Number(currentParams.get('episode') || currentParams.get('ep') || 0);
            const rawSeasonTitle = String(currentParams.get('seasonTitle') || '').trim();
            const seasonZeroExplicit = currentParams.has('season') && Number(currentParams.get('season') || 0) === 0;
            const specialTitleHint = /^(specials?|ovas?|extras?|recaps?)$/i.test(rawSeasonTitle);
            const hasExplicitEpisodePosition =
                currentParams.has('season') ||
                currentParams.has('seasonKey') ||
                (currentParams.has('seasonTitle') && (!currentIsLikelyAnime || !specialTitleHint || seasonZeroExplicit)) ||
                (Number.isFinite(window.RESUME_SEASON_FALLBACK) && window.RESUME_SEASON_FALLBACK > 0);
            let si = hasExplicitEpisodePosition
                ? 0
                : Math.max(0, safeSeasons.findIndex((s) => Number(s?.seasonNo || 0) > 0));
            let ei = 0;
            let matchedExplicitSeasonRef = false;

            if (currentParams.get('seasonKey')) {
                const sKey = String(currentParams.get('seasonKey')).trim().toLowerCase();
                const bySeasonKey = safeSeasons.findIndex((s) =>
                    String(s?.providerAnimeId || '').trim().toLowerCase() === sKey
                );
                if (bySeasonKey >= 0) {
                    si = bySeasonKey;
                    matchedExplicitSeasonRef = true;
                }
            }
            if (currentParams.get('seasonTitle')) {
                const sTitle = rawSeasonTitle;
                if (currentIsLikelyAnime && specialTitleHint && !seasonZeroExplicit) {
                    matchedExplicitSeasonRef = false;
                } else {
                const wantedSeasonTitle = normalizeSeasonSearchLabel(sTitle).toLowerCase();
                const bySeasonTitle = safeSeasons.findIndex((s) =>
                    normalizeSeasonSearchLabel(String(s?.name || '')).toLowerCase() === wantedSeasonTitle
                );
                if (bySeasonTitle >= 0) {
                    si = bySeasonTitle;
                    matchedExplicitSeasonRef = true;
                }
                }
            }
            if (Number.isFinite(currentSeason) && currentSeason > 0 && !matchedExplicitSeasonRef) {
                const bySeasonNo = safeSeasons.findIndex((s) => {
                    return Number(s?.seasonNo || 0) === currentSeason;
                });
                if (bySeasonNo >= 0) {
                    si = bySeasonNo;
                } else {
                    // Use the requested season minus 1 as the index, even if it's beyond the safeSeasons length.
                    // This allows fetchSources to still derive the correct selectedSeasonNo.
                    si = currentSeason - 1;
                }
            } else if (Number.isFinite(window.RESUME_SEASON_FALLBACK) && window.RESUME_SEASON_FALLBACK > 0 && !matchedExplicitSeasonRef) {
                const byResumeSeasonNo = safeSeasons.findIndex((s) => Number(s?.seasonNo || 0) === window.RESUME_SEASON_FALLBACK);
                if (byResumeSeasonNo >= 0) {
                    si = byResumeSeasonNo;
                }
            }
            
            const eps = safeSeasons[si]?.episodes || [];
            if (Number.isFinite(currentEpisode) && currentEpisode > 0) {
                const byEpisodeNo = eps.findIndex((ep) => {
                    const n = Number(ep?.episode || ep?.number || ep?.episodeNum || 0);
                    return Number.isFinite(n) && n === currentEpisode;
                });
                if (byEpisodeNo >= 0) {
                    ei = byEpisodeNo;
                } else {
                    // Use requested episode minus 1 as index
                    ei = currentEpisode - 1;
                }
            } else if (Number.isFinite(window.RESUME_EPISODE_FALLBACK) && window.RESUME_EPISODE_FALLBACK > 0) {
                const byResumeEpisodeNo = eps.findIndex((ep) => {
                    const n = Number(ep?.episode || ep?.number || ep?.episodeNum || 0);
                    return Number.isFinite(n) && n === window.RESUME_EPISODE_FALLBACK;
                });
                if (byResumeEpisodeNo >= 0) {
                    ei = byResumeEpisodeNo;
                }
            }
            
            // Ensure indices are at least 0
            return { seasonIndex: Math.max(0, si), episodeIndex: Math.max(0, ei) };
        }

        function buildTvSeasonsFromInfo(info) {
            const rawSeasons = Array.isArray(info?.seasons) ? info.seasons : [];
            const rawProviderEpisodes = Array.isArray(info?.providerEpisodes) ? info.providerEpisodes : [];
            let rawEpisodes = Array.isArray(info?.episodes) ? info.episodes : rawProviderEpisodes;

            const mapSNo = (v, fallback = 1) => {
                const n = Number(v);
                return (Number.isFinite(n) && n >= 0) ? n : fallback;
            };

            // 1. Try to use TMDB's season structure as the skeleton
            if (rawSeasons.length > 0) {
                const buckets = rawSeasons.map((s, idx) => {
                    let sName = String(s?.name || `Season ${idx + 1}`);
                    if (currentIsLikelyAnime && /^season\s+\d+$/i.test(sName)) {
                        sName = sName.replace(/season/i, 'Part');
                    }
                    return {
                        seasonNo: mapSNo(s?.season || s?.seasonNumber || s?.season_number || s?.number, idx + 1),
                        name: sName,
                        episodes: Array.isArray(s?.episodes) ? [...s.episodes] : []
                    };
                });

                // If buckets exist but are empty (common in flat-list proxies), try to distribute rawEpisodes
                const epsAlreadyInBuckets = buckets.reduce((sum, b) => sum + b.episodes.length, 0);
                if (epsAlreadyInBuckets === 0 && rawEpisodes.length > 0) {
                    // Pre-calculate season boundaries if metadata has episode counts
                    let runningTotal = 0;
                    const boundaries = rawSeasons.map((s, i) => {
                        const count = Number(s?.episode_count || s?.episodeCount || 0);
                        const start = runningTotal + 1;
                        if (count > 0) runningTotal += count;
                        return { index: i, start, end: runningTotal, count };
                    });

                    rawEpisodes.forEach((ep) => {
                        const epAbsNum = Number(ep?.number || ep?.episode || ep?.episodeNum || 0);
                        const epSNo = mapSNo(ep?.season || ep?.seasonNumber || ep?.season_number || ep?.seasonNum, -1);

                        let bucket = null;

                        // Priority 1: If it's an anime with boundaries, trust boundaries OVER explicit season (often wrong in flat lists)
                        if (currentIsLikelyAnime && epAbsNum > 0 && boundaries.some(b => b.count > 0)) {
                            const b = boundaries.find(bound => epAbsNum >= bound.start && (bound.end === 0 || epAbsNum <= bound.end));
                            if (b) bucket = buckets[b.index];
                        }

                        // Priority 2: Explicit season number
                        if (!bucket && epSNo > 0) {
                            bucket = buckets.find(b => b.seasonNo === epSNo);
                        }

                        // 3. Fallback to indexing or first bucket
                        if (!bucket && epSNo > 1) bucket = buckets[epSNo - 1];
                        if (!bucket) bucket = buckets[0];

                        bucket.episodes.push(ep);
                    });
                }

                const final = buckets.filter(s => s.episodes.length > 0);
                // ANIME FIX: If we only got 1 season with MANY episodes, force chunking it into 24-ep blocks
                // This matches how providers (Satoru/JustAnime) expect multi-season content.
                if (final.length === 1 && currentIsLikelyAnime && final[0].episodes.length > 35) {
                    rawEpisodes = final[0].episodes;
                    console.log(`Anime detected with single large season (${rawEpisodes.length} eps). Forcing seasonal split.`);
                } else if (final.length > 0) {
                    console.log(`Loaded ${final.length} seasons from API metadata.`);
                    return final;
                }
            }

            // Fallback for anime: If we have a long flat list and no season metadata, split every 24 episodes
            if (currentIsLikelyAnime && rawEpisodes.length > 26) {
                const skeletonSeasons = Array.isArray(tvSeasons)
                    ? tvSeasons.filter((season) => Number(season?.seasonNo || 0) > 0)
                    : [];
                const totalSkeletonEpisodes = skeletonSeasons.reduce(
                    (sum, season) => sum + (Array.isArray(season?.episodes) ? season.episodes.length : 0),
                    0,
                );
                if (skeletonSeasons.length > 1 && totalSkeletonEpisodes > 0) {
                    const distributed = [];
                    let cursor = 0;
                    skeletonSeasons.forEach((season, index) => {
                        const seasonNo = Number(season?.seasonNo || index + 1);
                        const seasonPartNo = Number(season?.seasonPartNo || season?.part || season?.partNo || 0) || 0;
                        const seasonCount = Math.max(0, Number(Array.isArray(season?.episodes) ? season.episodes.length : 0));
                        const remaining = rawEpisodes.length - cursor;
                        if (remaining <= 0) return;
                        const take = index === skeletonSeasons.length - 1
                            ? remaining
                            : Math.min(seasonCount || remaining, remaining);
                        if (take <= 0) return;
                        const slice = rawEpisodes.slice(cursor, cursor + take);
                        cursor += take;
                        if (!slice.length) return;
                        distributed.push({
                            seasonNo,
                            seasonPartNo,
                            sourceOrder: index,
                            dedupeKey: makeSeasonKey(seasonNo, seasonPartNo),
                            name: String(season?.name || `Season ${seasonNo}`).trim(),
                            providerAnimeId: providerAnimeId || null,
                            episodes: slice,
                            provider,
                            providerTitle: String(providerTitle || '').trim(),
                        });
                    });
                    if (distributed.length > 0) {
                        return distributed;
                    }
                }
                const chunks = [];
                for (let i = 0; i < rawEpisodes.length; i += 24) {
                    const sNo = Math.floor(i / 24) + 1;
                    chunks.push({
                        seasonNo: sNo,
                        name: `Part ${sNo}`,
                        episodes: rawEpisodes.slice(i, i + 24)
                    });
                }
                return chunks;
            }

            // 2. Fallback: Group by season property in flat list
            if (rawEpisodes.length > 0) {
                const grouped = new Map();
                rawEpisodes.forEach((ep) => {
                    const sNo = mapSNo(ep?.season || ep?.seasonNumber || ep?.season_number || ep?.seasonNum, 1);
                    if (!grouped.has(sNo)) grouped.set(sNo, []);
                    grouped.get(sNo).push(ep);
                });

                return [...grouped.entries()]
                    .sort((a, b) => a[0] - b[0])
                    .map(([seasonNo, episodes]) => ({
                        seasonNo,
                        name: currentIsLikelyAnime ? `Part ${seasonNo}` : `Season ${seasonNo}`,
                        episodes
                    }));
            }

            return [];
        }

        function buildSeasonDisplayNameForMenu(season, index, isAnime) {
            const seasonNo = Number(season?.seasonNo || (index + 1));
            const rawName = String(season?.name || '').trim();
            const isGeneric = /^(season|part)\s+\d+$/i.test(rawName);
            let label = rawName && !isGeneric
                ? rawName
                : (Number.isFinite(seasonNo) && seasonNo > 0 ? `Season ${seasonNo}` : `Season ${index + 1}`);
            return label.replace(/\s+/g, ' ').trim();
        }

        function buildSeasonEpisodeSignature(season) {
            const episodes = Array.isArray(season?.episodes) ? season.episodes : [];
            return episodes.map((ep, i) => {
                const epNo = Number(ep?.episode || ep?.number || ep?.episodeNum || (i + 1));
                const epId = String(ep?.id || '').trim().toLowerCase();
                const epTitle = normalizeTitleForMatch(String(ep?.title || '')).slice(0, 80);
                return `${Number.isFinite(epNo) ? epNo : (i + 1)}:${epId || epTitle}`;
            }).join('|');
        }

        function pickRicherSeasonEntry(a, b) {
            const score = (row) => {
                const episodes = Array.isArray(row?.episodes) ? row.episodes : [];
                const idCount = episodes.filter((ep) => String(ep?.id || '').trim()).length;
                const nonGenericName = /^(season|part)\s+\d+$/i.test(String(row?.name || '').trim()) ? 0 : 1;
                return (episodes.length * 2) + (idCount * 5) + nonGenericName;
            };
            return score(b) > score(a) ? b : a;
        }

        function getSeasonEpisodeIdentitySet(season) {
            const out = new Set();
            const episodes = Array.isArray(season?.episodes) ? season.episodes : [];
            episodes.forEach((ep, idx) => {
                const epNo = Number(ep?.episode || ep?.number || ep?.episodeNum || (idx + 1));
                const epId = String(ep?.id || '').trim().toLowerCase();
                const epTitle = normalizeTitleForMatch(String(ep?.title || '')).slice(0, 90);
                if (epId) out.add(`id:${epId}`);
                out.add(`n:${Number.isFinite(epNo) ? epNo : (idx + 1)}:${epTitle}`);
            });
            return out;
        }

        function seasonEpisodeOverlapRatio(a, b) {
            const aSet = getSeasonEpisodeIdentitySet(a);
            const bSet = getSeasonEpisodeIdentitySet(b);
            if (!aSet.size || !bSet.size) return 0;
            let same = 0;
            for (const token of aSet) {
                if (bSet.has(token)) same += 1;
            }
            return same / Math.max(aSet.size, bSet.size);
        }

        function preferCanonicalSeasonName(primary, secondary, index, isAnime) {
            const primaryLabel = buildSeasonDisplayNameForMenu(primary, index, isAnime);
            const secondaryLabel = buildSeasonDisplayNameForMenu(secondary, index, isAnime);
            const primaryGeneric = /^(season|part)\s+\d+$/i.test(primaryLabel);
            const secondaryGeneric = /^(season|part)\s+\d+$/i.test(secondaryLabel);
            if (primaryGeneric && !secondaryGeneric) return primaryLabel;
            if (secondaryGeneric && !primaryGeneric) return secondaryLabel;
            return primaryLabel.length <= secondaryLabel.length ? primaryLabel : secondaryLabel;
        }

        function dedupeTvSeasonEntries(seasons, isAnime) {
            const list = Array.isArray(seasons) ? seasons : [];
            if (!list.length) return [];

            const deduped = [];
            list.forEach((season, idx) => {
                const seasonNo = Number(season?.seasonNo || (idx + 1));
                const matchIdx = deduped.findIndex((existing) => {
                    const existingSeasonNo = Number(existing?.seasonNo || 0);
                    const sameSeasonNo = Number.isFinite(seasonNo) && seasonNo > 0 && existingSeasonNo === seasonNo;
                    if (!sameSeasonNo) return false;
                    const overlap = seasonEpisodeOverlapRatio(existing, season);
                    return overlap >= 0.65;
                });

                if (matchIdx === -1) {
                    deduped.push({ ...season, episodes: [...(season?.episodes || [])] });
                    return;
                }

                const existing = deduped[matchIdx];
                const chosen = pickRicherSeasonEntry(existing, season);
                const chosenName = preferCanonicalSeasonName(existing, season, matchIdx, isAnime);
                deduped[matchIdx] = {
                    ...chosen,
                    name: chosenName,
                    episodes: [...(chosen?.episodes || [])],
                };
            });

            return deduped;
        }

        function buildAnimeFillerSlugCandidates(title) {
            const raw = normalizeTitleForMatch(title);
            if (!raw) return [];

            const cleaned = raw
                .replace(/\b(tv|season|part|cour|movie|ona|ova)\b/g, ' ')
                .replace(/[^\w\s-]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            const tokens = cleaned.split(' ').filter(Boolean);
            if (!tokens.length) return [];

            const full = tokens.join('-');
            const first3 = tokens.slice(0, 3).join('-');
            const first2 = tokens.slice(0, 2).join('-');
            const candidates = [full, first3, first2].filter(Boolean);
            if (cleaned.includes('violet evergarden')) candidates.unshift('violet-evergarden');
            return [...new Set(candidates)];
        }

        function parseEpisodeRangeToken(token) {
            const t = String(token || '')
                .replace(/[â€“â€”âˆ’]/g, '-')
                .replace(/\bto\b/gi, '-')
                .replace(/[^\d,\-\s]/g, '')
                .trim();
            if (!t) return [];
            const m = t.match(/^(\d+)\s*-\s*(\d+)$/);
            if (m) {
                const start = Number(m[1]);
                const end = Number(m[2]);
                if (!Number.isFinite(start) || !Number.isFinite(end) || end < start) return [];
                const out = [];
                for (let i = start; i <= end; i += 1) out.push(i);
                return out;
            }
            const n = Number(t);
            return Number.isFinite(n) && n > 0 ? [n] : [];
        }

        function parseEpisodeListFromLine(line) {
            if (!line) return [];
            return line
                .replace(/\.\s*$/, '')
                .replace(/[â€“â€”âˆ’]/g, '-')
                .split(/[,;|]/)
                .flatMap(parseEpisodeRangeToken);
        }

        function parseAnimeFillerMapFromText(text) {
            const out = new Map();
            const body = String(text || '').replace(/[â€“â€”âˆ’]/g, '-');
            const capture = (re) => {
                const m = body.match(re);
                return m?.[1] ? String(m[1]).trim() : '';
            };
            const mangaRaw = capture(/manga\s*canon\s*episodes?\s*:?\s*([0-9,\-\s]+)/i);
            const mixedRaw = capture(/mixed\s*canon\s*\/\s*filler\s*episodes?\s*:?\s*([0-9,\-\s]+)/i);
            const fillerRaw = capture(/filler\s*episodes?\s*:?\s*([0-9,\-\s]+)/i);

            const mark = (eps, status) => {
                eps.forEach((epNo) => {
                    if (!Number.isFinite(epNo)) return;
                    if (status === 'filler') {
                        out.set(epNo, status);
                        return;
                    }
                    if (status === 'mixed') {
                        if (out.get(epNo) !== 'filler') out.set(epNo, status);
                        return;
                    }
                    if (!out.has(epNo)) out.set(epNo, status);
                });
            };

            if (mangaRaw) mark(parseEpisodeListFromLine(mangaRaw), 'manga');
            if (mixedRaw) mark(parseEpisodeListFromLine(mixedRaw), 'mixed');
            if (fillerRaw) mark(parseEpisodeListFromLine(fillerRaw), 'filler');

            // Fallback parser for markdown/html table rows containing per-episode labels.
            if (out.size === 0) {
                const rowRe = /(?:episode|ep)\s*#?\s*(\d+)[^\n\r]{0,120}?(manga canon|mixed canon\/filler|mixed canon filler|filler)/ig;
                let m;
                while ((m = rowRe.exec(body)) !== null) {
                    const epNo = Number(m[1]);
                    const rawType = String(m[2] || '').toLowerCase();
                    if (!Number.isFinite(epNo)) continue;
                    if (rawType.includes('mixed')) {
                        if (out.get(epNo) !== 'filler') out.set(epNo, 'mixed');
                    } else if (rawType.includes('manga canon')) {
                        if (!out.has(epNo)) out.set(epNo, 'manga');
                    } else if (rawType.includes('filler')) {
                        out.set(epNo, 'filler');
                    }
                }
            }

            return out;
        }

        function parseEpisodeValueToList(value) {
            if (Array.isArray(value)) {
                return value.flatMap((v) => parseEpisodeValueToList(v));
            }
            if (typeof value === 'number') {
                return Number.isFinite(value) ? [value] : [];
            }
            if (typeof value === 'string') {
                return parseEpisodeListFromLine(value);
            }
            return [];
        }

        function parseFillerMapFromJsonPayload(payload) {
            const out = new Map();
            const mark = (episodes, status) => {
                episodes.forEach((epNo) => {
                    if (!Number.isFinite(epNo)) return;
                    if (status === 'filler') {
                        out.set(epNo, status);
                    } else if (status === 'mixed') {
                        if (out.get(epNo) !== 'filler') out.set(epNo, status);
                    } else if (!out.has(epNo)) {
                        out.set(epNo, status);
                    }
                });
            };

            const visit = (node) => {
                if (!node || typeof node !== 'object') return;
                if (Array.isArray(node)) {
                    node.forEach(visit);
                    return;
                }
                Object.entries(node).forEach(([k, v]) => {
                    const key = String(k || '').toLowerCase();
                    if (key.includes('mixed')) {
                        mark(parseEpisodeValueToList(v), 'mixed');
                    } else if (key.includes('manga') || key.includes('canon')) {
                        mark(parseEpisodeValueToList(v), 'manga');
                    } else if (key.includes('filler')) {
                        mark(parseEpisodeValueToList(v), 'filler');
                    } else if (typeof v === 'object') {
                        visit(v);
                    }
                });
            };

            visit(payload);
            return out;
        }

        async function fetchGithubFillerMap(title, slugCandidates) {
            try {
                const meta = await fetchJsonWithFallbacks('https://data.jsdelivr.com/v1/package/gh/xsunzukz/anime-filler-episodes-api', 22000);
                const root = meta?.data;
                if (!root || typeof root !== 'object') return new Map();

                const files = [];
                const walk = (nodes, prefix = '') => {
                    if (!Array.isArray(nodes)) return;
                    nodes.forEach((n) => {
                        const name = String(n?.name || '');
                        const type = String(n?.type || '');
                        const path = prefix ? `${prefix}/${name}` : name;
                        if (type === 'file' && name.toLowerCase().endsWith('.json')) files.push(path);
                        if (type === 'directory') walk(n.files || [], path);
                    });
                };
                walk(root.files || []);
                if (!files.length) return new Map();

                const normTitle = normalizeTitleForMatch(title);
                const titleTokens = new Set(normTitle.split(' ').filter(Boolean));
                const wanted = new Set((slugCandidates || []).map((s) => String(s || '').toLowerCase()));
                let ranked = files.map((f) => {
                    const lf = f.toLowerCase();
                    const base = lf.split('/').pop() || lf;
                    const stem = base.replace(/\.json$/i, '');
                    const normStem = normalizeTitleForMatch(stem);
                    const stemTokens = normStem.split(' ').filter(Boolean);
                    let score = 0;
                    if (wanted.has(stem) || wanted.has(lf.replace(/\.json$/i, ''))) score += 60;
                    if (normStem === normTitle) score += 120;
                    if (normStem.includes(normTitle) || normTitle.includes(normStem)) score += 25;
                    let overlap = 0;
                    stemTokens.forEach((t) => { if (titleTokens.has(t)) overlap += 1; });
                    score += overlap * 8;
                    if (lf.includes('filler')) score += 5;
                    return { file: f, score };
                });
                ranked = ranked.filter((r) => r.score > 0).sort((a, b) => b.score - a.score).slice(0, 6);
                if (!ranked.length) return new Map();

                for (const candidate of ranked) {
                    const rawUrl = `https://cdn.jsdelivr.net/gh/xsunzukz/anime-filler-episodes-api@main/${candidate.file}`;
                    const payload = await fetchJsonWithFallbacks(rawUrl, 22000);
                    const data = payload?.data;
                    if (!data) continue;
                    const parsed = parseFillerMapFromJsonPayload(data);
                    if (parsed.size > 0) {
                        console.log('[filler] github matched file=', candidate.file, 'episodes=', parsed.size);
                        return parsed;
                    }
                }
            } catch (_) { }
            return new Map();
        }

        function normalizeTitleForMatch(v) {
            return String(v || '')
                .normalize('NFKD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/\(([^)]*)\)/g, ' ')
                .replace(/\[[^\]]*\]/g, ' ')
                .replace(/[^\w\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        async function fetchTextWithFallbacks(targetUrl, timeoutMs = 20000) {
            const candidates = [
                targetUrl
            ];

            let hadNetworkFailure = false;
            for (const url of candidates) {
                try {
                    const res = await fetch(url, { signal: AbortSignal.timeout(timeoutMs) });
                    if (!res.ok) continue;
                    const text = await res.text();
                    if (String(text || '').trim().length < 20) continue;
                    return { text, networkFailed: false };
                } catch (_) {
                    hadNetworkFailure = true;
                }
            }
            return { text: '', networkFailed: hadNetworkFailure };
        }

        async function fetchJsonWithFallbacks(targetUrl, timeoutMs = 20000) {
            const { text, networkFailed } = await fetchTextWithFallbacks(targetUrl, timeoutMs);
            if (!text) return { data: null, networkFailed };
            try {
                return { data: JSON.parse(text), networkFailed: false };
            } catch (_) {
                return { data: null, networkFailed };
            }
        }

        async function fetchAnimeFillerIndexEntries() {
            if (Array.isArray(animeFillerIndexCache)) return animeFillerIndexCache;
            try {
                const target = 'https://www.animefillerlist.com/shows';
                const { text } = await fetchTextWithFallbacks(getProxiedUrl(target), 22000);
                if (!text) return [];
                const entries = [];
                const re = /\[([^\]]+)\]\((?:https?:\/\/www\.animefillerlist\.com)?\/shows\/([a-z0-9-]+)\/?\)/ig;
                let m;
                while ((m = re.exec(text)) !== null) {
                    const name = String(m[1] || '').trim();
                    const slug = String(m[2] || '').trim();
                    if (!name || !slug) continue;
                    entries.push({ name, slug, norm: normalizeTitleForMatch(name) });
                }
                if (entries.length === 0) {
                    const htmlRe = /<a[^>]+href="\/shows\/([a-z0-9-]+)\/?"[^>]*>([^<]+)<\/a>/ig;
                    while ((m = htmlRe.exec(text)) !== null) {
                        const slug = String(m[1] || '').trim();
                        const name = String(m[2] || '').trim();
                        if (!name || !slug) continue;
                        entries.push({ name, slug, norm: normalizeTitleForMatch(name) });
                    }
                }
                animeFillerIndexCache = entries;
                return entries;
            } catch (_) {
                return [];
            }
        }

        function pickBestFillerIndexSlug(title, entries) {
            const norm = normalizeTitleForMatch(title);
            if (!norm || !Array.isArray(entries) || !entries.length) return '';
            const titleTokens = new Set(norm.split(' ').filter(Boolean));
            let best = { score: 0, slug: '' };

            entries.forEach((entry) => {
                const entryNorm = entry.norm || '';
                if (!entryNorm) return;
                let score = 0;
                if (entryNorm === norm) score += 100;
                if (entryNorm.includes(norm) || norm.includes(entryNorm)) score += 35;
                const entryTokens = entryNorm.split(' ').filter(Boolean);
                let overlap = 0;
                entryTokens.forEach((t) => { if (titleTokens.has(t)) overlap += 1; });
                score += overlap * 8;
                if (score > best.score) best = { score, slug: entry.slug };
            });

            return best.score >= 16 ? best.slug : '';
        }

        function toArrayPayload(payload) {
            if (Array.isArray(payload)) return payload;
            if (Array.isArray(payload?.results)) return payload.results;
            if (Array.isArray(payload?.data)) return payload.data;
            return [];
        }

        function pickBestMalSearchResult(title, results) {
            const norm = normalizeTitleForMatch(title);
            if (!norm) return null;
            const titleTokens = new Set(norm.split(' ').filter(Boolean));
            let best = { score: 0, item: null };
            for (const item of results || []) {
                const name = String(item?.title || item?.name || item?.title_english || item?.titleEnglish || '').trim();
                const itemNorm = normalizeTitleForMatch(name);
                if (!itemNorm) continue;
                let score = 0;
                if (itemNorm === norm) score += 120;
                if (itemNorm.includes(norm) || norm.includes(itemNorm)) score += 30;
                const tokens = itemNorm.split(' ').filter(Boolean);
                let overlap = 0;
                tokens.forEach((t) => { if (titleTokens.has(t)) overlap += 1; });
                score += overlap * 8;
                if (score > best.score) best = { score, item };
            }
            return best.score > 0 ? best.item : null;
        }

        function parseFillerMapFromMetaMalInfo(infoPayload) {
            const out = new Map();
            const episodes = toArrayPayload(infoPayload?.episodes ? infoPayload.episodes : infoPayload);
            episodes.forEach((ep, idx) => {
                const epNo = Number(ep?.number || ep?.episodeNumber || ep?.episode || idx + 1);
                if (!Number.isFinite(epNo) || epNo <= 0) return;

                const boolFiller = ep?.isFiller === true || ep?.filler === true;
                const boolMixed = ep?.isMixed === true || ep?.mixed === true;
                const boolCanon =
                    ep?.isMangaCanon === true ||
                    ep?.isCanon === true ||
                    ep?.mangaCanon === true ||
                    ep?.canon === true;

                const text = normalizeTitleForMatch(
                    `${ep?.title || ''} ${ep?.description || ''} ${ep?.type || ''} ${ep?.category || ''}`
                );
                const textFiller = text.includes('filler');
                const textMixed = text.includes('mixed canon filler') || text.includes('mixed canon');
                const textCanon = text.includes('manga canon') || text.includes('canon');

                if (boolFiller || textFiller) out.set(epNo, 'filler');
                else if (boolMixed || textMixed) out.set(epNo, 'mixed');
                else if (boolCanon || textCanon) out.set(epNo, 'manga');
            });
            return out;
        }

        async function fetchAnimeFillerStatusMap(title) {
            const key = String(title || '').toLowerCase().trim();
            if (!key) return new Map();
            if (animeFillerCache.has(key)) return animeFillerCache.get(key);

            // Source -1: single backend endpoint (/utils/filler)
            try {
                const utilsBase = API_BASE.replace('/meta/tmdb', '/utils');
                const payload = await fetchJsonWithRetry(`${utilsBase}/filler?title=${encodeURIComponent(title)}`, 9000, 15000);
                const episodesObj = payload?.episodes && typeof payload.episodes === 'object' ? payload.episodes : null;
                if (episodesObj) {
                    const map = new Map();
                    Object.entries(episodesObj).forEach(([k, v]) => {
                        const epNo = Number(k);
                        const status = String(v || '').toLowerCase();
                        if (!Number.isFinite(epNo)) return;
                        if (status === 'filler' || status === 'mixed' || status === 'manga') {
                            map.set(epNo, status);
                        }
                    });
                    if (map.size > 0) {
                        console.log('[filler] utils matched source=', payload?.source || 'unknown', 'episodes=', map.size);
                        animeFillerCache.set(key, map);
                        return map;
                    }
                }
            } catch (_) { }

            // Source 0: Consumet backend meta providers with fetchFiller=true.
            // Disabled to avoid noisy /meta/mal crashes on some consumet builds.
            if (ENABLE_CONSUMET_META_FILLER) {
                const malMap = await fetchFillerViaConsumetMeta('mal', title);
                if (malMap.size > 0) {
                    animeFillerCache.set(key, malMap);
                    return malMap;
                }
                const anilistMap = await fetchFillerViaConsumetMeta('anilist', title);
                if (anilistMap.size > 0) {
                    animeFillerCache.set(key, anilistMap);
                    return anilistMap;
                }
            }

            const slugCandidates = buildAnimeFillerSlugCandidates(title);
            const indexEntries = await fetchAnimeFillerIndexEntries();
            const indexSlug = pickBestFillerIndexSlug(title, indexEntries);
            if (indexSlug) slugCandidates.push(indexSlug);
            const uniqueCandidates = [...new Set(slugCandidates.filter(Boolean))];
            console.log('[filler] title=', title, 'candidates=', uniqueCandidates);
            if (!uniqueCandidates.length) return new Map();

            // Source 1: JSON API fallback (filler-list.chaiwala-anime.workers.dev)
            const apiQueries = [...new Set([title, ...uniqueCandidates].map((v) => String(v || '').trim()).filter(Boolean))];
            for (const query of apiQueries) {
                try {
                    const apiUrl = `https://filler-list.chaiwala-anime.workers.dev/${encodeURIComponent(query)}`;
                    const { data, networkFailed } = await fetchJsonWithFallbacks(apiUrl, 20000);
                    if (!data) {
                        if (networkFailed) fillerLookupState = 'fetch_failed';
                        continue;
                    }
                    const parsed = parseFillerMapFromJsonPayload(data);
                    if (parsed.size > 0) {
                        console.log('[filler] api matched query=', query, 'episodes=', parsed.size);
                        animeFillerCache.set(key, parsed);
                        return parsed;
                    }
                } catch (_) { }
            }

            // Source 2: GitHub repo fallback (xsunzukz/anime-filler-episodes-api)
            const githubMap = await fetchGithubFillerMap(title, uniqueCandidates);
            if (githubMap.size > 0) {
                animeFillerCache.set(key, githubMap);
                return githubMap;
            }

            const failedSlugs = (animeFillerCache.get('__failedSlugs__') || new Set());

            for (const slug of uniqueCandidates) {
                if (failedSlugs.has(slug)) continue;
                try {
                    const pageUrl = `https://www.animefillerlist.com/shows/${encodeURIComponent(slug)}`;
                    const { text, networkFailed } = await fetchTextWithFallbacks(getProxiedUrl(pageUrl), 15000);
                    if (!text) {
                        if (networkFailed) fillerLookupState = 'fetch_failed';
                        failedSlugs.add(slug);
                        animeFillerCache.set('__failedSlugs__', failedSlugs);
                        continue;
                    }
                    const parsed = parseAnimeFillerMapFromText(text);
                    if (parsed.size > 0) {
                        console.log('[filler] matched slug=', slug, 'episodes=', parsed.size);
                        animeFillerCache.set(key, parsed);
                        return parsed;
                    } else {
                        failedSlugs.add(slug);
                        animeFillerCache.set('__failedSlugs__', failedSlugs);
                    }
                } catch (_) {
                    failedSlugs.add(slug);
                    animeFillerCache.set('__failedSlugs__', failedSlugs);
                }
            }

            const empty = new Map();
            animeFillerCache.set(key, empty);
            return empty;
        }

        async function fetchJsonWithRetry(url, timeoutMs = 12000, retryTimeoutMs = 25000) {
            const tryFetch = async (ms) => {
                const options = { timeoutMs: ms };
                const { res } = await fetchJsonWithApiFallback(url, options);
                if (!res.ok) throw new Error(`Info fetch failed (${res.status})`);
                return res.json();
            };
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const isRetriable = (err) => {
                const msg = String(err?.message || '').toLowerCase();
                if (err?.name === 'TimeoutError' || msg.includes('timed out') || msg.includes('abort')) return true;
                if (msg.includes('failed to fetch') || msg.includes('networkerror') || msg.includes('load failed')) return true;
                const statusMatch = msg.match(/\((\d{3})\)/);
                const status = statusMatch ? Number(statusMatch[1]) : 0;
                if (status === 404 || status === 429 || status >= 500) return true;
                return false;
            };

            try {
                return await tryFetch(timeoutMs);
            } catch (err) {
                if (!isRetriable(err)) throw err;
                await sleep(1200);
                try {
                    return await tryFetch(retryTimeoutMs);
                } catch (err2) {
                    if (!isRetriable(err2)) throw err2;
                    await sleep(2200);
                    return await tryFetch(Math.max(retryTimeoutMs, 30000));
                }
            }
        }

        function normalizeAnimeSearchQuery(raw) {
            return String(getAnimeTitleText(raw) || '')
                .normalize('NFKD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[’‘`´]/g, "'")
                .replace(/[“”]/g, '"')
                .replace(/[×✕]/g, 'x')
                .replace(/[‐‑‒–—―]/g, '-')
                .replace(/[_-]+/g, ' ')
                .replace(/[:;,.!?()[\]{}"'’]/g, ' ') // Strip common punctuation for search
                .replace(/\s+/g, ' ')
                .trim();
        }

        function getAnimeProviderBase(provider) {
            return activeApiBase.replace('/meta/tmdb', `/anime/${provider}`);
        }

        function buildAnimeInfoUrl(provider, animeId) {
            const base = getAnimeProviderBase(provider);
            if (provider === 'satoru') {
                return `${base}/info/${encodeURIComponent(animeId)}`;
            }
            if (provider === 'animesalt') {
                // AnimeSalt uses /info?id={seriesSlug}
                const url = new URL(`${base}/info`);
                url.searchParams.set('id', animeId);
                return url.toString();
            }
            const url = new URL(`${base}/info`);
            url.searchParams.set('id', animeId);
            return url.toString();
        }

        /**
         * Constructs an AnimeSalt episode ID directly from the series slug + season/episode numbers.
         * AnimeSalt episode IDs follow the pattern: {seriesSlug}-{seasonNo}x{episodeNo}
         * e.g. 'series-slug' + S3E5 => 'series-slug-3x5'
         */
        function buildAnimesaltEpisodeId(seriesSlug, seasonNo, episodeNo) {
            const slug = String(seriesSlug || '').trim();
            const s = Math.max(1, Number(seasonNo || 1));
            const e = Math.max(1, Number(episodeNo || 1));
            return `${slug}-${s}x${e}`;
        }

        // Cache: animesalt series slug per title+season scope
        const animesaltSlugCache = new Map();

        /**
         * Resolves an AnimeSalt episode ID by:
         * 1. Checking cache for known series slug
         * 2. Searching AnimeSalt with base title (not season name, since AnimeSalt groups all
         *    seasons under one series slug)
         * 3. Constructing episode ID directly as {slug}-{seasonNo}x{episodeNo}
         * 
         * AnimeSalt slugs the ENTIRE series regardless of arcs/seasons, so searching
         * for the base series title can find episodes across multiple seasons.
         */
        async function resolveAnilistEpisodeId(resolvedContext, timeoutMs) {
            const base = getAnimeProviderBase('anilist');
            const { mediaTitle, seasonNo, episodeNo, episodeOffset } = resolvedContext;
            const finalEpisodeNo = episodeNo + (episodeOffset || 0);
            const normTitle = normalizeAnimeSearchQuery(mediaTitle);

            // Search AniList for the title
            const searchUrl = `${base}/${encodeURIComponent(normTitle)}`;
            const { res: searchRes } = await fetchJsonWithApiFallback(searchUrl, { signal: AbortSignal.timeout(timeoutMs) });
            if (!searchRes.ok) return null;
            const searchData = await searchRes.json();
            const results = getAnimeSearchResults(searchData);
            if (!results.length) return null;

            // Pick the best result
            const picked = pickAnimeResultByTitle(results, normTitle, null, 1, '', false);
            if (!picked?.id) return null;
            const anilistId = picked.id;

            // Get info to find the episode
            const infoUrl = `${base}/info?id=${encodeURIComponent(anilistId)}`;
            const { res: infoRes } = await fetchJsonWithApiFallback(infoUrl, { signal: AbortSignal.timeout(timeoutMs) });
            if (!infoRes.ok) return null;
            const infoData = await infoRes.json();
            const episodes = infoData.episodes || [];

            // Find the episode by finalEpisodeNo
            const episode = episodes.find(ep => ep.number === finalEpisodeNo);
            if (!episode?.id) return null;

            return episode.id; // AniList episode ID
        }

        async function resolveAnimesaltEpisodeId(resolvedContext, timeoutMs) {
            const base = getAnimeProviderBase('animesalt');
            const { mediaTitle, seasonNo, episodeNo, preferredYear, episodeOffset, seasonNoOverride } = resolvedContext;
            const isMovieContext = !!resolvedContext.isMovie;
            const normTitle = normalizeAnimeSearchQuery(mediaTitle);
            const cacheKey = `animesalt::slug::${normTitle.toLowerCase()}::${preferredYear || ''}::${isMovieContext ? 'movie' : 'series'}`;

            // Fast path: we already know the slug for this title
            let seriesSlug = animesaltSlugCache.get(cacheKey);

            if (!seriesSlug) {
                // Generate search terms from base title only (no season label — AnimeSalt groups
                // all seasons/arcs under one series). Try progressively simpler terms.
                const baseTitle = normTitle;
                const searchTerms = Array.from(new Set([
                    ...getAnimeSaltTitleAliases(baseTitle),
                    baseTitle,
                    baseTitle.replace(/ (Season|Arc|Part|Cour) \d+/gi, ''),
                    baseTitle.split(' ').slice(0, 4).join(' '), // first 4 words
                    baseTitle.split(' ').slice(0, 3).join(' '), // first 3 words
                    baseTitle.split(' ').slice(0, 2).join(' '), // first 2 words
                ].filter(Boolean)));

                let bestResult = null;
                for (const term of searchTerms) {
                    if (!term || term.length < 2) continue;
                    try {
                        const typeParam = isMovieContext ? 'movie' : 'tv';
                        const searchUrl = `${base}/${encodeURIComponent(term)}?type=${encodeURIComponent(typeParam)}`;
                        const { res: searchRes } = await fetchJsonWithApiFallback(searchUrl, { signal: AbortSignal.timeout(timeoutMs) });
                        if (!searchRes.ok) continue;
                        const searchData = await searchRes.json();
                        const results = getAnimeSearchResults(searchData);
                        if (!results.length) continue;

                        // For movies: prefer results with "movie:" prefix IDs.
                        // For series: prefer results without "movie:" prefix.
                        const filteredResults = isMovieContext
                            ? results.filter(r => String(r.id || '').startsWith('movie:'))
                            : results.filter(r => !String(r.id || '').startsWith('movie:'));
                        const pool = filteredResults.length ? filteredResults : results;

                        // Standardize: use context-aware title match (isMovieContext is from resolvedContext)
                        const picked = pickAnimeResultByTitle(pool, baseTitle, preferredYear, 1, '', isMovieContext);
                        if (picked?.id && isAllowedAmbiguousAnimeProviderMatch(picked, baseTitle, preferredYear)) {
                            bestResult = picked;
                            break;
                        } else if (picked?.id) {
                            console.warn('[animesalt] rejected weak title match:', baseTitle, getAnimeResultTitleTexts(picked).join(' / ') || picked.id, getProviderResultYear(picked), 'wanted', preferredYear);
                        }
                        // Fallback: only use the top result when the title is genuinely close.
                        // Shared generic words like "seven" must not map The Seven Deadly Sins
                        // to unrelated shows such as Reign of the Seven Spellblades.
                        if (pool[0]?.id) {
                            if (isAllowedAmbiguousAnimeProviderMatch(pool[0], baseTitle, preferredYear)) {
                                bestResult = pool[0];
                                break;
                            }
                        }
                    } catch (_) { }
                }

                if (!bestResult?.id) {
                    console.warn('[animesalt] Could not find slug for:', normTitle, isMovieContext ? '(movie)' : '(series)');
                    return null;
                }

                seriesSlug = String(bestResult.id || '').trim();
                if (seriesSlug) animesaltSlugCache.set(cacheKey, seriesSlug);
            }

            if (!seriesSlug) return null;

            // For movies, AnimeSalt search returns IDs like "movie:series-slug-0".
            // The watch endpoint expects this ID directly — NOT the series slug-SxE pattern.
            if (isMovieContext || seriesSlug.startsWith('movie:')) {
                const movieId = seriesSlug.startsWith('movie:') ? seriesSlug : `movie:${seriesSlug}`;
                console.log(`[animesalt] movie resolved: episodeId=${movieId}`);
                return movieId;
            }

            // Series: prefer info endpoint episode IDs (authoritative), then fall back
            // to slug pattern construction if info lookup is unavailable.
            const finalSeasonNo = seasonNoOverride !== undefined ? seasonNoOverride : seasonNo;
            const finalEpisodeNo = episodeNo + (episodeOffset || 0);

            try {
                const { res: infoRes } = await fetchJsonWithApiFallback(
                    buildAnimeInfoUrl('animesalt', seriesSlug),
                    { signal: AbortSignal.timeout(timeoutMs) },
                );
                if (infoRes.ok) {
                    let info = await infoRes.json();
                    if (info?.data) info = info.data;
                    const infoTitle = String(info?.title || info?.name || '').trim();
                    const infoYear = getProviderResultYear(info);
                    if (isAmbiguousSingleTokenTitle(normTitle) && preferredYear) {
                        const infoTitleQuality = getTitleMatchQuality(infoTitle || seriesSlug, normTitle);
                        const yearOk = Number.isFinite(infoYear)
                            ? Math.abs(Number(infoYear) - Number(preferredYear)) <= 1
                            : /(^|-)the-series-the-beginning($|-)/i.test(seriesSlug);
                        if (!yearOk || !infoTitleQuality.strong) {
                            console.warn('[animesalt] rejected slug after info validation:', seriesSlug, 'title=', infoTitle, 'year=', infoYear, 'wanted=', normTitle, preferredYear);
                            return null;
                        }
                    }
                    const episodes = Array.isArray(info?.episodes) ? info.episodes : [];
                    const bySeasonEpisode = episodes.find((ep) => {
                        const id = String(ep?.id || '').trim().toLowerCase();
                        const m = id.match(/-(\d+)x(\d+)$/);
                        if (!m) return false;
                        return Number(m[1]) === Number(finalSeasonNo) && Number(m[2]) === Number(finalEpisodeNo);
                    });
                    if (bySeasonEpisode?.id) {
                        console.log(`[animesalt] resolved by info id: slug=${seriesSlug}, episode=${bySeasonEpisode.id}`);
                        return String(bySeasonEpisode.id).trim();
                    }

                    if (Number(finalSeasonNo) <= 1) {
                        const byEpisodeNumber = episodes.find((ep) => Number(ep?.number || ep?.episode || 0) === Number(finalEpisodeNo));
                        if (byEpisodeNumber?.id) {
                            console.log(`[animesalt] resolved by info number: slug=${seriesSlug}, episode=${byEpisodeNumber.id}`);
                            return String(byEpisodeNumber.id).trim();
                        }
                    }
                }
            } catch (_) {
                // Fall through to deterministic slug mapping below.
            }

            const episodeId = buildAnimesaltEpisodeId(seriesSlug, finalSeasonNo, finalEpisodeNo);
            console.log(`[animesalt] resolved by pattern: slug=${seriesSlug}, episode=${episodeId}`);
            return episodeId;
        }

        function buildSatoruResolveUrl(title, seasonNo, episodeNo, seasonLabel = '', preferredYear = null) {
            const base = getAnimeProviderBase('satoru');
            const url = new URL(`${base}/resolve`);
            url.searchParams.set('title', getAnimeTitleText(title));
            url.searchParams.set('season', String(seasonNo || 1));
            url.searchParams.set('episode', String(episodeNo || 1));
            if (seasonLabel) url.searchParams.set('seasonTitle', seasonLabel);
            if (preferredYear) url.searchParams.set('year', String(preferredYear));
            // Add cache-busting timestamp to force fresh backend responses
            url.searchParams.set('_t', String(Date.now()));
            return url.toString();
        }

        function buildSatoruSeriesUrl(title, preferredYear = null) {
            const base = getAnimeProviderBase('satoru');
            const url = new URL(`${base}/series`);
            url.searchParams.set('title', getAnimeTitleText(title));
            if (preferredYear) url.searchParams.set('year', String(preferredYear));
            return url.toString();
        }

        async function resolveExactSatoruEpisode(mediaTitle, seasonNo, episodeNo, seasonLabel = '', preferredYear = null) {
            try {
                console.log('Satoru resolve for:', { mediaTitle, seasonNo, episodeNo, seasonLabel, preferredYear, TMDB_ID });
                const resolveUrl = buildSatoruResolveUrl(
                    mediaTitle,
                    seasonNo,
                    episodeNo,
                    seasonLabel,
                    preferredYear,
                );
                console.log('Satoru resolve URL:', resolveUrl);
                const { res } = await fetchJsonWithApiFallback(resolveUrl, {
                    signal: AbortSignal.timeout(getProviderTimeout('satoru', 'animeInfo', ANIME_INFO_TIMEOUT_MS)),
                });
                if (!res.ok) {
                    console.log('Satoru resolve failed:', res.status, res.statusText);
                    return null;
                }
                const resolved = await res.json();
                console.log('Satoru resolved response:', resolved);
                const animeId = String(resolved?.anime?.id || '').trim();
                const episodeId = String(resolved?.episode?.id || '').trim();
                const resolvedAnimeTitle = String(resolved?.anime?.title || '').trim();
                if (!animeId || !episodeId) {
                    console.log('Satoru resolve missing IDs:', { animeId, episodeId });
                    return null;
                }
                
                // Validate that the resolved anime title matches the requested title
                const normalizedRequested = normalizeAnimeSearchQuery(getAnimeTitleText(mediaTitle)).toLowerCase();
                const normalizedResolved = normalizeAnimeSearchQuery(getAnimeTitleText(resolvedAnimeTitle)).toLowerCase();
                const titleMatches = normalizedRequested.includes(normalizedResolved) || normalizedResolved.includes(normalizedRequested);
                if (!titleMatches) {
                    console.log('Satoru resolve title mismatch:', { requested: mediaTitle, resolved: resolvedAnimeTitle, normalizedRequested, normalizedResolved });
                    return null;
                }

                // Guard: when user requested base season-1 title, reject arc/part-specific
                // resolves (common bad match: "... Culling Game Part 1").
                const requestedHasArcMarker = /\b(part|cour|arc)\s*\d+\b/i.test(normalizedRequested);
                const resolvedHasArcMarker = /\b(part|cour|arc)\s*\d+\b/i.test(normalizedResolved);
                if (Number(seasonNo || 1) <= 1 && !requestedHasArcMarker && resolvedHasArcMarker) {
                    console.log('Satoru resolve rejected arc/part mismatch:', {
                        requested: mediaTitle,
                        resolved: resolvedAnimeTitle,
                        seasonNo,
                    });
                    return null;
                }
                
                const result = {
                    animeId,
                    episodeId,
                    animeTitle: resolvedAnimeTitle,
                };
                console.log('Satoru returning:', result);
                return result;
            } catch (e) {
                console.log('Satoru resolve error:', e);
                return null;
            }
        }

        function buildAnimeWatchUrl(provider, episodeId, options = {}) {
            const base = getAnimeProviderBase(provider);
            const url = new URL(`${base}/watch/${encodeURIComponent(episodeId)}`);
            if (provider === 'animesalt') url.searchParams.set('category', 'both');
            if (provider === 'satoru') url.searchParams.set('_t', String(Date.now())); // Cache-busting for satoru
            if (provider === 'animekai' && options?.dub) url.searchParams.set('dub', 'true');
            return url.toString();
        }

        function getAnimeSearchResults(searchData) {
            if (Array.isArray(searchData?.results)) return searchData.results;
            if (Array.isArray(searchData?.data?.results)) return searchData.data.results;
            if (Array.isArray(searchData?.data)) return searchData.data;
            return Array.isArray(searchData) ? searchData : [];
        }

        function getAnimeResultTitleTexts(row) {
            const out = [];
            const push = (value) => {
                const text = getAnimeTitleText(value);
                if (text && !out.some((existing) => existing.toLowerCase() === text.toLowerCase())) out.push(text);
            };
            push(row?.title);
            push(row?.name);
            push(row?.englishTitle);
            push(row?.romajiTitle);
            push(row?.nativeTitle);
            push(row?.title?.english);
            push(row?.title?.romaji);
            push(row?.title?.native);
            return out;
        }

        function getTitleMatchQuality(candidateTitle, wantedTitle) {
            const normalize = (value) => normalizeAnimeSearchQuery(value).toLowerCase();
            const compact = (value) => normalize(value).replace(/[^a-z0-9]+/g, '');
            const tokenSet = (value) => new Set(
                normalize(value)
                    .split(/\s+/)
                    .filter((token) => token && !['the', 'a', 'an', 'and', 'of', 'season', 'part', 'tv'].includes(token)),
            );

            const candidate = normalize(candidateTitle);
            const wanted = normalize(wantedTitle);
            const compactCandidate = compact(candidateTitle);
            const compactWanted = compact(wantedTitle);
            if (!candidate || !wanted || !compactCandidate || !compactWanted) {
                return { exact: false, contains: false, tokenRatio: 0, strong: false };
            }

            const wantedTokens = tokenSet(wanted);
            const candidateTokens = tokenSet(candidate);
            const shared = [...wantedTokens].filter((token) => candidateTokens.has(token)).length;
            const tokenRatio = wantedTokens.size ? shared / wantedTokens.size : 0;
            const singleWantedToken = wantedTokens.size === 1 ? [...wantedTokens][0] : '';
            const distinctiveSingleTokenMatch =
                singleWantedToken.length >= 6 &&
                candidateTokens.has(singleWantedToken);
            const exact = compactCandidate === compactWanted;
            const contains =
                compactWanted.length >= 6 &&
                compactCandidate.length >= 8 &&
                (compactCandidate.includes(compactWanted) || compactWanted.includes(compactCandidate));
            const strong = exact || contains || distinctiveSingleTokenMatch || (wantedTokens.size >= 2 && tokenRatio >= 0.75);
            return { exact, contains, tokenRatio, strong };
        }

        function isStrongAnimeProviderTitleMatch(row, wantedTitle) {
            return getAnimeResultTitleTexts(row).some((candidateTitle) =>
                getTitleMatchQuality(candidateTitle, wantedTitle).strong
            );
        }

        function getProviderResultYear(row) {
            const raw = String(
                row?.releaseDate ||
                row?.release_date ||
                row?.startDate ||
                row?.year ||
                row?.aired ||
                '',
            );
            const y = Number(raw.match(/\b(19|20)\d{2}\b/)?.[0] || 0);
            return Number.isFinite(y) && y > 1900 ? y : null;
        }

        function isAmbiguousSingleTokenTitle(title) {
            const tokens = normalizeAnimeSearchQuery(title)
                .toLowerCase()
                .split(/\s+/)
                .filter((token) => token && !['the', 'a', 'an', 'and', 'of', 'season', 'part', 'tv'].includes(token));
            return tokens.length === 1;
        }

        function getAnimeSaltTitleAliases(title) {
            const compact = normalizeAnimeSearchQuery(title).toLowerCase().replace(/[^a-z0-9]+/g, '');
            const aliases = {
                pokemon: ['Pokemon the Series The Beginning', 'Pokemon the Series: The Beginning'],
            };
            return aliases[compact] || [];
        }

        function isAllowedAmbiguousAnimeProviderMatch(row, wantedTitle, preferredYear = null) {
            if (!isStrongAnimeProviderTitleMatch(row, wantedTitle)) return false;
            if (!isAmbiguousSingleTokenTitle(wantedTitle) || !preferredYear) return true;

            const rowYear = getProviderResultYear(row);
            if (Number.isFinite(rowYear) && Math.abs(Number(rowYear) - Number(preferredYear)) <= 1) return true;

            const combined = [
                ...getAnimeResultTitleTexts(row),
                row?.id,
                row?.url,
            ].join(' ');
            const compactCombined = normalizeAnimeSearchQuery(combined).toLowerCase().replace(/[^a-z0-9]+/g, '');
            return compactCombined.includes('pokemontheseriesthebeginning');
        }

        function isTrustedAnimesaltEpisodeIdForTitle(episodeId, wantedTitle, preferredYear = null) {
            const raw = String(episodeId || '').trim().toLowerCase();
            const match = raw.match(/^(.+)-(\d+)x(\d+)$/i);
            if (!match) return false;
            const slug = match[1];
            const slugTitle = slug.replace(/-/g, ' ');
            return isAllowedAmbiguousAnimeProviderMatch({ title: slugTitle, id: slug }, wantedTitle, preferredYear);
        }

        function pickAnimeResultByAniListId(results, anilistId) {
            const targetId = String(anilistId || '').trim();
            if (!targetId || !Array.isArray(results) || !results.length) return null;
            return results.find((result) => {
                const resultAniListId = String(result?.anilistId || result?.anilist || result?.anilist_id || '').trim();
                return resultAniListId === targetId;
            }) || null;
        }

        function getPreferredMediaYear() {
            const yearRaw =
                currentMediaInfo?.releaseDate ||
                currentMediaInfo?.release_date ||
                currentMediaInfo?.first_air_date ||
                currentMediaInfo?.startDate ||
                '';
            const y = Number(String(yearRaw).slice(0, 4));
            return Number.isFinite(y) && y > 1900 ? y : null;
        }

        function getAnimeTitleText(value) {
            if (!value) return '';
            if (typeof value === 'string') return value.trim();
            if (typeof value === 'number') return String(value).trim();
            if (Array.isArray(value)) {
                return value.map(getAnimeTitleText).find(Boolean) || '';
            }
            if (typeof value === 'object') {
                return (
                    getAnimeTitleText(value.english) ||
                    getAnimeTitleText(value.romaji) ||
                    getAnimeTitleText(value.native) ||
                    getAnimeTitleText(value.title) ||
                    getAnimeTitleText(value.name) ||
                    ''
                );
            }
            return String(value || '').trim();
        }

        async function detectLikelyAnimeMedia(info) {
            const title = normalizeAnimeSearchQuery(
                getAnimeTitleText(info?.title || info?.name || currentMediaInfo?.title || currentMediaInfo?.name || ''),
            );
            if (!title) return false;

            const genreNames = (Array.isArray(info?.genres) ? info.genres : [])
                .map((g) => (typeof g === 'string' ? g : (g?.name || '')))
                .map((g) => String(g).toLowerCase());
            const originalLang = String(info?.original_language || info?.originalLanguage || '').toLowerCase();
            const originCountries = [
                ...(Array.isArray(info?.origin_country) ? info.origin_country : []),
                ...(Array.isArray(info?.originCountry) ? info.originCountry : []),
                ...(Array.isArray(info?.production_countries) ? info.production_countries.map((c) => c?.iso_3166_1 || c?.name || c) : []),
            ].map((c) => String(c || '').toLowerCase());
            const titleLower = title.toLowerCase();

            const strongTitleSignals = [
                'anime', 'manga', 'jujutsu', 'kaisen', 'naruto', 'one piece', 'bleach', 'attack on titan',
                'demon slayer', 'kimetsu', 'my hero academia', 'boku no hero', 'chainsaw man', 'tokyo ghoul',
                'hunter x hunter', 'dragon ball', 'sailor moon', 'spy x family', 'solo leveling', 'blue lock',
                'black clover', 're:zero', 'vinland', 'frieren', 'mashle', 'dandadan', 'kaiju',
                'sakamoto days', 'pokemon', 'digimon', 'naruto shippuden', 'death note', 'one punch man',
                'seven deadly sins',
            ];
            const titleAliases = {
                thesevendeadlysins: ['nanatsu no taizai'],
            };

            const compactTitle = titleLower.replace(/[^a-z0-9]+/g, '');
            const titleLooksAnime = strongTitleSignals.some((signal) => {
                const compactSignal = signal.replace(/[^a-z0-9]+/g, '');
                if (!compactSignal) return false;
                if (compactSignal.length <= 5) return compactTitle === compactSignal;
                return compactTitle.includes(compactSignal);
            });
            const hasExplicitAnimeMetadata =
                genreNames.includes('anime') ||
                Boolean(info?.anilistId || info?.malId || info?.animeId);
            const hasSoftAnimeMetadata =
                originalLang === 'ja' ||
                originalLang === 'jpn' ||
                originCountries.includes('jp') ||
                originCountries.includes('japan') ||
                (genreNames.includes('animation') && !genreNames.includes('family') && !genreNames.includes('children'));
            const metadataLooksAnime =
                hasExplicitAnimeMetadata ||
                (hasSoftAnimeMetadata && MEDIA_TYPE === 'movie' && titleLooksAnime);

            if (titleLooksAnime || metadataLooksAnime) return true;

            if (MEDIA_TYPE !== 'tv' && MEDIA_TYPE !== 'movie') return false;

            try {
                const searchTitles = Array.from(new Set([
                    title,
                    ...(titleAliases[compactTitle] || []),
                ].filter(Boolean)));
                let results = [];
                for (const searchTitle of searchTitles) {
                    const anilistUrl = `${API_BASE.replace('/meta/tmdb', '/meta/anilist')}/${encodeURIComponent(searchTitle)}`;
                    const { res } = await fetchJsonWithApiFallback(anilistUrl, {
                        signal: AbortSignal.timeout(7000),
                    });
                    if (!res.ok) continue;
                    const payload = await res.json();
                    results = getAnimeSearchResults(payload);
                    if (Array.isArray(results) && results.length) break;
                }
                if (!Array.isArray(results) || !results.length) return false;

                const preferredYear = getPreferredMediaYear();
                const picked = results.find((row) => {
                        const rowTitles = getAnimeResultTitleTexts(row)
                            .map((value) => normalizeAnimeSearchQuery(value).toLowerCase())
                            .filter(Boolean);
                        if (!rowTitles.length) return false;
                        const rowYear = Number(String(row?.releaseDate || row?.startDate || row?.year || '').slice(0, 4));
                        const yearMatches = hasSoftAnimeMetadata
                            ? (!preferredYear || !Number.isFinite(rowYear) || Math.abs(rowYear - preferredYear) <= 1)
                            : (!preferredYear || (Number.isFinite(rowYear) && Math.abs(rowYear - preferredYear) <= 1));
                        const titleMatches = rowTitles.some((rowTitle) => {
                            const compactRowTitle = rowTitle.replace(/[^a-z0-9]+/g, '');
                            if (!compactRowTitle || compactRowTitle.length < 4) return false;
                            return (
                            compactRowTitle === compactTitle ||
                            (hasSoftAnimeMetadata && compactTitle.length >= 8 && compactRowTitle.length >= 8 &&
                                (compactRowTitle.includes(compactTitle) || compactTitle.includes(compactRowTitle))) ||
                            (titleAliases[compactTitle] || []).some((alias) =>
                                compactRowTitle === alias.replace(/[^a-z0-9]+/g, '')
                            )
                            );
                        });
                        return titleMatches && yearMatches;
                    });
                if (!picked?.id) return false;

                return getAnimeResultTitleTexts(picked).some((pickedTitleRaw) => {
                    const pickedTitle = normalizeAnimeSearchQuery(pickedTitleRaw).toLowerCase();
                    const compactPickedTitle = pickedTitle.replace(/[^a-z0-9]+/g, '');
                    return compactPickedTitle === compactTitle ||
                        (hasSoftAnimeMetadata && compactTitle.length >= 8 && compactPickedTitle.length >= 8 &&
                            (compactPickedTitle.includes(compactTitle) || compactTitle.includes(compactPickedTitle))) ||
                        (titleAliases[compactTitle] || []).some((alias) =>
                            compactPickedTitle === alias.replace(/[^a-z0-9]+/g, '')
                        );
                });
            } catch {
                return false;
            }
        }

        async function getCanonicalAnimeInfo() {
            if (!currentIsLikelyAnime) return null;
            const mediaTitle = getAnimeTitleText(currentMediaInfo?.title || currentMediaInfo?.name || TMDB_ID || '');
            console.log('Canonical mediaTitle:', mediaTitle, 'from currentMediaInfo:', currentMediaInfo?.title);
            // Skip canonical resolution if TMDB failed and we only have a generic fallback title
            if (mediaTitle === 'Unknown' || mediaTitle === 'Unknown Title') return null;
            const requestKey = [
                String(currentMediaInfo?.anilistId || '').trim(),
                mediaTitle.toLowerCase(),
                String(TMDB_ID || '').trim(),
            ].join('::');

            // Check if cached info is still relevant to current media
            if (currentAnimeCanonicalInfo && currentAnimeCanonicalInfoKey !== requestKey) {
                console.warn('Cached anime canonical info key mismatch, clearing');
                currentAnimeCanonicalInfo = null;
                currentAnimeCanonicalInfoKey = '';
            }

            if (currentAnimeCanonicalInfo && currentAnimeCanonicalInfoKey === requestKey) return currentAnimeCanonicalInfo;
            if (currentAnimeCanonicalInfoPromise) return currentAnimeCanonicalInfoPromise;

            // Check localStorage cache
            const cacheKey = `sv_anime_canonical_${requestKey}`;
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    if (parsed.ts && Date.now() - parsed.ts < 60 * 60 * 1000) { // 1 hour
                        currentAnimeCanonicalInfo = parsed.data;
                        currentAnimeCanonicalInfoKey = requestKey;
                        return currentAnimeCanonicalInfo;
                    }
                } catch {}
            }

            const anilistBase = API_BASE.replace('/meta/tmdb', '/meta/anilist');
            const title = normalizeAnimeSearchQuery(mediaTitle);
            const cachedId = String(currentMediaInfo?.anilistId || '').trim();

            currentAnimeCanonicalInfoPromise = (async () => {
                try {
                    let animeId = cachedId;

                    if (!animeId && title) {
                        const { res: searchRes } = await fetchJsonWithApiFallback(
                            `${anilistBase}/${encodeURIComponent(title)}`,
                            { signal: AbortSignal.timeout(REQ_TIMEOUT.animeSearch) },
                        );
                        if (searchRes.ok) {
