        function setVolumeBoost(level) {
            if (!video) return;
            // Extended: 0 = mute, 100 = normal, 200 = double boost
            volumeBoost = Math.max(0, Math.min(200, level));

            if (volumeBoost !== 100 || IS_IOS) {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                // If sourceNode doesn't exist or is attached to the wrong element
                if (!sourceNode || sourceNodeVideo !== video) {
                    try {
                        if (sourceNode) sourceNode.disconnect();
                        sourceNode = audioCtx.createMediaElementSource(video);
                        sourceNodeVideo = video;
                        if (!gainNode) gainNode = audioCtx.createGain();
                        sourceNode.connect(gainNode);
                        gainNode.connect(audioCtx.destination);
                    } catch (e) {
                        console.warn('AudioContext boost failed:', e);
                        sourceNode = null;
                        sourceNodeVideo = null;
                        return;
                    }
                }
            }

            if (audioCtx && gainNode) {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => undefined);
                }
                gainNode.gain.value = volumeBoost / 100;
            }

            const boostValEl = document.querySelector('.boost-value');
            if (boostValEl) {
                boostValEl.textContent = volumeBoost > 100 ? `${volumeBoost}%` : 'Off';
            }

            const boostSlider = document.querySelector('.boost-slider');
            if (boostSlider) {
                boostSlider.value = String(volumeBoost);
                const percent = (volumeBoost - 100) + '%';
                boostSlider.style.setProperty('--boost-percent', percent);
            }

            // Update tick highlights
            const ticks = document.querySelectorAll('.tick');
            const activeCount = Math.round(((volumeBoost - 100) / 100) * (ticks.length - 1));
            ticks.forEach((t, i) => {
                t.classList.toggle('active', i <= activeCount && volumeBoost > 100);
            });
        }

        function formatTime(seconds) {
            if (!isFinite(seconds)) return '0:00';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function setPlayIcon(isPlaying) {
            if (!playPauseBtn) return;
            playPauseBtn.innerHTML = isPlaying
                ? '<i class="fa-solid fa-pause"></i>'
                : '<i class="fa-solid fa-play"></i>';
            playPauseBtn.classList.toggle('is-playing', isPlaying);
            playPauseBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
        }

        function updateMuteIcon() {
            if (!muteBtn || !video) return;
            if (video.muted || video.volume === 0) muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
            else if (video.volume < 0.5) muteBtn.innerHTML = '<i class="fa-solid fa-volume-low"></i>';
            else muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
        }

        function toggleMuteFromUser(showToast = false) {
            if (!video) return;

            const currentlyMuted = video.muted || video.volume === 0;
            if (currentlyMuted) {
                video.muted = false;
                if (video.volume === 0) video.volume = 0.5;

                // On some autoplay-muted sessions, unmute must also resume the audio pipeline.
                try {
                    if (audioCtx && audioCtx.state === 'suspended') {
                        audioCtx.resume().catch(() => { });
                    }
                } catch (_) { }

                // If gain was previously driven to 0, restore sane audible gain on unmute.
                if (audioCtx && gainNode && Number(gainNode.gain?.value || 0) <= 0) {
                    setVolumeBoost(Math.max(100, Number(volumeBoost || 100)));
                }

                Promise.resolve(video.play()).catch(() => { });
            } else {
                video.muted = true;
            }

            updateMuteIcon();
            if (showToast) showMuteStatusToast();
        }

        function showMuteStatusToast() {
            if (!video || !muteStatusToast || !muteStatusIcon || !muteStatusText) return;
            const muted = video.muted || video.volume === 0;
            muteStatusIcon.className = muted
                ? 'fa-solid fa-volume-xmark'
                : (video.volume < 0.5 ? 'fa-solid fa-volume-low' : 'fa-solid fa-volume-high');
            muteStatusText.textContent = muted ? 'Muted' : 'Unmuted';
            muteStatusToast.classList.add('show');
            if (muteStatusToastTimer) clearTimeout(muteStatusToastTimer);
            muteStatusToastTimer = setTimeout(() => {
                muteStatusToast.classList.remove('show');
                muteStatusToastTimer = null;
            }, 900);
        }

        function updateVolumeFromClientX(clientX, slider) {
            if (!slider || !Number.isFinite(clientX) || !video) return;
            if (!slider) return;
            const rect = slider.getBoundingClientRect();
            if (!rect || !Number.isFinite(rect.width) || rect.width <= 0) return;
            const clamped = Math.min(rect.right, Math.max(rect.left, clientX));
            const percent = ((clamped - rect.left) / rect.width) * 100;
            const val = Math.max(0, Math.min(100, percent));
            slider.value = String(Math.round(val));
            slider.style.setProperty('--vol-percent', `${val}%`);
            video.volume = val / 100;
            video.muted = val === 0;
            updateMuteIcon();
        }

        function buildVolumeMenu() {
            if (!volumeMenu || !video) return;
            volumeMenu.innerHTML = '';
            volumeSliderEl = null;
            volumeToggleEl = null;

            const row = document.createElement('div');
            row.className = 'volume-row';

            const toggle = document.createElement('button');
            toggle.className = 'volume-toggle';
            toggle.type = 'button';
            toggle.innerHTML = video.muted || video.volume === 0
                ? '<i class="fa-solid fa-volume-xmark"></i>'
                : '<i class="fa-solid fa-volume-high"></i>';
            toggle.onclick = (e) => {
                e.stopPropagation();
                toggleMuteFromUser(false);
                if (volumeSliderEl) {
                    const next = Math.round((video.muted ? 0 : video.volume) * 100);
                    volumeSliderEl.value = String(next);
                    volumeSliderEl.style.setProperty('--vol-percent', `${next}%`);
                }
                if (volumeToggleEl) {
                    volumeToggleEl.innerHTML = video.muted || video.volume === 0
                        ? '<i class="fa-solid fa-volume-xmark"></i>'
                        : '<i class="fa-solid fa-volume-high"></i>';
                }
            };

            const slider = document.createElement('input');
            slider.type = 'range';
            slider.min = '0';
            slider.max = '100';
            slider.step = '1';
            slider.className = 'volume-slider';
            slider.value = String(Math.round((video.muted ? 0 : video.volume) * 100));
            slider.style.setProperty('--vol-percent', `${slider.value}%`);
            slider.addEventListener('input', (e) => {
                const val = Math.max(0, Math.min(100, Number.parseInt(e.target.value || '0', 10)));
                video.volume = val / 100;
                video.muted = val === 0;
                slider.style.setProperty('--vol-percent', `${val}%`);
                updateMuteIcon();
                // If sliding down, maybe reset boost?
                if (val < 100 && volumeBoost > 100) {
                    setVolumeBoost(100);
                }
            });
            slider.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                slider.setPointerCapture?.(e.pointerId);
                updateVolumeFromClientX(e.clientX, slider);
            });
            slider.addEventListener('pointermove', (e) => {
                if (!slider.hasPointerCapture?.(e.pointerId)) return;
                updateVolumeFromClientX(e.clientX, slider);
            });
            slider.addEventListener('pointerup', (e) => {
                if (slider.hasPointerCapture?.(e.pointerId)) slider.releasePointerCapture?.(e.pointerId);
            });

            volumeSliderEl = slider;
            volumeToggleEl = toggle;
            row.appendChild(toggle);
            row.appendChild(slider);
            volumeMenu.appendChild(row);

            // Boost Row
            const boostRow = document.createElement('div');
            boostRow.className = 'volume-boost-row';

            const boostHeader = document.createElement('div');
            boostHeader.className = 'boost-header';

            const boostLabel = document.createElement('span');
            boostLabel.className = 'boost-label';
            boostLabel.textContent = 'Extra Volume';

            const boostValue = document.createElement('span');
            boostValue.className = 'boost-value';
            boostValue.textContent = volumeBoost > 100 ? `${volumeBoost}%` : 'Off';

            boostHeader.appendChild(boostLabel);
            boostHeader.appendChild(boostValue);
            boostRow.appendChild(boostHeader);

            const sliderCont = document.createElement('div');
            sliderCont.className = 'boost-slider-container';

            const ticksCont = document.createElement('div');
            ticksCont.className = 'boost-ticks';
            // Create 6 ticks from 100% to 200%
            for (let i = 0; i < 6; i++) {
                const t = document.createElement('div');
                t.className = 'tick';
                ticksCont.appendChild(t);
            }
            sliderCont.appendChild(ticksCont);

            const bSlider = document.createElement('input');
            bSlider.type = 'range';
            bSlider.min = '100';
            bSlider.max = '200';
            bSlider.step = '2'; // small steps for smoothness
            bSlider.className = 'boost-slider';
            bSlider.value = String(volumeBoost);
            bSlider.oninput = (e) => {
                const val = parseInt(e.target.value, 10);
                if (video.volume < 1.0 && val > 100) {
                    video.volume = 1.0;
                    if (volumeSliderEl) {
                        volumeSliderEl.value = '100';
                        volumeSliderEl.style.setProperty('--vol-percent', '100%');
                    }
                }
                setVolumeBoost(val);
            };

            sliderCont.appendChild(bSlider);
            boostRow.appendChild(sliderCont);
            volumeMenu.appendChild(boostRow);

            // Initial tick update
            setTimeout(() => setVolumeBoost(volumeBoost), 0);
        }

        function syncTimeUI() {
            if (!video) return;
            durationTimeEl.textContent = formatTime(video.duration);
            if (isSeekDragging && Number.isFinite(pendingSeekPercent) && isFinite(video.duration) && video.duration > 0) {
                const previewTimeSec = (pendingSeekPercent / 100) * video.duration;
                currentTimeEl.textContent = formatTime(previewTimeSec);
                seekBar.style.setProperty('--seek-percent', `${pendingSeekPercent}%`);
                return;
            }

            currentTimeEl.textContent = formatTime(video.currentTime);
            if (isFinite(video.duration) && video.duration > 0) {
                // Update slider UI color fill percentage AND native thumb position
                const p = (video.currentTime / video.duration) * 100;
                seekBar.value = String(p);
                seekBar.style.setProperty('--seek-percent', p + '%');

                // Also update markers in case video duration unexpectedly changed
                updateSkipMarkers();
                updateUrlTime();
        }
    }

        let _saveProgressLastAt = 0;
        function saveProgress() {
            if (!video || !currentMediaInfo) return;
            const now = Date.now();
            // Throttle: only write to localStorage every 5 seconds
            if (now - _saveProgressLastAt < 5000) return;
            _saveProgressLastAt = now;

            const currentTime = video.currentTime;
            const duration = video.duration;
            if (!isFinite(currentTime) || !isFinite(duration) || duration <= 0) return;

            // Don't save if we are at the very beginning
            if (currentTime < 5) return; 

            // If we are at the end (90%+ and 20s remaining), remove from continue watching
            if (currentTime / duration > 0.9 && duration - currentTime < 20) {
                removeFromContinueWatching(TMDB_ID, MEDIA_TYPE);
                return;
            }

            const seasonRef = tvSeasons?.[Number(curSeason || 0)] || null;
            const episodeRef = seasonRef?.episodes?.[Number(curEpisode || 0)] || null;
            const seasonNoRaw = Number(seasonRef?.seasonNo);
            const seasonNo = Number.isFinite(seasonNoRaw) && seasonNoRaw > 0
                ? seasonNoRaw
                : (Number(curSeason || 0) + 1);
            const episodeNoRaw = Number(episodeRef?.episode || episodeRef?.number || episodeRef?.episodeNum);
            const episodeNo = Number.isFinite(episodeNoRaw) && episodeNoRaw > 0
                ? episodeNoRaw
                : (Number(curEpisode || 0) + 1);

            // Capture the active display label for virtual audio tracks (e.g. Vegamovies Hindi/Tamil)
            const activeVegaLabel = (activeSatoruTrackIndex >= 0 && satoruAudioSources[activeSatoruTrackIndex]?.label)
                ? satoruAudioSources[activeSatoruTrackIndex].label
                : '';

            const item = {
                id: TMDB_ID,
                type: MEDIA_TYPE,
                title: document.getElementById('media-title').textContent,
                poster: resolveMediaPosterUrl(currentMediaInfo || {}, currentCoverUrl || ''),
                currentTime: currentTime,
                duration: duration,
                lastUpdated: now,
                provider: FORCED_PROVIDER || lastSuccessfulProvider || '',
                seasonNo,
                episodeNo,
                seasonIndex: Number(curSeason || 0),
                episodeIndex: Number(curEpisode || 0),
                audio: preferredAudioToken || '',
                audioLabel: activeVegaLabel || preferredAudioToken || ''
            };

            let list = [];
            try {
                const raw = localStorage.getItem('sv_continue_watching');
                if (raw) list = JSON.parse(raw);
            } catch (e) {}

            if (!Array.isArray(list)) list = [];

            // Remove existing entry for this media
            list = list.filter(i => !(i.id === item.id && i.type === item.type));

            // Add to front
            list.unshift(item);

            // Keep only top 20
            if (list.length > 20) list = list.slice(0, 20);

            // Try to write; if quota exceeded, evict older entries and retry once
            try {
                localStorage.setItem('sv_continue_watching', JSON.stringify(list));
            } catch (e) {
                try {
                    // Aggressively trim to 5 items and retry
                    const trimmed = list.slice(0, 5);
                    localStorage.setItem('sv_continue_watching', JSON.stringify(trimmed));
                } catch (_) {
                    // Storage completely full — skip silently
                }
            }
        }

        function removeFromContinueWatching(id, type) {
            try {
                const raw = localStorage.getItem('sv_continue_watching');
                if (!raw) return;
                let list = JSON.parse(raw);
                if (!Array.isArray(list)) return;
                list = list.filter(i => !(i.id === id && i.type === type));
                localStorage.setItem('sv_continue_watching', JSON.stringify(list));
            } catch (e) {}
        }

        function updateUrlTime() {
            if (!video || !initialSeekDone) return;
            const t = Math.floor(video.currentTime);
            const u = new URL(location.href);
            // Don't update if same to avoid unnecessary history churn
            if (u.searchParams.get('t') === String(t)) return;
            u.searchParams.set('t', t);
            history.replaceState(null, '', u.toString());
        }

        function resetAnimeSkipState() {
            animeSkipSegments = { intro: null, outro: null };
            skippedSegments = { intro: false, outro: false };
            hasApiSkipSegments = false;
            _lastSkipUiTime = 0;
            _skipBtnWasVisible = false;
            _clearSkipCountdown();
            if (skipSegmentBtn) {
                skipSegmentBtn.style.display = 'none';
                skipSegmentBtn.textContent = '';
                skipSegmentBtn.classList.remove('counting', 'countdown-paused');
            }
            updateSkipMarkers(); // Clear markers from seekbar
        }

        let aniSkipFetchStatus = 'none'; // 'none', 'fetching', 'success', 'failed'

        function normalizeSegmentWindow(segment) {
            if (!segment) return null;
            const start =
                Number(segment.start ?? segment.from ?? segment.begin ?? segment.startTime ?? segment[0]);
            const end =
                Number(segment.end ?? segment.to ?? segment.finish ?? segment.endTime ?? segment[1]);
            if (!Number.isFinite(start) || !Number.isFinite(end)) return null;
            if (end <= start) return null;
            return { start: Math.max(0, start), end: Math.max(0, end) };
        }

        function applyApiSkipSegments(payload) {
            if (!payload || !currentIsLikelyAnime) return false;

            const intro = normalizeSegmentWindow(
                payload.intro ||
                payload.skip?.intro ||
                payload.skips?.intro ||
                payload.timestamps?.intro
            );
            const outro = normalizeSegmentWindow(
                payload.outro ||
                payload.skip?.outro ||
                payload.skips?.outro ||
                payload.timestamps?.outro
            );

            if (!intro && !outro) {
                updateSkipMarkers();
                return false;
            }
            animeSkipSegments.intro = intro;
            animeSkipSegments.outro = outro;
            hasApiSkipSegments = true;
            aniSkipFetchStatus = 'success';
            updateSkipMarkers();
            return true;
        }

        function updateSkipMarkers() {
            const container = document.getElementById('skipMarkerContainer');
            if (!container) return;
            container.innerHTML = '';

            if (!hasApiSkipSegments || !video || !video.duration || !isFinite(video.duration) || video.duration <= 0) return;

            const dur = video.duration;
            const segments = [];
            if (animeSkipSegments.intro) segments.push({ ...animeSkipSegments.intro, type: 'intro' });
            if (animeSkipSegments.outro) segments.push({ ...animeSkipSegments.outro, type: 'outro' });

            segments.forEach(seg => {
                if (seg.start >= 0 && seg.end <= dur && seg.end > seg.start) {
                    const startPct = (seg.start / dur) * 100;
                    const endPct = (seg.end / dur) * 100;
                    const widthPct = endPct - startPct;

                    const marker = document.createElement('div');
                    marker.className = 'skip-marker';
                    if (seg.type) marker.dataset.type = seg.type;
                    marker.style.left = startPct + '%';
                    marker.style.width = widthPct + '%';
                    container.appendChild(marker);
                }
            });
        }

        function parseAniSkipResults(payload) {
            const results = Array.isArray(payload?.results) ? payload.results : [];
            let intro = null;
            let outro = null;
            for (const entry of results) {
                const type = String(entry?.skipType || entry?.skip_type || '').toLowerCase();
                const interval = entry?.interval || {};
                const seg = normalizeSegmentWindow({
                    start: interval.startTime ?? interval.start_time ?? entry?.startTime ?? entry?.start_time,
                    end: interval.endTime ?? interval.end_time ?? entry?.endTime ?? entry?.end_time,
                });
                if (!seg) continue;
                if (!intro && (type === 'op' || type === 'mixed-op' || type === 'opening')) intro = seg;
                if (!outro && (type === 'ed' || type === 'mixed-ed' || type === 'ending')) outro = seg;
            }
            return { intro, outro };
        }

        function getTitleMatchScore(media, queryTitle) {
            const norm = (v) => normalizeAnimeSearchQuery(v || '').toLowerCase();
            const q = norm(queryTitle);
            if (!q) return 0;

            const titles = [
                norm(media?.title?.english),
                norm(media?.title?.romaji),
                norm(media?.title?.native),
            ].filter(Boolean);
            if (!titles.length) return 0;

            let score = 0;
            for (const t of titles) {
                if (t === q) score = Math.max(score, 100);
                else if (t.includes(q) || q.includes(t)) score = Math.max(score, 70);
                else {
                    const qWords = q.split(' ').filter(Boolean);
                    const tWords = t.split(' ').filter(Boolean);
                    const common = qWords.filter((w) => tWords.includes(w)).length;
                    if (common > 0) {
                        const overlap = common / Math.max(1, qWords.length);
                        score = Math.max(score, Math.floor(overlap * 60));
                    }
                }
            }
            return score;
        }

        async function fetchAniSkipSegmentsForCurrentEpisode() {
            if (!currentIsLikelyAnime || MEDIA_TYPE !== 'tv') return false;
            const title = normalizeAnimeSearchQuery(currentMediaInfo?.title || currentMediaInfo?.name || '');
            const selectedSeason = tvSeasons?.[Number(curSeason || 0)];
            const seasonLabel = selectedSeason?.name || `Season ${Number(curSeason || 0) + 1}`;
            const targetSeasonNo = Number.isFinite(Number(selectedSeason?.seasonNo)) 
                ? Number(selectedSeason?.seasonNo) 
                : (Number(curSeason || 0) + 1);
            const episodeNum = Number(curEpisode || 0) + 1;
            if (!title || !Number.isFinite(episodeNum) || episodeNum <= 0) return false;

            const cacheKey = `${title.toLowerCase()}::${seasonLabel.toLowerCase()}::${episodeNum}`;
            if (animeSkipCache.has(cacheKey)) {
                const cached = animeSkipCache.get(cacheKey);
                if (cached) return applyApiSkipSegments(cached);
                return false;
            }

            try {
                aniSkipFetchStatus = 'fetching';
                console.log(`[aniskip] Fetching skip times for "${title}" ${seasonLabel} Ep ${episodeNum}...`);
                const gqlQuery = `
                  query ($search: String) {
                    Page(page: 1, perPage: 15) {
                      media(search: $search, type: ANIME, sort: POPULARITY_DESC) {
                        id
                        idMal
                        title { romaji english native }
                        seasonYear
                        format
                      }
                    }
                  }
                `;
                const aniRes = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ query: gqlQuery, variables: { search: title } }),
                    signal: AbortSignal.timeout(7000),
                });
                if (!aniRes.ok) {
                    aniSkipFetchStatus = 'failed';
                    resetAnimeSkipState();
                    return false;
                }
                const aniJson = await aniRes.json();
                const mediaList = Array.isArray(aniJson?.data?.Page?.media) ? aniJson.data.Page.media : [];
                
                mediaList.forEach(m => {
                    if (m.seasonYear) m.year = m.seasonYear;
                });
                const picked = pickAnimeResultByTitle(mediaList, title, null, targetSeasonNo, seasonLabel, MEDIA_TYPE === 'movie');
                
                if (!picked) {
                    resetAnimeSkipState();
                    return false;
                }
                const aniId = Number(picked.id || 0);
                const malId = Number(picked.idMal || 0);
                const candidateIds = [];
                if (aniId > 0) candidateIds.push(aniId);
                if (malId > 0 && malId !== aniId) candidateIds.push(malId);

                if (!candidateIds.length) {
                    resetAnimeSkipState();
                    return false;
                }

                const failedAny = (animeSkipCache.get('__failedIds__') || new Set());
                if (candidateIds.every(id => failedAny.has(id))) {
                    resetAnimeSkipState();
                    return false;
                }

                setTimeout(async () => {
                    let found = false;
                    for (const id of candidateIds) {
                        if (failedAny.has(id)) continue;
                        const u2 = `https://api.aniskip.com/v2/skip-times/${id}/${episodeNum}?types=op&types=ed&episodeLength=0`;
                        const u1 = `https://api.aniskip.com/v1/skip-times/${id}/${episodeNum}?types=op&types=ed`;
                        const skipUrls = [u2, u1, getProxiedUrl(u2), getProxiedUrl(u1)];

                        for (const url of skipUrls) {
                            try {
                                const skipRes = await fetch(url, {
                                    headers: { 'Accept': 'application/json' },
                                    signal: AbortSignal.timeout(6000),
                                });
                                if (skipRes.status === 404 || skipRes.status === 502 || skipRes.status === 500) {
                                  if (skipRes.status !== 404) failedAny.add(id); // Only mark ID as failed if it's a real server error
                                  continue;
                                }
                                if (!skipRes.ok) continue;
                                const skipJson = await skipRes.json();
                                const parsed = parseAniSkipResults(skipJson);
                                if (parsed.intro || parsed.outro) {
                                    console.log(`[aniskip] ✔ Found segments via ${url.includes('v1') ? 'v1' : 'v2'} API for ID ${id}`);
                                    animeSkipCache.set(cacheKey, parsed);
                                    applyApiSkipSegments(parsed);
                                    updateSkipSegmentButton();
                                    found = true;
                                    return;
                                }
                            } catch (_) { 
                                // On network failure, might be a proxy issue, try next URL
                            }
                        }
                    }
                    if (!found) {
                        animeSkipCache.set(cacheKey, null);
                        aniSkipFetchStatus = 'failed';
                        resetAnimeSkipState();
                    }
                    animeSkipCache.set('__failedIds__', failedAny);
                }, 100);
                return false;
            } catch (_) {
                animeSkipCache.set(cacheKey, null);
                aniSkipFetchStatus = 'failed';
                resetAnimeSkipState();
                return false;
            }
        }

        function getActiveSkipSegment(nowSec) {
            if (!Number.isFinite(nowSec)) return null;
            const intro = animeSkipSegments.intro;
            if (intro && nowSec >= intro.start && nowSec < intro.end) {
                return { type: 'intro', start: intro.start, end: intro.end };
            }
            const outro = animeSkipSegments.outro;
            if (outro && nowSec >= outro.start && nowSec < outro.end) {
                return { type: 'outro', start: outro.start, end: outro.end };
            }
            return null;
        }

        function updateSkipSegmentButton() {
            if (!video || !currentIsLikelyAnime || !hasApiSkipSegments) {
                if (skipSegmentBtn) skipSegmentBtn.style.display = 'none';
                _clearSkipCountdown();
                _skipBtnWasVisible = false;
                return;
            }

            const nowSec = Number(video.currentTime || 0);
            if (nowSec < (_lastSkipUiTime - 1)) {
                rearmSkippedSegmentsForTime(nowSec);
            }
            _lastSkipUiTime = nowSec;
            const active = getActiveSkipSegment(nowSec);

            // Countdown state is sticky: once auto-skip starts, keep it pinned to the captured segment.
            if (_skipActiveType && _skipActiveSegment && skipSegmentBtn && skipSegmentBtn.classList.contains('counting')) {
                const seg = _skipActiveSegment;
                if (skippedSegments[_skipActiveType]) {
                    _clearSkipCountdown();
                    _skipBtnWasVisible = false;
                    if (skipSegmentBtn) skipSegmentBtn.style.display = 'none';
                    return;
                }

                // Only cancel if the user actually seeks away from the captured segment window.
                if (nowSec < seg.start - 5 || nowSec > seg.end + 5) {
                    console.log(`[Skip] User moved far from ${_skipActiveType} segment. Resetting.`);
                    _clearSkipCountdown();
                    _skipBtnWasVisible = false;
                } else {
                    const icon = _skipActiveType === 'intro' ? 'fa-forward' : 'fa-forward-step';
                    skipSegmentBtn.innerHTML = `<i class="fa-solid ${icon}"></i><span>${_skipActiveType === 'intro' ? 'Skip Intro' : 'Skip Outro'}</span>`;
                    skipSegmentBtn.dataset.segmentType = _skipActiveType;
                    skipSegmentBtn.style.display = 'inline-flex';
                    return;
                }
            }

            if (!active || skippedSegments[active.type]) {
                _skipBtnWasVisible = false;
                if (skipSegmentBtn) skipSegmentBtn.style.display = 'none';
                _clearSkipCountdown();
                return;
            }

            // Sync UI markers
            const markers = document.querySelectorAll('.skip-marker');
            markers.forEach(m => {
                if (active && m.dataset.type === active.type) {
                    m.classList.add('active');
                } else {
                    m.classList.remove('active');
                }
            });

            if (!hasApiSkipSegments) {
                if (skipSegmentBtn) skipSegmentBtn.style.display = 'none';
                _clearSkipCountdown();
                _skipBtnWasVisible = false;
                return;
            }

            if (!active) {
                if (skipSegmentBtn) skipSegmentBtn.style.display = 'none';
                _clearSkipCountdown();
                _skipBtnWasVisible = false;
                return;
            }

            const alreadySkipped = (active.type === 'intro' && skippedSegments.intro) ||
                (active.type === 'outro' && skippedSegments.outro);

            if (alreadySkipped) {
                if (skipSegmentBtn) skipSegmentBtn.style.display = 'none';
                _clearSkipCountdown();
                _skipBtnWasVisible = false;
                return;
            }

            // Detect NEW segment detection to start countdown
            if (!_skipBtnWasVisible) {
                _skipBtnWasVisible = true;
                _startSkipCountdown();
            }

            if (skipSegmentBtn) {
                const icon = active.type === 'intro' ? 'fa-forward' : 'fa-forward-step';
                skipSegmentBtn.innerHTML = `<i class="fa-solid ${icon}"></i><span>${active.type === 'intro' ? 'Skip Intro' : 'Skip Outro'}</span>`;
                skipSegmentBtn.dataset.segmentType = active.type;
                skipSegmentBtn.style.display = 'inline-flex';
            }
        }

        function showControlSurface() {
            if (isUiLocked || !video) {
                controlSurface.classList.remove('visible');
                playerHeader.classList.add('hidden');
                document.body.classList.add('player-cursor-hidden');
                return;
            }
            controlSurface.classList.add('visible');
            playerHeader.classList.remove('hidden');
            document.body.classList.remove('player-cursor-hidden');

            clearTimeout(controlsHideTimer);
            clearTimeout(headerTimer);

            // Auto-hide after 3 seconds
            const hideDelay = 3000;

            controlsHideTimer = setTimeout(() => {
                // Check if any menu is open - if so, extend the hold time
                const hasOpenMenu = document.querySelector('.control-menu.active, .panel.open');
                if (hasOpenMenu) {
                    // Extend hold time by 3 seconds when menu is open
                    controlsHoldVisibleUntil = Date.now() + 3000;
                    showControlSurface();
                    return;
                }

                if (Date.now() < controlsHoldVisibleUntil) {
                    showControlSurface();
                    return;
                }
                if (video && !video.paused) {
                    controlSurface.classList.remove('visible');
                    playerHeader.classList.add('hidden');
                    document.body.classList.add('player-cursor-hidden');
                    closeCustomMenus();
                }
            }, hideDelay);
        }

        let controlsShownAt = 0;
        function holdControlsVisible(ms = 900) {
            // Enforce minimum 3 seconds on all devices
            const minHold = 3000;
            const effectiveMs = Math.max(ms, minHold);
            controlsHoldVisibleUntil = Math.max(controlsHoldVisibleUntil, Date.now() + effectiveMs);
            controlsShownAt = Date.now();
            lastTap = 0; // Reset double-tap sequence on reveal to avoid accidental skips
            showControlSurface();
        }

        function toggleControls() {
            if (isUiLocked || !video) return;
            // Prevent immediate toggle-off if they were just shown by a tap-down interaction
            if (Date.now() - controlsShownAt < 350) return;

            if (controlSurface.classList.contains('visible')) {
                hideControlSurfaceNow();
            } else {
                holdControlsVisible(3000);
            }
        }

        function hideControlSurfaceNow() {
            clearTimeout(controlsHideTimer);
            clearTimeout(headerTimer);
            controlSurface.classList.remove('visible');
            playerHeader.classList.add('hidden');
            document.body.classList.add('player-cursor-hidden');
            closeCustomMenus();
            lastTap = 0; // Reset double-tap sequence on hide
        }

        function buildQualityMenuItems() {
            qualityMenu.innerHTML = '';
            const formatQualityLabel = (height) => {
                const h = Number(height) || 0;
                let tier = '';
                if (h >= 2160) tier = 'UHD';
                else if (h >= 1440) tier = 'QHD';
                else if (h >= 1080) tier = 'FHD';
                else if (h >= 720) tier = 'HD';
                else if (h > 0) tier = 'SD';
                return tier ? `${h}p (${tier})` : `${h}p`;
            };

            const isAuto = !hlsInst || hlsInst.autoLevelEnabled !== false;

            const autoItem = document.createElement('div');
            autoItem.className = `menu-item ${isAuto ? 'selected' : ''}`;
            autoItem.textContent = 'Auto';
            autoItem.onclick = () => {
                changeQuality(0);
                buildQualityMenuItems();
            };
            qualityMenu.appendChild(autoItem);

            if (!hlsInst || !Array.isArray(hlsInst.levels) || hlsInst.levels.length === 0) return;
            const heights = [...new Set(hlsInst.levels.map((l) => l.height).filter(Boolean))].sort((a, b) => a - b);

                ? hlsInst.nextLevel

            heights.forEach((h) => {
                const isSelected = !isAuto && activeIndex >= 0 && hlsInst.levels[activeIndex]?.height === h;
                const item = document.createElement('div');
                item.className = `menu-item ${isSelected ? 'selected' : ''}`;
                item.textContent = formatQualityLabel(h);
                item.onclick = () => {
                    changeQuality(h);
                    buildQualityMenuItems();
                };
                qualityMenu.appendChild(item);
            });
        }

        function bindVideoEvents() {
            if (!video || video.dataset.customBound === '1') return;
            video.dataset.customBound = '1';
            video.addEventListener('error', () => {
                const err = video.error;
                let msg = 'Unknown Error';
                if (err) {
                    switch (err.code) {
                        case 1: msg = 'MEDIA_ERR_ABORTED'; break;
                        case 2: msg = 'MEDIA_ERR_NETWORK'; break;
                        case 3: msg = 'MEDIA_ERR_DECODE'; break;
                        case 4: msg = 'MEDIA_ERR_SRC_NOT_SUPPORTED'; break;
                    }
                    console.error('[video] Fatal Error:', msg, err.message || '');
                }
            });
            ['stalled', 'suspend', 'waiting', 'emptied'].forEach(evt => {
                video.addEventListener(evt, () => console.warn(`[video] State event: ${evt}`));
            });
            video.addEventListener('timeupdate', () => {
                clearOverlaysOnPlaybackProgress(0.2);
                syncTimeUI();
                updateSkipSegmentButton();
                updateNextEpisodeButton(false);
                saveProgress();
                updateUrlTime();
                
                // Continuous Subtitle Sync: Ensures image-based and text subtitles are 
                // always rendered even if the 'cuechange' event was missed or delayed.
                if (activeSubtitleTrackIndex >= 0 && video.textTracks[activeSubtitleTrackIndex]) {
                    renderSubtitleOverlayFromTrack(video.textTracks[activeSubtitleTrackIndex]);
                } else {
                    renderSubtitleOverlayFromTrack(null);
                }

                // Self-healing overlay hide for iOS native HLS:
                // If the video is clearly playing (time is advancing, not paused)
                // but the buffering overlay is still visible, force it away.
                // This catches cases where 'canplay'/'playing' fired before
                // initPlyr() set up Plyr's event listeners.
                if (!hlsInst && IS_IOS) {
                    const overlay = document.getElementById('transition-overlay');
                    if (overlay && overlay.classList.contains('active') && !video.paused && video.currentTime > 0) {
                        hideTransitionOverlay();
                    }
                }
            });
            video.addEventListener('seeked', () => {
                // Immediately re-evaluate after any seek so the countdown
                // resets if the user jumps back past the 30-second threshold.
                updateNextEpisodeButton(false);
            });
            video.addEventListener('webkitbeginfullscreen', () => {
                document.body.classList.add('ios-native-player');
                // On iOS native fullscreen, our custom overlay is invisible, so we MUST use native tracks.
                activateTracksForIOSNativePlayer(true);
            });
            video.addEventListener('webkitendfullscreen', () => {
                document.body.classList.remove('ios-native-player');
                // Back in the browser inline mode, we want to use our custom overlay and hide native ones to avoid double subs.
                activateTracksForIOSNativePlayer(false);
            });
            // Backup listener for track propagation on iOS
            video.addEventListener('loadedmetadata', () => {
                if (IS_IOS) activateTracksForIOSNativePlayer(document.webkitDisplayingFullscreen);
            });
            video.addEventListener('loadedmetadata', () => {
                isSourceSwitching = false;
                clearOverlaysOnPlaybackProgress(0.01);
                syncTimeUI();
                updateSkipSegmentButton();
                updateNextEpisodeButton(false);
                updateCaptionsButtonVisibility();
                bindSubtitleCueListeners();
                buildCaptionsMenu();
                
                // Fallback seek for continue watching if canplay didn't work
                if (!initialSeekDone && startT > 0 && video) {
                    console.log('[loadedmetadata] Fallback resume seek to:', startT);
                    video.currentTime = startT;
                    initialSeekDone = true;
                }
            });
            video.addEventListener('loadeddata', () => {
                clearOverlaysOnPlaybackProgress(0.01);
            });
            if (video.textTracks && typeof video.textTracks.addEventListener === 'function') {
                video.textTracks.addEventListener('addtrack', (e) => {
                    const t = e.track;
                    if (t) t.mode = 'disabled';
                    silenceNativeTracks();
                    bindSubtitleCueListeners();
                    updateCaptionsButtonVisibility();
                    buildCaptionsMenu();
                });
                video.textTracks.addEventListener('change', () => {
                    silenceNativeTracks();
                    updateCaptionsButtonVisibility();
                    buildCaptionsMenu();
                });
            }
            video.addEventListener('play', () => {
                if (!_iosNativePlayerActive) silenceNativeTracks();
            });
            video.addEventListener('playing', () => {
                if (!_iosNativePlayerActive) silenceNativeTracks();
            });
            video.addEventListener('webkitbeginfullscreen', () => {
                console.log('[ios] Native fullscreen begin');
                _iosNativePlayerActive = true;
                document.body.classList.add('ios-native-player');
                
                // Allow CSS rules to update before native player probes
                setTimeout(() => {
                    activateTracksForIOSNativePlayer();
                }, 100);

                const overlay = document.getElementById('subtitleOverlay');
                if (overlay) overlay.style.display = 'none';
            });
            video.addEventListener('webkitendfullscreen', () => {
                console.log('[ios] Native fullscreen end');
                document.body.classList.remove('ios-native-player');

        function initMobileSheetDragToClose() {
            const sheets = [sourcePanel, epPanel, audioPanel, qualityMenu, captionsMenu, playbackMenu, preferencesMenu, volumeMenu].filter(Boolean);
            const state = new WeakMap();
            const isSheetOpen = (el) => el.classList.contains('active') || el.classList.contains('open');

            sheets.forEach((sheet) => {
                state.set(sheet, { dragging: false, startY: 0, startAt: 0, dy: 0 });

                const onStart = (e) => {
                    if (!IS_MOBILE_CLIENT || !isSheetOpen(sheet)) return;
                    const touch = e.touches?.[0];
                    if (!touch) return;
                    const rect = sheet.getBoundingClientRect();
                    const yInSheet = touch.clientY - rect.top;
                    // Start drag from top grab area (80px)
                    if (yInSheet > 80) return;
                    const s = state.get(sheet);
                    s.dragging = true;
                    s.startY = touch.clientY;
                    s.startAt = Date.now();
                    s.dy = 0;
                    sheet.classList.add('sheet-dragging');
                };

                const onMove = (e) => {
                    const s = state.get(sheet);
                    if (!s.dragging) return;
                    const touch = e.touches?.[0];
                    if (!touch) return;

                    const deltaY = touch.clientY - s.startY;

                    // Responsive dragging with rubber-band effect
                    if (deltaY < 0) {
                        // Dragging upwards: apply resistance
                        s.dy = deltaY * 0.25;
                    } else {
                        // Dragging downwards: 1:1 movement
                        s.dy = deltaY;
                    }

                    sheet.style.transform = `translateY(${s.dy}px)`;

                    // Adjust opacity based on downward drag distance
                    if (s.dy > 0) {
                        sheet.style.opacity = Math.max(0.6, 1 - (s.dy / sheet.offsetHeight));
                    } else {
                        sheet.style.opacity = "1";
                    }

                    if (e.cancelable) e.preventDefault();
                };

                const onEnd = () => {
                    const s = state.get(sheet);
                    if (!s.dragging) return;
                    s.dragging = false;

                    const elapsed = Date.now() - s.startAt;
                    const velocity = s.dy / (elapsed || 1);

                    // Close if dragged down far enough (120px) or swiped down fast
                    const shouldClose = s.dy > 120 || (velocity > 0.6 && s.dy > 30);

                    sheet.classList.remove('sheet-dragging');

                    if (shouldClose) {
                        animateCloseMenuElement(sheet);
                    } else {
                        // Spring back animation
                        sheet.classList.add('sheet-animating');
                        sheet.style.transform = '';
                        sheet.style.opacity = '';
                        setTimeout(() => sheet.classList.remove('sheet-animating'), 300);
                    }
                };

                sheet.addEventListener('touchstart', onStart, { passive: true });
                sheet.addEventListener('touchmove', onMove, { passive: false });
                sheet.addEventListener('touchend', onEnd, { passive: true });
                sheet.addEventListener('touchcancel', onEnd, { passive: true });
            });
        }

        // Update audio track selector UI
        function updateAudioTracks() {
            if (!audioPanel || !audioBtn) return;

            const hlsTracks = (hlsInst && Array.isArray(hlsInst.audioTracks)) ? hlsInst.audioTracks : [];
            const hasSatoruSources = satoruAudioSources.length > 0;

            // iOS Safari uses native HLS (no HLS.js), so hlsInst is null.
            // Read WebKit's native AudioTrackList from the <video> element instead.
            const iosNativeTracks = (!hlsInst && video && video.audioTracks && video.audioTracks.length > 0)
                ? Array.from(video.audioTracks)
                : [];

            const hasAnyTracks = hlsTracks.length > 0 || hasSatoruSources || iosNativeTracks.length > 0;

            audioBtn.style.display = 'flex';

            if (!hasAnyTracks) {
                audioPanel.innerHTML = `
                    <div class="panel-label">Audio Track</div>
                    <div class="audio-item">No audio tracks available</div>
                `;
                return;
            }

            const currentHlsTrack = hlsInst ? hlsInst.audioTrack : -1;
            const isOnSatoru = currentAudioSource === 'satoru';

            audioPanel.innerHTML = '<div class="panel-label">Audio Track</div>';

            const renderedLabels = new Set();
            const addItem = (label, isActive, onClick) => {
                if (renderedLabels.has(label)) return;
                renderedLabels.add(label);
                const item = document.createElement('div');
                item.className = 'audio-item' + (isActive ? ' active' : '');
                item.innerHTML = `<span class="src-dot"></span>${label}`;
                item.onclick = onClick;
                audioPanel.appendChild(item);
            };

            // Decide whether to show the native/hls tracks menu
            const showPlayerTracks = !isOnSatoru || !hlsInst;

            if (showPlayerTracks) {
                hlsTracks.forEach((track) => {
                    let label = track.name || track.lang || 'Default';
                    const isGeneric = label.toLowerCase() === 'default' || label.toLowerCase() === 'und' || label.toLowerCase() === 'auto';
                    
                    // Skip generic 'auto'/'und' tracks if we have virtual tracks from Vegamovies/Satoru
                    if (isGeneric && hasSatoruSources) return;

                    if (isGeneric) label = 'Japanese';
                    const isActive = track.id === currentHlsTrack;
                    addItem(label, isActive, () => {
                        if (hlsInst) {
                            hlsInst.audioTrack = track.id;
                            rememberAudioPreference(track);
                            updateAudioTracks();
                        }
                    });
                });

                // iOS Safari native AudioTrackList (when HLS.js is not used)
                if (iosNativeTracks.length > 0) {
                    iosNativeTracks.forEach((track) => {
                        let label = track.label || track.language || 'Default';
                        if (!label || label === 'und') label = 'Japanese';
                        const isActive = track.enabled;
                        addItem(label, isActive, () => {
                            // Disable all tracks then enable the picked one
                            iosNativeTracks.forEach(t => { t.enabled = false; });
                            track.enabled = true;
                            if (typeof IS_IOS !== 'undefined' && IS_IOS && typeof video !== 'undefined' && video && video.readyState >= 1) {
                                video.currentTime = video.currentTime + 0.001;
                            }
                            rememberAudioPreference({ lang: track.language, name: track.label });
                            updateAudioTracks();
                        });
                    });
                }
            }
            
            if (isOnSatoru) {
                // Return to original JustAnime track
                const jaSource = allSources.find((s) => s.provider === 'justanime');
                if (jaSource) {
                    addItem('Japanese (Alt Source)', false, () => {
                        const resumeAt = Math.max(0, Number(video?.currentTime || 0));
                        audioSwitchInFlightUntil = Date.now() + 9000;
                        hlsFragErrorBurst = 0;
                        hlsSessionIsFragile = false;
                        pendingJumpTarget = null;
                        currentAudioSource = 'justanime';
                        activeSatoruTrackIndex = -1;
                        rememberProviderPreference('justanime');
                        syncUrlState();
                        if (jaSource.isM3U8 && Hls.isSupported() && typeof hlsInst !== 'undefined' && hlsInst) {
                            svSwitchHlsSourceSilent(jaSource.url, jaSource.referer, () => { }, resumeAt);
                        } else {
                            loadStream(jaSource.url, !!jaSource.isM3U8, !!jaSource.isEmbed, jaSource.referer, currentIdx, resumeAt);
                        }
                    });
                }
            }

            // Virtual source-backed tracks (used for multi-language variants)
            const showVirtualSatoruTracks = hasSatoruSources;
            if (showVirtualSatoruTracks) {
                satoruAudioSources.forEach((src, idx) => {
                    const isActive = isOnSatoru && activeSatoruTrackIndex === idx;
                    addItem(src.label, isActive, () => {
                        if (isOnSatoru && activeSatoruTrackIndex === idx) return;

                        // Set state immediately for UI 
                        currentAudioSource = 'satoru';
                        activeSatoruTrackIndex = idx;

                        // IMPORTANT: Set preferredAudioToken to the specific track name/label WITHOUT the provider suffix
                        let rawToken = src.hlsTrackName || src.label || '';
                        preferredAudioToken = rawToken.replace(/\s*\(.*?\)\s*/g, '').trim().toLowerCase();

                        if (preferredSourceLabelMatch) preferredSourceLabelMatch = preferredAudioToken;
                        rememberProviderPreference('satoru');
                        syncUrlState();

                        updateAudioTracks(); // Render optimistic UI
                        const resumeAt = Math.max(0, Number(video?.currentTime || 0));
                        audioSwitchInFlightUntil = Date.now() + 9000;
                        hlsFragErrorBurst = 0;
                        hlsSessionIsFragile = false;
                        pendingJumpTarget = null;

                        const urlChanged = src.url !== currentStreamUrl;

                        if (!isOnSatoru || urlChanged) {
                            // Update global state immediately so subsequent switches register the new URL
                            currentStreamUrl = src.url;
                            currentStreamReferer = src.referer;
                            
                            // Ultra-fast zero-lag audio track switching
                            if (src.isM3U8 && Hls.isSupported() && typeof hlsInst !== 'undefined' && hlsInst) {
                                const currentTime = Math.max(0, Number(video?.currentTime || 0));
                                const wasPlaying = !video?.paused;

                                console.log('Zero-lag audio switch to satoru:', src.label, 'at time:', currentTime);

                                // Use zero-lag switching if available, otherwise fallback
                                if (typeof svZeroLagAudioSwitch === 'function') {
                                    svZeroLagAudioSwitch(src.url, src.referer, currentTime, wasPlaying, () => {
                                        svApplyPreferredAudioToHls(hlsInst);

                                        // Instant playback resumption
                                        if (wasPlaying && video) {
                                            video.play().catch(() => {
                                                video.muted = true;
                                                video.play().catch(() => { });
                                            });
                                        }
                                    });
                                } else if (typeof svUltraSeamlessAudioSwitch === 'function') {
                                    // Fallback to ultra-seamless
                                    svUltraSeamlessAudioSwitch(src.url, src.referer, currentTime, wasPlaying, () => {
                                        svApplyPreferredAudioToHls(hlsInst);

                                        if (wasPlaying && video) {
                                            setTimeout(() => {
                                                video.play().catch(() => {
                                                    video.muted = true;
                                                    video.play().catch(() => { });
                                                });
                                            }, 50);
                                        }
                                    });
                                } else {
                                    // Final fallback to standard switching
                                    svSwitchHlsSourceSilent(src.url, src.referer, () => {
                                        svApplyPreferredAudioToHls(hlsInst);

                                        if (wasPlaying && video) {
                                            setTimeout(() => {
                                                video.play().catch(() => {
                                                    video.muted = true;
                                                    video.play().catch(() => { });
                                                });
                                            }, 100);
                                        }
                                    }, resumeAt);
                                }
                            } else {
                                loadStream(src.url, !!src.isM3U8, !!src.isEmbed, src.referer, currentIdx, resumeAt);
                            }
                        } else {
                            if (hlsInst && src.isM3U8) {
                                svApplyPreferredAudioToHls(hlsInst);
                                updateAudioTracks();
                            } else {
                                // Already on virtual-mode playback with non-HLS source.
                                loadStream(src.url, !!src.isM3U8, !!src.isEmbed, src.referer, currentIdx, resumeAt);
                            }
                        }
                    });
                });
            }
        }

        let skipAccumulator = 0;
        let skipAccumulatorSide = null;
        let skipAccumulationTimer = null;
        const tapThreshold = 300;

        function registerSkipPulse(side, step = 10) {
            if (skipAccumulatorSide !== side) skipAccumulator = 0;
            skipAccumulatorSide = side;
            skipAccumulator += step;
            playRipple(side, skipAccumulator);

            clearTimeout(skipAccumulationTimer);
            skipAccumulationTimer = setTimeout(() => {
                skipAccumulator = 0;
                skipAccumulatorSide = null;
            }, tapThreshold + 150);
        }

        function playRipple(side, amount = 10) {
            const el = document.getElementById(`ripple-${side}`);
            if (!el) return;

            const label = el.querySelector('span');
            if (label) {
                label.textContent = side === 'left' ? `-${amount}s` : `+${amount}s`;
            }

            el.classList.remove('animate');
            void el.offsetWidth; // trigger reflow
            el.classList.add('animate');

            if (el.rippleTimeout) clearTimeout(el.rippleTimeout);
            el.rippleTimeout = setTimeout(() => el.classList.remove('animate'), 700);
        }

                        wholeSecond === window.previewLastSecond &&
                        now - (window.previewLastRequestAt || 0) < 350
                    ) return;
                    window.previewLastSecond = wholeSecond;
                    window.previewLastRequestAt = now;

                    // ENHANCED: Improved frame seeking strategy
                    // Try to get exact second, then with small offset for keyframe variety
                    window.previewTargetTime = wholeSecond;
                    window.previewTargetTimeAlt = wholeSecond + 0.15; // Fallback offset
                    window.performPreviewSeek();
                }
            }

            window.performPreviewSeek = function () {
                const previewVideo = document.getElementById('previewVideo');
                if (!previewVideo || window.previewTargetTime === undefined) return;
                if (previewVideo.readyState < 1) {
                    if (!window.previewRetryReadyTimer) {
                        window.previewRetryReadyTimer = setTimeout(() => {
                            window.previewRetryReadyTimer = null;
                            window.performPreviewSeek?.();
                        }, 120);
                    }
                    return;
                }
                if (window.previewSeekInFlight) return;

                // ENHANCED: Canvas-only fallback for unstable preview pipelines.
                if (window.previewUseCanvasFallbackOnly) {
                    const rounded = Math.round(Number(window.previewTargetTime || 0));
                    const frameData = captureFromMainVideo(rounded);
                    if (frameData) {
                        cachePreviewFrame(rounded, frameData);
                        showPreviewFrame(previewVideo, frameData);
                    } else if (!hasActivePreviewSource(previewVideo)) {
                        showPreviewPosterFallback(previewVideo);
                    }
                    return;
                }

                // Also skip if main video is actively seeking or just buffering
                if (video && video.seeking) {
                    return;
                }

                // Skip during auto-skip to prevent interference
                if (window.isAutoSkipping) {
                    return;
                }

                // ENHANCED: More responsive seek with better timing
                if (window.previewSeekTimer) clearTimeout(window.previewSeekTimer);
                window.previewSeekTimer = setTimeout(() => {
                    const previewDuration = isFinite(previewVideo.duration) && previewVideo.duration > 0
                        ? Number(previewVideo.duration)
                        : Number(video?.duration || 0);
                    if (!isFinite(previewDuration) || previewDuration <= 0) return;
                    const maxTime = Math.max(0, previewDuration - 0.05);
                    let target = Math.max(0, Math.min(Number(window.previewTargetTime || 0), maxTime));
                    const requestToken = (window.previewPreviewRequestToken || 0) + 1;
                    window.previewPreviewRequestToken = requestToken;

                    window.previewSeekInFlight = true;
                    let seekStarted = false;
                    try {
                        // ENHANCED: Check preview HLS health - more conservative to avoid main stream interference
                        if (window.previewHlsInst && window.previewHlsErrorCount < 8) {
                            try {
                                const levels = window.previewHlsInst.levels || [];
                                // Use level 1 if available (middle quality), fallback to 0
                                const targetLevel = levels.length > 1 ? 1 : 0;
                                window.previewHlsInst.autoLevelCapping = targetLevel;
                                window.previewHlsInst.currentLevel = targetLevel;
                                window.previewHlsInst.nextLevel = targetLevel;
                                window.previewHlsInst.loadLevel = targetLevel;
                                // Only start load if main video is not seeking
                                if (!video?.seeking) {
                                    window.previewHlsInst.startLoad(Math.max(0, target - 0.5));
                                }
                            } catch (_) { }
                        }

                        if (!video?.seeking) {
                            if (typeof previewVideo.fastSeek === 'function') {
                                previewVideo.fastSeek(target);
                            } else {
                                previewVideo.currentTime = target;
                            }
                            seekStarted = true;
                        }
                        capturePreviewFrameWhenReady(previewVideo, requestToken, target);
                    } catch (_) {
                        // Try fallback offset on error
                        if (window.previewTargetTimeAlt !== undefined && window.previewTargetTimeAlt !== target) {
                            target = Math.max(0, Math.min(Number(window.previewTargetTimeAlt), maxTime));
                            try {
                                if (typeof previewVideo.fastSeek === 'function') {
                                    previewVideo.fastSeek(target);
                                } else {
                                    previewVideo.currentTime = target;
                                }
                                capturePreviewFrameWhenReady(previewVideo, requestToken, target);
                            } catch (_) { }
                        }
                    } finally {
                        if (!seekStarted) window.previewSeekInFlight = false;
                        else setTimeout(() => {
                            if (window.previewPreviewRequestToken === requestToken) {
                                window.previewSeekInFlight = false;
                            }
                        }, 260);
                    }
                }, 8);
            };

            let lastInteractionAt = 0;

                // We ONLY intercept here if we need to reveal the UI.
                if (isControlsVisible) {

                    if (e.type === 'touchstart' || e.type === 'mousedown' || e.type === 'pointerdown') {

                    if (e.type === 'click') {
                        e.preventDefault();

                        return false;
                    }
                } else {
                    // HIDDEN: Reveal controls
                    if (e.type === 'touchstart' || e.type === 'mousedown' || e.type === 'pointerdown') {

                const isOnInteractive = e.target.closest('button, input[type="range"], .seek-wrapper, .control-menu, .panel, .ep-item, .src-item, .audio-item, .menu-item, .ctrl-btn, .ctrl-icon, .back-btn');

            // ─── ADVANCED INTERACTION HANDLER ───
            // Handles: Double-tap Skip and Single-tap Hide. Play/pause stays on the play button only.
            function handleSurfaceInteraction(e) {
                // UI Lock bypass
                const isLockedAction = e.target.closest('#uiLockBtn, .ui-lock-btn, #skipSegmentBtn, .skip-segment-btn, #nextEpisodeBtn, .next-episode-btn');
                if (isLockedAction) return; 
                if (isUiLocked) return;
                const isOnInteractive = e.target.closest('button, input[type="range"], .seek-wrapper, .control-menu, .panel, .ep-item, .src-item, .audio-item, .menu-item, .ctrl-btn, .ctrl-icon, .back-btn, .a2hs-close');
                if (isOnInteractive) return;

                const now = Date.now();
                const isVisible = controlSurface.classList.contains('visible');

                const diff = now - lastTap;

                    clearTimeout(window.singleTapTimeout);
                    lastTap = 0; // Reset chain

                        registerSkipPulse('left', 10);
                        requestSeekToTime(Math.max(0, (video.currentTime || 0) - 10), true);
                    } else if (x > 2 * third) {
                        registerSkipPulse('right', 10);
                        if (isFinite(video.duration)) requestSeekToTime(Math.min(video.duration, (video.currentTime || 0) + 10), true);

                    if (isGesturing) return;

                        hideControlSurfaceNow();

                        // We do nothing else here.
                    }

                    }

        }

        // -----------------------------------------------------------------------

        // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        async function init() {
            if (!TMDB_ID) { showError('Missing ID', 'No media ID was provided.'); return; }

            setLoader('Fetching media info...', 'Connecting to TMDB');
            buildChips();

            // Safety timeout
            const safetyTimer = setTimeout(() => {
                if (loader.style.display !== 'none') {
                    showError('Timeout', 'Loading took too long. Please try again.');
                }
            }, 60000);

            try {
                const isAnimeOnlyProvider = ['satoru', 'animesalt'].includes(FORCED_PROVIDER);
                const providerNeedsMetaInfo = false;
                const infoUrls = (FORCED_PROVIDER && !isAnimeOnlyProvider && !providerNeedsMetaInfo)
                    ? [
                        `${API_BASE.replace('/meta/tmdb', '/movies/' + FORCED_PROVIDER)}/info?id=${encodeURIComponent(TMDB_ID)}&type=${encodeURIComponent(MEDIA_TYPE)}`,
                    ]
                    : [
                        `${API_BASE}/info/${TMDB_ID}?type=${MEDIA_TYPE}`,
                        `${API_BASE}/info?id=${encodeURIComponent(TMDB_ID)}&type=${encodeURIComponent(MEDIA_TYPE)}`,
                    ];

                let info = readCachedMediaInfo();
                if (info) {
                    // Verify cached info matches current TMDB_ID to prevent cross-contamination
                    if (String(info.id || info.tmdbId || '').trim() !== String(TMDB_ID).trim()) {
                        console.warn('Cached media info ID mismatch, clearing cache');
                        localStorage.removeItem(getMediaInfoCacheKey(true));
                        localStorage.removeItem(getMediaInfoCacheKey(false));
                        info = null;
                    } else {
                        setLoader('Fetching media info...', 'Loaded from local cache');
                        for (const infoUrl of infoUrls) {
                            fetchJsonWithRetry(infoUrl, 10000, 15000)
                                .then((fresh) => {
                                    const payload = fresh?.data || fresh;
                                    if (payload && typeof payload === 'object') writeCachedMediaInfo(payload);
                                })
                                .catch(() => { });
                        }
                    }
                } else {
                    let parsed = null;
                    let lastErr = null;
                    for (const infoUrl of infoUrls) {
                        try {
                            parsed = await fetchJsonWithRetry(infoUrl, 10000, 15000);
                            if (parsed) break;
                        } catch (e) {
                            lastErr = e;
                        }
                    }
                    info = parsed?.data || parsed;
                    if (!info || info.title === 'Unknown' || info.message === 'TMDB metadata fetch failed') {
                        console.warn('No valid info received, using fallback');
                        // Provide fallback info to prevent crashes
                        info = {
                            id: TMDB_ID,
                            title: 'Unknown Title',
                            name: 'Unknown Title',
                            type: MEDIA_TYPE,
                            genres: [],
                            original_language: 'en'
                        };
                        setLoader('Fetching media info...', 'Using fallback data (API unavailable)');
                    }
                }

                const needsTmdbFallback = MEDIA_TYPE === 'tv' && (
                    !info ||
                    !String(info.title || info.name || '').trim() ||
                    String(info.title || info.name || '').toLowerCase() === 'unknown' ||
                    !Array.isArray(info.seasons) ||
                    info.seasons.length === 0
                );
                if (needsTmdbFallback) {
                    try {
                        const fallbackInfo = await fetchJsonWithRetry(`${API_BASE}/info/${encodeURIComponent(TMDB_ID)}?type=${encodeURIComponent(MEDIA_TYPE)}`, 10000, 15000);
                        const fallbackPayload = fallbackInfo?.data || fallbackInfo;
                        if (fallbackPayload && typeof fallbackPayload === 'object') {
                            info = {
                                ...(fallbackPayload || {}),
                                ...(info || {}),
                                title: String((info && (info.title || info.name)) || fallbackPayload.title || fallbackPayload.name || 'Unknown Title'),
                                name: String((info && (info.name || info.title)) || fallbackPayload.name || fallbackPayload.title || 'Unknown Title'),
                                seasons: Array.isArray(info?.seasons) && info.seasons.length ? info.seasons : (Array.isArray(fallbackPayload.seasons) ? fallbackPayload.seasons : []),
                                episodes: Array.isArray(info?.episodes) && info.episodes.length ? info.episodes : (Array.isArray(fallbackPayload.episodes) ? fallbackPayload.episodes : []),
                                original_language: info?.original_language || info?.originalLanguage || fallbackPayload.original_language || fallbackPayload.originalLanguage || 'en',
                                media_type: info?.media_type || info?.type || fallbackPayload.media_type || fallbackPayload.type || MEDIA_TYPE,
                                type: info?.type || fallbackPayload.type || MEDIA_TYPE,
                            };
                            console.warn('[init] Applied TMDB fallback metadata for TV seasons/episodes.');
                        }
                    } catch (fallbackErr) {
                        console.warn('[init] TMDB fallback metadata fetch failed:', fallbackErr?.message || fallbackErr);
                    }
                }

                currentMediaInfo = info;
                console.log('currentMediaInfo.title:', currentMediaInfo?.title, 'TMDB_ID:', TMDB_ID);
                updatePauseMediaPoster();
                flixhqAltServerAttempted = false;
                currentAnimeCanonicalInfo = null;
                currentAnimeCanonicalInfoPromise = null;
                currentAnimeCanonicalInfoKey = '';
                // Clear anime caches when loading new media to prevent cross-contamination
                justanimeAnimeIdCache.clear();
                animeProviderInfoCache.clear();
                animeSubtitleCache.clear();
                clearTimeout(safetyTimer);

                // Safety check: ensure info is valid
                if (!info || typeof info !== 'object') {
                    console.error('Invalid info object:', info);
                    // Create emergency fallback
                    info = {
                        id: TMDB_ID,
                        title: 'Unknown Title',
                        name: 'Unknown Title',
                        type: MEDIA_TYPE,
                        genres: [],
                        original_language: 'en'
                    };
                }

                const title = info.title || info.name || 'Unknown Title';
                document.title = `Watching: ${title} | StreamVerse`;
                document.getElementById('media-title').textContent = title;
                currentCoverUrl = resolveMediaPosterUrl(info, currentCoverUrl || '');
                if (currentCoverUrl) {
                    loader.style.backgroundImage = `url('${currentCoverUrl}')`;
                }
                updatePauseMediaPoster();

                const isTv = MEDIA_TYPE === 'tv' ||
                    (info.type || '').toLowerCase().includes('tv') ||
                    (info.type || '').toLowerCase().includes('series');

                const isLikelyAnime = await detectLikelyAnimeMedia(info);
                currentIsLikelyAnime = isLikelyAnime;
                aniSkipFetchStatus = 'none';
                resetAnimeSkipState();

                if (currentIsLikelyAnime) {
                    await getCanonicalAnimeInfo();
                }

                // Provider pool selection with anime detection:
                // - Forced provider: run only that provider.
                // - Anime content: use anime providers exclusively (most reliable for anime).
                // - Non-anime movies: FlixHQ first priority (fastest), then other non-anime providers.
                // - Non-anime TV: FlixHQ first, then other non-anime providers.
                if (['animekai', 'justanime'].includes(String(FORCED_PROVIDER || '').toLowerCase())) {
                    console.warn('[providers] Disabled anime provider ignored:', FORCED_PROVIDER);
                    FORCED_PROVIDER = '';
                }
                if (FORCED_PROVIDER) {
                    activeProviders = [FORCED_PROVIDER];
                } else if (currentIsLikelyAnime) {
                    // Anime detected: use only anime providers for best results
                    activeProviders = [...ANIME_PROVIDERS];
                    console.log('🎌 Anime detected! Using anime-only providers:', activeProviders);
                } else if (MEDIA_TYPE === 'movie') {
                    // Non-anime movie: prioritize FlixHQ (fastest), then other non-anime providers
                    activeProviders = ['flixhq'];
                    console.log('🎬 Non-anime movie: FlixHQ priority providers:', activeProviders);
                } else if (isTv) {
                    // Non-anime TV: prioritize FlixHQ, then other non-anime providers
                    activeProviders = ['flixhq'];
                    console.log('📺 Non-anime TV: FlixHQ priority providers:', activeProviders);
                } else {
                    // Fallback for unknown types
                    activeProviders = ['flixhq', ...ANIME_PROVIDERS];
                }
                console.log('activeProviders:', activeProviders, 'FORCED_PROVIDER:', FORCED_PROVIDER, 'isAnime:', currentIsLikelyAnime);
                buildChips();

                if (isTv) {
                    await initTv(info);
                } else {
